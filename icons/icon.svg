<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4339" />
      <stop offset="100%" stop-color="#0e231b" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0ece1" />
    </linearGradient>
    <filter id="folioShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Folio Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="#c5a059" stroke-width="4" opacity="0.45" />

  <!-- Open Folio Graphic (Matches auto_stories / binder brand icon) -->
  <g filter="url(#folioShadow)">
    <!-- Back Leaf Page Layers -->
    <path d="M 256,150 C 230,132 178,124 100,124 C 78,124 68,130 68,142 L 68,368 C 68,378 76,384 86,384 C 160,384 216,396 256,416 C 296,396 352,384 426,384 C 436,384 444,378 444,368 L 444,142 C 444,130 434,124 412,124 C 334,124 282,132 256,150 Z" fill="#2d6a5a" opacity="0.6" />

    <!-- Main Open Folio Leaves -->
    <!-- Left Leaf -->
    <path d="M 256,160 C 226,140 176,132 104,132 C 86,132 80,138 80,148 L 80,364 C 80,372 86,378 94,378 C 162,378 218,390 256,410 L 256,160 Z" fill="url(#pageGrad)" stroke="#c8ded7" stroke-width="3" />
    
    <!-- Right Leaf -->
    <path d="M 256,160 C 286,140 336,132 408,132 C 426,132 432,138 432,148 L 432,364 C 432,372 426,378 418,378 C 350,378 294,390 256,410 L 256,160 Z" fill="url(#pageGrad)" stroke="#c8ded7" stroke-width="3" />

    <!-- Center Spine & Binder Seam -->
    <path d="M 256,160 L 256,410" stroke="#c5a059" stroke-width="6" stroke-linecap="round" />

    <!-- Left Leaf Content Stems (Bold 16px-legible rule accents) -->
    <line x1="120" y1="190" x2="224" y2="190" stroke="#2d6a5a" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <line x1="120" y1="230" x2="224" y2="230" stroke="#2d6a5a" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <line x1="120" y1="270" x2="204" y2="270" stroke="#2d6a5a" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <line x1="120" y1="310" x2="216" y2="310" stroke="#2d6a5a" stroke-width="8" stroke-linecap="round" opacity="0.8" />

    <!-- Right Leaf Task / Calendar Accent Stamp -->
    <line x1="288" y1="190" x2="392" y2="190" stroke="#2d6a5a" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <line x1="288" y1="230" x2="392" y2="230" stroke="#2d6a5a" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <line x1="288" y1="270" x2="372" y2="270" stroke="#2d6a5a" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <line x1="288" y1="310" x2="360" y2="310" stroke="#2d6a5a" stroke-width="8" stroke-linecap="round" opacity="0.8" />

    <!-- Gold Brass Binder Ring Hinges -->
    <circle cx="256" cy="200" r="10" fill="#c5a059" />
    <circle cx="256" cy="285" r="10" fill="#c5a059" />
    <circle cx="256" cy="370" r="10" fill="#c5a059" />
  </g>
</svg>
