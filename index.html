<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Day Planner</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#1c2d27">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Day Planner">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">

  <style>
    :root {
      --shell-bg: #1c2d27;
      --shell-card: #fcfbfa;
      --shell-text: #1c2d27;
      --shell-gold: #c5a059;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      background-color: var(--shell-bg);
      color: var(--shell-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app-root {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #shell-skeleton {
      max-width: 650px;
      margin: 40px auto;
      padding: 30px;
      background: var(--shell-card);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 2px solid var(--shell-gold);
      text-align: center;
      animation: shellPulse 1.8s infinite ease-in-out;
    }
    .skeleton-header {
      font-family: Georgia, serif;
      font-size: 1.5rem;
      color: var(--shell-bg);
      margin-bottom: 12px;
    }
    .skeleton-line {
      height: 14px;
      background: #e5e0d8;
      border-radius: 4px;
      margin: 10px auto;
    }
    .skeleton-line.w-80 { width: 80%; }
    .skeleton-line.w-60 { width: 60%; }
    .skeleton-line.w-40 { width: 40%; }
    @keyframes shellPulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.65; }
    }
  </style>

  <!-- Vendor UI Runtime -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body>
  <div id="app-root">
    <!-- Instant Loading Skeleton Placeholder -->
    <div id="shell-skeleton" aria-label="Loading Day Planner">
      <h1 class="skeleton-header">Day Planner</h1>
      <div class="skeleton-line w-80"></div>
      <div class="skeleton-line w-60"></div>
      <div class="skeleton-line w-40"></div>
      <p style="font-size: 0.85rem; color: #736e65; margin-top: 16px;">Loading secure workspace...</p>
    </div>
  </div>

  <!-- PWA Bootloader Script -->
  <script type="module" src="src/shellLoader.js"></script>
</body>
</html>
