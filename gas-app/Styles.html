    --z-1: 1; --z-5: 5; --z-10: 10; --z-40: 40; --z-50: 50; --z-100: 100; --z-150: 150; --z-200: 200; --z-500: 500; --z-1000: 1000; --z-2000: 2000; --z-9999: 9999; --z-10000: 10000; /* stacking layers, values unchanged */

    --line-height-base: 1.5;

    --target-min: 24px; /* WCAG 2.2 SC 2.5.8 minimum pointer target */

    --duration-standard: 0.15s;
    --duration-slow: 0.2s;

    /* Day Planner Aesthetic Tokens */
    --bg-page: #12241d;
    --bg-parchment: #fcfbfa;
    --bg-binder: #142e23;
    --bg-card: #ffffff;
    --text-primary: #1c2826;
    --text-muted: #5c6b66;
    --heading-color: #142e23;
    --binder-teal: #2d6a5a;
    --binder-teal-hover: #1b4332;
    --binder-teal-focus: rgba(45, 106, 90, 0.25);
    --binder-teal-light: #e9f5f2;
    --border-line: #c8ded7;
    --priority-a: #1d5fa8;
    --priority-b: #5e3f6b;
    --priority-c: #2d6a5a;

    --note-color-green: #2b8a3e;

    --decision-text: #ffffff;
    --decision-rule: #1d5fa8;
    --decision-tint: rgba(29, 95, 168, 0.06);

    /* Subtle, Thematic Scrollbar Tokens (Light Mode - Parchment Cream & Slate Teal) */
    color-scheme: light;
    --scrollbar-thumb: rgba(45, 106, 90, 0.28);
    --scrollbar-thumb-hover: rgba(45, 106, 90, 0.50);
    --scrollbar-track: rgba(0, 0, 0, 0.04);
  }

  /* ==========================================
     Thematic Scrollbars (Standard & WebKit)
     ========================================== */
  html,
  body,
  * {
    scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    scrollbar-width: thin;
  }

  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: var(--scrollbar-track);
  }

  ::-webkit-scrollbar-thumb {
    background-color: var(--scrollbar-thumb);
    border-radius: 2px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  ::-webkit-scrollbar-thumb:hover {
    background-color: var(--scrollbar-thumb-hover);
  }

  ::-webkit-scrollbar-corner {
    background: transparent;
  }

  /* Force Headings to Dark Forest Green */
  h1, h2, h3, h4, h5, h6,
  .date-display,
  .panel-header-title,
  .view-title,
  .modal-title,
  .modal-title-with-icon {
    color: var(--heading-color) !important;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-family-base);
    background-color: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 56px 12px 8px 12px;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    line-height: var(--line-height-base);
    box-sizing: border-box;
  }

  /* Baseline Unopinionated Form Controls */
  input,
  select,
  textarea {
    font-family: inherit;
    font-size: 0.85rem;
    line-height: inherit;
    border: 1px solid var(--border-line);
    border-radius: 4px;
    background-color: var(--c-ffffff);
    color: var(--text-primary);
    padding: 6px 10px;
    box-sizing: border-box;
    transition: border-color var(--duration-standard) var(--ease-standard), box-shadow var(--duration-standard) var(--ease-standard);
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--binder-teal) !important;
    box-shadow: 0 0 0 2px var(--binder-teal-focus) !important;
  }

  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: none;
  }

  input:disabled,
  select:disabled,
  textarea:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    background-color: var(--c-rgba-0-0-0-0p04);
  }

  input::placeholder,
  textarea::placeholder {
    color: var(--text-muted);
  }

  /* Baseline Link Styling */
  a {
    color: var(--binder-teal);
    text-decoration: underline;
    transition: color var(--duration-standard) var(--ease-standard);
  }

  a:hover {
    color: var(--binder-teal-hover);
  }

  /* Baseline Button Reset */
  button {
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    color: inherit;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* Material Symbols Font Integration */
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-size: 1.25rem;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-smoothing: antialiased;
    vertical-align: middle;
  }

  /* Shared Interactive Element Resets (D.R.Y. Button Rule) */
  .search-trigger-btn,
  .tab-btn,
  .nav-btn,
  .status-btn,
  .star-toggle,
  .notes-indicator,
  .event-pill,
  .btn-primary,
  .btn-secondary,
  .btn-success,
  .error-close-btn {
    margin-bottom: 0;
    font-family: inherit;
  }

  /* Binder Outer Frame */
  .binder-container {
    width: 100%;
    max-width: 1720px;
    background: var(--bg-parchment);
    border-radius: 8px;
    box-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
    border: 4px solid var(--bg-binder);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: calc((100 * var(--vh)) - 16px);
    margin: 0;
    padding: 0;
  }

  /* Single Consolidated Top Bar (Fixed) */
  header.single-top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: var(--c-142e23) !important;
    color: var(--c-ffffff);
    padding: 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 0;
    border-bottom: 2px solid #0b1c15;
    box-shadow: 0 2px 8px var(--c-rgba-0-0-0-0p12);
    flex-wrap: nowrap;
    z-index: var(--z-1000);
    box-sizing: border-box;
    overflow: visible;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 0 0 auto;
    min-width: 0;
    overflow: visible;
  }

  .brand-title-compact {
    font-family: var(--font-family-header);
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    color: var(--c-ffffff) !important;
    white-space: nowrap;
  }

  .header-vdivider {
    width: 1px;
    height: 22px;
    background: rgba(255, 255, 255, 0.22);
    display: inline-block;
  }

  /* Compact Date Controls */
  .date-nav-compact {
    display: flex;
    align-items: center;
    min-width: 310px;
  }

  .date-controls-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-nav-btn {
    background: var(--c-rgba-255-255-255-0p15);
    border: 1px solid var(--c-rgba-255-255-255-0p25);
    color: var(--c-ffffff);
    width: 26px;
    height: 26px;
    padding: 0;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background var(--duration-standard) var(--ease-standard);
  }

  .icon-nav-btn:hover {
    background: var(--c-rgba-255-255-255-0p3);
  }

  .today-jump-btn {
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid var(--c-rgba-255-255-255-0p28);
    color: var(--c-ffffff);
    padding: 2px 9px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.78rem;
    cursor: pointer;
    transition: background var(--duration-standard) var(--ease-standard);
    width: auto;
    min-width: calc(10ch + 12px);
    justify-content: center;
    text-align: center;
  }

  .today-jump-btn:hover {
    background: rgba(255, 255, 255, 0.32);
  }

  .month-picker-wrap {
    position: relative;
    display: inline-flex;
  }

  .month-jump-btn {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding-right: 4px;
  }

  .month-jump-btn .dropdown-arrow {
    font-size: 1rem;
    line-height: 1;
    opacity: 0.85;
    transition: transform var(--duration-standard) var(--ease-standard);
  }

  .month-picker-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: var(--z-2000);
    background: var(--c-ffffff);
    border: 1px solid var(--c-d1d5db);
    border-radius: 4px;
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p22);
    padding: 10px;
    width: 220px;
  }

  [data-theme="dark"] .month-picker-dropdown {
    background: var(--c-1e2621);
    border-color: var(--c-33443a);
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p5);
  }

  .month-picker-year-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding: 0 2px 6px 2px;
    border-bottom: 1px solid var(--c-e5e7eb);
  }

  [data-theme="dark"] .month-picker-year-nav {
    border-bottom-color: var(--c-2b3a32);
  }

  .month-picker-year-nav .icon-nav-btn {
    background: var(--c-rgba-0-0-0-0p06);
    border: 1px solid var(--c-d1d5db);
    color: var(--c-1f2937);
  }

  .month-picker-year-nav .icon-nav-btn:hover {
    background: var(--c-rgba-0-0-0-0p12);
  }

  [data-theme="dark"] .month-picker-year-nav .icon-nav-btn {
    background: var(--c-rgba-255-255-255-0p1);
    border-color: var(--c-rgba-255-255-255-0p2);
    color: var(--c-f3f4f6);
  }

  [data-theme="dark"] .month-picker-year-nav .icon-nav-btn:hover {
    background: var(--c-rgba-255-255-255-0p2);
  }

  .month-picker-year-text {
    font-family: var(--font-family-header);
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--c-111827);
  }

  [data-theme="dark"] .month-picker-year-text {
    color: var(--c-f3f4f6);
  }

  .month-picker-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .month-picker-cell {
    padding: 6px 2px;
    font-size: 0.8rem;
    font-weight: 600;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: #374151;
    cursor: pointer;
    text-align: center;
    transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard);
  }

  .month-picker-cell:hover {
    background: var(--c-rgba-0-0-0-0p06);
  }

  [data-theme="dark"] .month-picker-cell {
    color: var(--c-d1d5db);
  }

  [data-theme="dark"] .month-picker-cell:hover {
    background: var(--c-rgba-255-255-255-0p1);
  }

  .month-picker-cell.is-current {
    border-color: var(--gold-accent, #c99700);
    font-weight: 700;
  }

  .month-picker-cell.is-selected {
    background: var(--color-primary-green, #1b4d3e) !important;
    color: var(--c-ffffff);
    font-weight: 700;
  }

  [data-theme="dark"] .month-picker-cell.is-selected {
    background: var(--c-2e7d32) !important;
    color: var(--c-ffffff);
  }

  .date-text-display {
    font-family: var(--font-family-header);
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--c-ffffff) !important;
    margin-left: 4px;
    white-space: nowrap;
    min-width: calc(14ch + 4px);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .date-picker-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
  }

  /* .date-picker-btn/.month-display-btn are combined with .today-jump-btn on the same button
     (see gas-app/Index.html), so fg/bg/border/radius/hover come from that shared class -- only
     the additive layout for the trailing dropdown arrow lives here. */
  .date-picker-btn,
  .month-display-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 4px;
    user-select: none;
  }

  .date-picker-btn .date-text-display,
  .month-display-btn .date-text-display {
    margin-left: 0;
    min-width: auto;
    font-weight: 600;
  }

  /* Fixed width (widest date + 1em) so the nav does not bounce while paging dates.
     Widest "Mon, Mar 30, 2026" measures ~8.5em in fallback serif; 12em covers wider webfonts. */
  .date-picker-btn .date-text-display {
    min-width: 8em;
    text-align: center;
  }

  .month-display-btn .date-text-display {
    min-width: 8em;
    text-align: center;
  }

  .date-picker-btn .dropdown-arrow,
  .month-display-btn .dropdown-arrow {
    font-size: 1rem;
    line-height: 1;
    opacity: 0.9;
    transition: transform var(--duration-standard) var(--ease-standard);
    color: var(--c-ffffff) !important;
  }

  .dropdown-arrow.arrow-up {
    transform: rotate(180deg);
  }

  /* Themed Day Calendar Dropdown Popover */
  .day-picker-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: var(--z-2000);
    background: var(--c-ffffff);
    border: 1px solid var(--border-line, var(--c-d1d5db));
    border-radius: 4px;
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p22);
    padding: 10px;
    width: 252px;
    user-select: none;
  }

  [data-theme="dark"] .day-picker-dropdown {
    background: var(--c-1e2621);
    border-color: var(--c-33443a);
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p55);
  }

  .day-picker-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--c-e5e7eb);
  }

  [data-theme="dark"] .day-picker-header {
    border-bottom-color: var(--c-2b3a32);
  }

  .day-picker-nav-btn {
    background: var(--c-rgba-0-0-0-0p06);
    border: 1px solid var(--c-d1d5db);
    color: var(--c-1f2937);
    width: 24px;
    height: 24px;
    padding: 0;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .day-picker-nav-btn:hover {
    background: var(--c-rgba-0-0-0-0p12);
  }

  [data-theme="dark"] .day-picker-nav-btn {
    background: var(--c-rgba-255-255-255-0p1);
    border-color: var(--c-rgba-255-255-255-0p2);
    color: var(--c-f3f4f6);
  }

  [data-theme="dark"] .day-picker-nav-btn:hover {
    background: var(--c-rgba-255-255-255-0p2);
  }

  .day-picker-month-label {
    font-family: var(--font-family-header);
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--c-111827);
  }

  [data-theme="dark"] .day-picker-month-label {
    color: var(--c-f3f4f6);
  }

  .day-picker-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-muted, #6b7280);
    margin-bottom: 4px;
  }

  [data-theme="dark"] .day-picker-weekdays {
    color: var(--c-8da49a);
  }

  .day-picker-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .day-picker-cell {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 2px;
    padding: 4px 0;
    text-align: center;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--c-1f2937);
    cursor: pointer;
    line-height: 1.2;
    transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard);
  }

  .day-picker-cell:hover {
    background: var(--c-rgba-45-106-90-0p12);
    border-color: var(--binder-teal, var(--c-2d6a5a));
  }

  .day-picker-cell.is-other-month {
    color: #9ca3af;
    opacity: 0.55;
  }

  .day-picker-cell.is-today {
    border-color: var(--binder-teal, var(--c-2d6a5a));
    font-weight: 700;
    color: var(--binder-teal, var(--c-2d6a5a));
  }

  .day-picker-cell.is-selected {
    background: var(--binder-teal, var(--c-2d6a5a)) !important;
    color: var(--c-ffffff) !important;
    font-weight: 700;
    border-color: var(--binder-teal, var(--c-2d6a5a)) !important;
  }

  [data-theme="dark"] .day-picker-cell {
    color: var(--c-e2f2ec);
  }

  [data-theme="dark"] .day-picker-cell:hover {
    background: rgba(121, 214, 189, 0.2);
    border-color: var(--c-79d6bd);
  }

  [data-theme="dark"] .day-picker-cell.is-other-month {
    color: #64748b;
  }

  [data-theme="dark"] .day-picker-cell.is-today {
    border-color: var(--c-79d6bd);
    color: var(--c-79d6bd);
  }

  [data-theme="dark"] .day-picker-cell.is-selected {
    background: var(--c-2d6a5a) !important;
    color: var(--c-ffffff) !important;
    border-color: var(--c-79d6bd) !important;
  }

  .day-picker-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--c-e5e7eb);
  }

  [data-theme="dark"] .day-picker-footer {
    border-top-color: var(--c-2b3a32);
  }

  .day-picker-today-btn {
    background: transparent;
    border: 1px solid var(--border-line, var(--c-d1d5db));
    border-radius: 2px;
    padding: 2px 10px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--binder-teal, var(--c-2d6a5a));
    cursor: pointer;
  }

  .day-picker-today-btn:hover {
    background: var(--c-rgba-45-106-90-0p1);
  }

  [data-theme="dark"] .day-picker-today-btn {
    border-color: var(--c-33443a);
    color: var(--c-79d6bd);
  }

  [data-theme="dark"] .day-picker-today-btn:hover {
    background: rgba(121, 214, 189, 0.15);
  }

  /* Master Tasks Due Date Widget */
  .master-task-due-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex: 0 0 170px;
  }

  .master-task-due-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    height: 36px;
    padding: 4px 8px;
    background: var(--bg-card, var(--c-ffffff));
    color: var(--text-primary);
    border: 1px solid var(--border-line);
    border-radius: 2px;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
  }

  .master-task-due-btn .due-btn-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .master-task-due-btn .due-clear-icon {
    font-size: 0.875rem;
    opacity: 0.6;
    cursor: pointer;
  }

  .master-task-due-btn .due-clear-icon:hover {
    opacity: 1;
    color: var(--c-ef4444);
  }

  .day-picker-dropdown-due {
    top: calc(100% + 4px);
    left: 0;
  }

  [data-theme="dark"] .master-task-due-btn {
    background: var(--c-11241c) !important;
    border-color: var(--c-244a3b);
    color: var(--c-e2f2ec);
  }

  /* View Navigation Tabs (Flat Underline - No Pills) */
  nav.view-segmented-control {
    display: flex;
    background: transparent;
    padding: 0;
    border-radius: 0;
    border: none;
    gap: 4px;
    align-items: stretch;
    height: 48px;
    flex: 0 0 auto;
    margin: 0 auto;
  }

  .segment-btn {
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    color: rgba(255, 255, 255, 0.75);
    padding: 0 12px;
    border-radius: 0;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color var(--duration-standard) var(--ease-standard), border-color var(--duration-standard) var(--ease-standard), background-color var(--duration-standard) var(--ease-standard);
    white-space: nowrap;
    width: auto;
    box-shadow: none;
  }

  .segment-btn .material-symbols-outlined {
    font-size: 1.125rem;
    color: rgba(255, 255, 255, 0.65);
    transition: color var(--duration-standard) var(--ease-standard);
  }

  .segment-btn:hover {
    color: var(--c-ffffff);
    background: rgba(255, 255, 255, 0.08);
    border-bottom: 3px solid rgba(255, 255, 255, 0.4);
  }

  .segment-btn:hover .material-symbols-outlined {
    color: var(--c-ffffff) !important;
  }

  .segment-btn.active {
    background: transparent;
    color: var(--c-ffffff);
    font-weight: 600;
    border-bottom: 3px solid var(--tab-gold);
    box-shadow: none;
  }

  .segment-btn.active .material-symbols-outlined {
    color: var(--tab-gold) !important;
  }

  /* Compact Actions */
  .header-actions-compact {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
    min-width: 0;
    justify-content: flex-end;
  }

  .search-trigger-compact {
    background: var(--c-rgba-255-255-255-0p15);
    border: 1px solid var(--c-rgba-255-255-255-0p25);
    color: var(--c-ffffff);
    padding: 3px 9px;
    border-radius: 4px;
    font-size: 0.8rem;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: background var(--duration-standard) var(--ease-standard);
    width: auto;
  }

  .search-trigger-compact:hover {
    background: var(--c-rgba-255-255-255-0p28);
  }

  .kbd-shortcut-sm {
    background: var(--c-rgba-0-0-0-0p2);
    color: rgba(255, 255, 255, 0.9);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-family: inherit;
  }

  .sync-btn-compact {
    background: var(--c-rgba-255-255-255-0p15);
    border: 1px solid var(--c-rgba-255-255-255-0p25);
    color: var(--c-ffffff);
    padding: 3px 9px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: background var(--duration-standard) var(--ease-standard);
    width: auto;
  }

  .sync-btn-compact:hover {
    background: var(--c-rgba-255-255-255-0p28);
  }

  .theme-toggle-compact {
    background: var(--c-rgba-255-255-255-0p15);
    border: 1px solid var(--c-rgba-255-255-255-0p25);
    color: var(--c-ffffff);
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background var(--duration-standard) var(--ease-standard);
  }

  .theme-toggle-compact:hover {
    background: var(--c-rgba-255-255-255-0p3);
  }

  /* Date nav: [<] date [>] + Today link only when off-today */
  .today-link-btn {
    background: transparent;
    border: none;
    color: var(--c-ffffff);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    white-space: nowrap;
  }

  .today-link-btn:hover {
    background: var(--c-rgba-255-255-255-0p2);
  }

  /* Icon-only Search / Sync and the View options popover */
  .search-trigger-compact,
  .sync-btn-compact,
  .view-options-btn {
    width: 28px;
    height: 28px;
    padding: 0;
    justify-content: center;
  }

  .view-options-wrap {
    position: relative;
  }

  .view-options-btn {
    background: var(--c-rgba-255-255-255-0p15);
    border: 1px solid var(--c-rgba-255-255-255-0p25);
    color: var(--c-ffffff);
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    cursor: pointer;
  }

  .view-options-btn:hover {
    background: var(--c-rgba-255-255-255-0p3);
  }

  .view-options-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: var(--z-2000);
    background: var(--c-ffffff);
    border: 1px solid var(--border-line, var(--c-d1d5db));
    border-radius: 4px;
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p22);
    padding: 10px 12px;
    min-width: 250px;
    color: var(--binder-teal);
  }

  [data-theme="dark"] .view-options-dropdown {
    background: var(--c-1e2621);
    border-color: var(--c-33443a);
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p55);
  }

  .view-options-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }

  .view-options-label {
    width: 44px;
    font-family: var(--font-family-header);
    font-size: 0.85rem;
  }

  .view-options-value {
    width: 38px;
    text-align: right;
    font-size: 0.75rem;
  }

  .view-options-theme-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--border-line, var(--c-d1d5db));
    color: inherit;
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 0.8rem;
  }

  .view-options-theme-btn:hover {
    background: var(--c-rgba-45-106-90-0p1);
  }

  /* Responsive Top Bar Layout Guards */
  @media (min-width: 1400px) {
    .header-left {
      flex: 1 1 auto;
      min-width: max-content;
    }
    .header-actions-compact {
      flex: 1 1 auto;
    }
  }

  @media (max-width: 1300px) {
    .kbd-shortcut-sm {
      display: none;
    }
    .search-label,
    .sync-label {
      display: none;
    }
    .segment-btn {
      padding: 0 8px;
      font-size: 0.8rem;
    }
  }

  @media (max-width: 1050px) {
    .brand-title-compact span:last-child {
      display: none;
    }
    nav.view-segmented-control {
      gap: 2px;
    }
    .segment-btn span:not(.material-symbols-outlined) {
      display: none;
    }
    .segment-btn {
      padding: 0 8px;
    }
    .header-vdivider {
      display: none;
    }
    .date-nav-compact {
      min-width: 0;
    }
    header.binder-header {
      gap: 8px;
      padding: 0 8px;
    }
  }

  /* Alpine Cloak Guard */
  [x-cloak] {
    display: none !important;
  }

  /* Main Workspace Spread */
  main.binder-body, section.binder-body {
    display: flex;
    flex: 1;
    overflow: hidden;
    margin: 0;
    padding: 0;
  }

  section.two-page-spread {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-parchment);
    margin: 0;
    box-sizing: border-box;
    gap: 0;
  }

  /* Column Resizer Controls */
  .column-resizer {
    width: 16px;
    margin: 0 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: col-resize;
    user-select: none;
    touch-action: none;
    z-index: var(--z-10);
    flex-shrink: 0;
    position: relative;
    border-radius: 4px;
    transition: background-color var(--duration-standard) var(--ease-standard);
  }

  .column-resizer:hover,
  .column-resizer.is-resizing {
    background-color: rgba(45, 106, 90, 0.15);
  }

  .resizer-handle {
    width: 4px;
    height: 48px;
    background-color: var(--border-line, var(--c-c8ded7));
    border-radius: 2px;
    transition: background-color var(--duration-slow) var(--ease-standard), height var(--duration-slow) var(--ease-standard), width var(--duration-slow) var(--ease-standard);
  }

  .column-resizer:hover .resizer-handle,
  .column-resizer.is-resizing .resizer-handle {
    background-color: var(--accent-sage, var(--c-2d6a5a));
    height: 80%;
    width: 5px;
  }

  .two-page-spread.is-resizing,
  .two-page-spread.is-resizing * {
    user-select: none !important;
    cursor: col-resize !important;
  }

  @media (min-width: 768px) {
    section.two-page-spread {
      display: flex;
      flex-direction: row;
    }

    section.two-page-spread .col-tasks {
      flex: 0 0 calc(var(--col1-w, 33.33%) - 12px);
      min-width: 180px;
      box-sizing: border-box;
    }

    section.two-page-spread .col-appointments {
      flex: 0 0 calc(var(--col2-w, 33.33%) - 12px);
      min-width: 180px;
      box-sizing: border-box;
    }

    section.two-page-spread .col-notes {
      flex: 0 0 calc(var(--col3-w, 33.34%) - 12px);
      min-width: 180px;
      box-sizing: border-box;
    }

    .column-resizer {
      display: flex;
    }
  }

  @media (max-width: 767px) {
    section.two-page-spread {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    section.two-page-spread .page-panel {
      width: 100%;
      flex: 1 1 auto;
    }

    .column-resizer {
      display: none;
    }
  }

  /* Ephemeral Column Focus / Maximize Mode (Zero localStorage Corruption) */
  .two-page-spread.has-maximized-column .page-panel:not(.is-maximized) {
    display: none;
  }
  .two-page-spread.has-maximized-column .column-resizer {
    display: none;
  }
  .two-page-spread.has-maximized-column .page-panel.is-maximized {
    width: 100%;
    flex: 1 1 100%;
    max-width: 100%;
  }

  article.page-panel {
    background: var(--c-ffffff);
    border: 1px solid var(--border-line);
    border-radius: var(--border-radius);
    padding: 20px;
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 0;
    min-width: 0;
    overflow-x: clip;
  }

  header.panel-header {
    font-family: var(--font-family-header);
    font-size: 1.2rem;
    color: var(--binder-teal);
    border-bottom: 2px solid var(--binder-teal);
    padding-bottom: 8px;
    height: 44px;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0;
    background: transparent;
  }

  .panel-header .btn-add-task-round {
    width: 32px;
    height: 32px;
    min-width: 32px;
  }

  .panel-header .btn-icon-subtle {
    height: 32px;
    box-sizing: border-box;
  }

  .panel-header-title {
    font-family: var(--font-family-header);
    font-size: 1.2rem;
    color: var(--binder-teal);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Form & Quick Add Bar (Clean Design) */
  form.task-quick-add-bar {
    display: flex;
    flex-wrap: nowrap;
    gap: 8px;
    margin-bottom: 0;
    align-items: center;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }
  
  form[role="group"].task-quick-add-bar {
    border-radius: var(--border-radius);
  }

  /* Proposal B: Segmented Letterpress Priority Selector */
  .priority-segmented-group {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--c-c8ded7);
    border-radius: 6px;
    overflow: hidden;
    background: var(--c-ffffff);
    flex: 0 0 auto;
    height: 36px;
    box-sizing: border-box;
  }

  .priority-segment-btn {
    border: none;
    border-right: 1px solid var(--c-c8ded7);
    background: #faf8f5;
    color: var(--text-muted, var(--c-5f7a70));
    font-family: var(--font-family-header, Georgia, serif);
    font-size: 0.85rem;
    font-weight: 700;
    width: 28px;
    height: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color var(--duration-standard) var(--ease-standard), color var(--duration-standard) var(--ease-standard);
    border-radius: 0;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .priority-segment-btn:first-child {
    border-top-left-radius: 5px;
    border-bottom-left-radius: 5px;
  }

  .priority-segment-btn:last-child {
    border-right: none;
    border-top-right-radius: 5px;
    border-bottom-right-radius: 5px;
  }

  .priority-segment-btn:hover:not(.active) {
    background-color: var(--c-rgba-45-106-90-0p08);
    color: var(--c-1c2826);
  }

  .priority-segment-btn:focus-visible {
    outline: 2px solid var(--binder-teal, var(--c-2d6a5a));
    outline-offset: -2px;
    z-index: var(--z-1);
  }

  .priority-segment-btn.active.a {
    background-color: var(--priority-a) !important;
    color: var(--c-ffffff) !important;
    box-shadow: inset 0 1px 2px var(--c-rgba-0-0-0-0p25);
  }

  .priority-segment-btn.active.b {
    background-color: var(--priority-b) !important;
    color: var(--c-ffffff) !important;
    box-shadow: inset 0 1px 2px var(--c-rgba-0-0-0-0p25);
  }

  .priority-segment-btn.active.c {
    background-color: var(--priority-c) !important;
    color: var(--c-ffffff) !important;
    box-shadow: inset 0 1px 2px var(--c-rgba-0-0-0-0p25);
  }

  .task-input-field {
    flex: 1 1 0;
    min-width: 0;
    height: 36px;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid var(--c-c8ded7);
    background-color: var(--c-ffffff) !important;
    color: var(--c-1c2826);
    margin-bottom: 0;
    font-size: 0.85rem;
    box-sizing: border-box;
  }

  :root {
    --vh: 1vh;
    --vw: 1vw;
  }

  /* Whole-UI zoom: slider in global header; --ui-zoom set on .binder-container */
  .binder-container {
    --ui-zoom: 1;
    --vh: calc(1vh / var(--ui-zoom));
    --vw: calc(1vw / var(--ui-zoom));
    zoom: var(--ui-zoom);
  }

  .ui-zoom {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--binder-teal);
  }

  .ui-zoom-glyph {
    font-family: var(--font-family-header);
    line-height: 1;
    user-select: none;
    background: transparent;
    border: none;
    color: inherit;
    padding: 2px 4px;
    border-radius: 4px;
    cursor: pointer;
  }

  .ui-zoom-glyph:hover:not(:disabled) {
    background: var(--c-rgba-45-106-90-0p12);
  }

  .ui-zoom-glyph:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .ui-zoom input[type="range"] {
    width: 88px;
    min-width: 40px;
    margin: 0;
    accent-color: var(--binder-teal);
    cursor: pointer;
  }

  .tasks-header-actions,
  .appointments-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Universal Input Fallbacks */
  input[type="text"],
  input[type="search"],
  select,
  textarea {
    background-color: var(--c-ffffff) !important;
    color: var(--c-1c2826) !important;
    border: 1px solid var(--c-c8ded7) !important;
  }

  /* Task Table Styling */
  figure.table-container {
    margin: 0;
    padding: 0;
  }

  figure.table-container.daily-tasks-table-container,
  .daily-tasks-table-container {
    max-height: calc((100 * var(--vh)) - 240px);
    min-height: 310px;
    overflow-y: auto !important;
    overflow-x: auto !important;
    border: 1px solid var(--border-line);
    border-radius: 2px;
  }

  .daily-tasks-table {
    table-layout: fixed;
    margin-bottom: 0;
  }

  .daily-tasks-table thead th {
    position: sticky;
    top: 0;
    z-index: var(--z-5);
    box-shadow: 0 1px 0 var(--border-line);
  }

  table.task-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 0;
    background-color: var(--c-ffffff);
    color: var(--c-1c2826);
  }

  table.task-table tr,
  table.task-table tbody tr {
    background-color: var(--c-ffffff) !important;
    color: var(--c-1c2826) !important;
  }

  table.task-table tr:nth-child(even) {
    background-color: var(--c-f7faf9) !important;
  }

  table.task-table th {
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #3b5249 !important;
    border-bottom: 2px solid var(--c-c8ded7) !important;
    padding: 6px 8px;
    background: var(--c-eef6f3) !important;
  }

  table.task-table td {
    padding: 8px;
    border-bottom: 1px solid #e2eee9 !important;
    font-size: 0.9rem;
    color: var(--c-1c2826) !important;
    background-color: transparent !important;
  }

  .priority-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 0.75rem;
    color: var(--c-ffffff) !important;
  }
  .priority-badge.A { background-color: var(--priority-a) !important; }
  .priority-badge.B { background-color: var(--priority-b) !important; }
  .priority-badge.C { background-color: var(--priority-c) !important; }

  .status-btn {
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 1px solid var(--c-c8ded7);
    background: var(--c-fcfbfa);
    color: var(--c-1c2826);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .th-sortable {
    cursor: ns-resize;
    user-select: none;
  }

  .th-sortable:hover {
    color: var(--binder-teal, var(--c-2d6a5a)) !important;
  }

  .sort-arrow {
    display: inline-block;
    margin-left: 3px;
    font-size: 0.65rem;
    opacity: 0.75;
  }

  .sort-arrow.sort-arrow-hidden {
    visibility: hidden;
  }

  .star-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    background-color: transparent;
    border: none;
    padding: 0;
    margin: 0 4px 0 0;
    margin-bottom: 0;
    box-shadow: none;
    border-radius: 0;
    width: auto;
    min-width: 0;
    height: auto;
    min-height: 0;
    cursor: pointer;
    font-size: 1.15rem;
    line-height: 1;
    color: var(--c-8c9b95);
    vertical-align: middle;
    transform: translateY(-1px);
    transition: color var(--duration-standard) var(--ease-standard), transform var(--duration-fast) var(--ease-standard);
    user-select: none;
    -webkit-user-select: none;
  }

  .star-toggle:hover,
  .star-toggle:active {
    background: transparent;
    background-color: transparent;
    border: none;
    box-shadow: none;
    color: var(--tab-gold);
    transform: translateY(-1px) scale(1.15);
  }

  .star-toggle:focus-visible {
    background: transparent;
    background-color: transparent;
    border: none;
    box-shadow: none;
    outline: 2px dotted var(--binder-teal, var(--c-2d6a5a)) !important;
    outline-offset: 1px;
    border-radius: 2px;
  }

  .star-toggle.is-starred {
    color: var(--tab-gold);
  }

  .star-toggle.is-starred:hover {
    color: var(--c-b8860b);
  }

  .notes-indicator-wrap {
    position: relative;
    display: inline-flex;
    vertical-align: middle;
    margin-left: 4px;
  }

  .notes-indicator {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--c-8c9b95);
  }

  .notes-indicator:hover {
    color: var(--binder-teal, var(--c-2d6a5a));
  }

  .notes-indicator-wrap {
    position: relative;
    display: inline-flex;
    vertical-align: middle;
    margin-left: 4px;
  }

  .notes-indicator-wrap:has(.notes-popover:not([style*="display: none"])),
  .notes-indicator-wrap:focus-within,
  .notes-indicator-wrap:hover {
    z-index: var(--z-500);
  }

  tr:has(.notes-indicator-wrap:hover),
  tr:has(.notes-indicator-wrap:focus-within),
  tr:has(.notes-popover:not([style*="display: none"])) {
    position: relative;
    z-index: var(--z-200);
  }

  .notes-popover {
    position: absolute;
    top: 100%;
    left: 0;
    z-index: var(--z-500);
    background: var(--c-ffffff);
    color: var(--c-1c2826);
    border: 1px solid var(--c-c8ded7);
    border-radius: 6px;
    /* 22px top padding keeps the first line clear of the hand-cursor glyph, which hangs
       down-right of the icon hotspot into the popover (and closes the hover gap). */
    padding: 22px 14px 10px;
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p2);
    min-width: 180px;
    max-width: min(280px, (80 * var(--vw)));
    max-height: min(240px, (40 * var(--vh)));
    overflow-y: auto;
    font-size: 0.8rem;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .notes-popover.dropup {
    top: auto;
    padding-top: 10px;
    bottom: calc(100% + 4px);
    box-shadow: 0 -8px 24px var(--c-rgba-0-0-0-0p2);
  }

  .notes-popover.dropdown-down {
    top: 100%;
    bottom: auto;
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p2);
  }

  /* Default CSS upward alignment for the last 3 rows in task tables when at least 4 rows exist */
  tbody tr:nth-child(n+4):nth-last-child(-n+3) .notes-popover:not(.dropdown-down) {
    top: auto;
    bottom: calc(100% + 4px);
    box-shadow: 0 -8px 24px var(--c-rgba-0-0-0-0p2);
  }

  .status-menu-wrap {
    position: relative;
    display: inline-flex;
  }

  .status-menu-wrap:has(.status-menu:not([style*="display: none"])),
  .status-menu-wrap:focus-within,
  .status-menu-wrap:hover {
    z-index: var(--z-500);
  }

  tr:has(.status-menu-wrap:hover),
  tr:has(.status-menu-wrap:focus-within),
  tr:has(.status-menu:not([style*="display: none"])) {
    position: relative;
    z-index: var(--z-200);
  }

  .status-menu {
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--c-ffffff);
    border: 1px solid var(--c-c8ded7);
    border-radius: 6px;
    padding: 4px;
    padding-top: 8px;
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p2);
    z-index: var(--z-500);
    min-width: 160px;
    max-height: min(320px, (80 * var(--vh)));
    overflow-y: auto;
    color: var(--c-1c2826);
  }

  .status-menu.dropup {
    top: auto;
    bottom: calc(100% + 2px);
    box-shadow: 0 -8px 24px var(--c-rgba-0-0-0-0p2);
  }

  .status-menu.dropdown-down {
    top: calc(100% + 2px);
    bottom: auto;
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p2);
  }

  /* Default CSS upward alignment for the last 3 rows in task tables when at least 4 rows exist */
  tbody tr:nth-child(n+4):nth-last-child(-n+3) .status-menu:not(.dropdown-down) {
    top: auto;
    bottom: calc(100% + 2px);
    box-shadow: 0 -8px 24px var(--c-rgba-0-0-0-0p2);
  }

  .status-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--c-1c2826);
    font-size: 0.8rem;
    padding: 6px 8px;
    cursor: pointer;
    text-align: left;
    transition: background var(--duration-standard) var(--ease-standard);
  }

  .status-menu-item:hover {
    background: var(--binder-teal, var(--c-2d6a5a)) !important;
    color: var(--c-ffffff);
  }

  .status-menu-item.is-active {
    background: var(--c-eef6f3);
  }

  .status-menu-item-glyph {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 3px;
    background: var(--c-fcfbfa);
    color: var(--c-1c2826);
    border: 1px solid var(--c-c8ded7);
    font-weight: bold;
    font-size: 0.8rem;
    padding: 0 2px;
    white-space: nowrap;
  }

  .status-menu-separator {
    height: 1px;
    background: #e2ede8;
    margin: 4px 0;
  }

  .status-menu-item-delete {
    color: var(--c-c93b2b);
  }

  .status-menu-item-delete:hover {
    background: #fdf2f2 !important;
    color: var(--c-b91c1c);
  }

  .status-menu-item-glyph-delete {
    color: var(--c-c93b2b);
    border-color: var(--c-f8b4b4);
    background: #fff5f5;
  }

  /* "Forward to date…" in the daily status menu: the date field and its confirm button. */
  .status-menu-group {
    display: contents;
  }

  .forward-pick {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px 6px 36px;
  }

  .forward-pick-btn {
    height: 26px;
    padding: 0 10px;
    border: none;
    border-radius: 4px;
    background: var(--binder-teal, var(--c-2d6a5a));
    color: var(--c-ffffff);
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
  }

  .forward-pick-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* Muted date on the right of a forward preset, e.g. "Mon, Oct 19". */
  .status-menu-item-hint {
    margin-left: auto;
    padding-left: 12px;
    color: var(--c-5f6b68);
    font-size: 0.74rem;
  }

  /* Asked before forwarding a task that is already forwarded. */
  .forward-confirm {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    max-width: 230px;
    padding: 2px 8px 6px 36px;
    color: var(--c-1c2826);
    font-size: 0.76rem;
  }

  /* "Delegate…" in the daily status menu: optional owner, then a check-back day. */
  .delegate-pick {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    max-width: 260px;
    padding: 2px 8px 8px 36px;
  }

  input.delegate-owner-input {
    flex: 0 0 auto;
    box-sizing: border-box;
    width: 100%;
    height: 26px;
    padding: 2px 6px;
    font-family: inherit;
    font-size: 0.76rem;
    background-color: var(--bg-card, var(--c-ffffff));
    color: var(--text-primary);
    border: 1px solid var(--border-line);
    border-radius: 2px;
  }

  input.delegate-owner-input:focus-visible {
    outline: none;
  }

  input.delegate-owner-input:focus {
    border-color: var(--binder-teal);
    box-shadow: 0 0 0 1px var(--binder-teal);
  }

  [data-theme="dark"] input.delegate-owner-input {
    background-color: var(--c-11241c) !important;
    color: var(--c-e2f2ec) !important;
  }

  .delegate-pick-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .delegate-pick-label,
  .delegate-pick-note {
    color: var(--c-5f6b68);
    font-size: 0.74rem;
  }

  .forward-pick-btn.is-secondary {
    background: transparent;
    color: var(--binder-teal, var(--c-2d6a5a));
    border: 1px solid var(--binder-teal, var(--c-2d6a5a));
  }

  .task-toast-btn {
    margin-left: 8px;
    color: var(--c-ffffff);
    text-decoration: underline;
  }

  .status-menu-item-delete:hover .status-menu-item-glyph-delete {
    background: var(--c-fee2e2);
    border-color: var(--c-b91c1c);
    color: var(--c-b91c1c);
  }

  .task-done {
    text-decoration: line-through;
    opacity: 0.75;
  }

  .task-canceled {
    opacity: 0.75;
    text-decoration: line-through;
  }

  /* Schedule Grid */
  section.schedule-list {
    display: flex;
    flex-direction: column;
    max-height: calc((100 * var(--vh)) - 240px);
    min-height: 280px;
    overflow-y: auto;
    border: 1px solid var(--border-line);
    border-radius: var(--border-radius);
    margin-bottom: 0;
  }

  .schedule-row {
    display: flex;
    border-bottom: 1px solid var(--c-eef5f2);
    min-height: 36px;
    align-items: stretch;
    flex: 0 0 auto;
  }

  .schedule-row.half-hour {
    background-color: #fafdfc;
  }

  time.schedule-time {
    width: 85px;
    min-width: 85px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    padding: 6px 10px;
    border-right: 1px solid var(--border-line);
    background: var(--c-f4f9f7);
    display: flex;
    align-items: center;
    align-self: stretch;
    box-sizing: border-box;
    flex-shrink: 0;
  }

  /* Current and next half-hour slot: the tab underline turned 90 degrees, drawn inside the cell so nothing shifts. */
  .schedule-row.slot-now time.schedule-time {
    box-shadow: inset 3px 0 0 var(--tab-gold);
    font-weight: 700;
  }

  .schedule-row.slot-next time.schedule-time {
    box-shadow: inset 3px 0 0 color-mix(in srgb, var(--tab-gold) 40%, transparent);
  }

  .schedule-content {
    flex: 1;
    min-width: 0;
    padding: 4px 8px;
    display: flex;
    flex-direction: row;
    gap: 6px;
    align-items: stretch;
  }

  button.event-pill, div.event-pill {
    flex: 1 1 0;
    min-width: 0;
    background: var(--binder-teal-light);
    border: none;
    border-left: 3px solid var(--binder-teal);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--binder-teal);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    box-sizing: border-box;
    text-align: left;
    overflow: hidden;
  }

  button.event-pill:hover {
    background: var(--binder-teal);
    color: var(--c-ffffff);
  }

  /* Tasks & Appointments Line Auto-Fit (1-3 lines) */
  .task-title-cell {
    line-height: 1.4;
    word-break: break-word;
    white-space: normal;
    overflow: visible;
  }

  /* Inline Task Description Editing */
  .task-title-text {
    cursor: text;
    border-radius: 2px;
    padding: 1px 3px;
    margin: -1px -3px;
    transition: background-color var(--duration-fast) var(--ease-standard);
  }

  .task-title-text:hover {
    background-color: var(--binder-teal-light);
  }

  .task-title-inline-input {
    display: inline-block;
    width: calc(100% - 32px);
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;
    color: inherit;
    padding: 1px 3px;
    margin: -1px -3px;
    border: none;
    border-bottom: 1px solid var(--binder-teal, var(--c-2d6a5a));
    border-radius: 0;
    background: transparent !important;
    box-shadow: none;
    text-decoration: none;
    vertical-align: middle;
  }

  .task-title-inline-input:focus-visible {
    outline: none !important;
  }

  .event-pill-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
  }

  /* An appointment and its note icon share the slot width the pill used to take alone. */
  .event-pill-row {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
  }

  /* Hover note for an appointment: the same details as its popup, in the Tasks note style. */
  .event-notes-popover {
    white-space: normal;
    min-width: 220px;
  }

  .event-note-title {
    margin: 0 0 6px;
    font-weight: 700;
  }

  .event-note-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 4px;
  }

  .event-note-description {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid #e3ece8;
  }

  /* Notes Column Panel */
  article.notes-column-panel {
    background-color: var(--bg-card, var(--c-ffffff));
    position: relative;
    padding: 20px;
  }

  .notes-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-icon-subtle {
    background: transparent;
    border: 1px solid var(--border-line);
    color: var(--binder-teal) !important;
    border-radius: 4px;
    padding: 4px 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-icon-subtle:hover {
    background: var(--binder-teal-light);
  }

  /* Notes panel Open Notes in Docs anchor: dimmed, not hidden, while the day has no Doc link. */
  a.btn-icon-subtle {
    text-decoration: none;
  }
  .btn-icon-subtle.btn-gdoc-link.is-disabled {
    opacity: 0.4;
    cursor: default;
  }

  .dropdown-container {
    position: relative;
  }

  .notes-filter-menu {
    position: absolute;
    top: 36px;
    right: 0;
    width: 260px;
    background: var(--c-ffffff);
    border: 1px solid var(--border-line);
    border-radius: 6px;
    box-shadow: 0 8px 24px var(--c-rgba-0-0-0-0p15);
    padding: 12px;
    z-index: var(--z-100);
  }

  .dropdown-header {
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--binder-teal);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .dropdown-item-group {
    margin-bottom: 8px;
  }

  .dropdown-search-input {
    width: 100%;
    font-size: 0.85rem;
    padding: 4px 8px;
    margin-bottom: 0;
  }

  .dropdown-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .dropdown-select {
    width: 100%;
    font-size: 0.8rem;
    padding: 4px 6px;
    margin-bottom: 0;
  }

  .dropdown-divider {
    height: 1px;
    background: var(--border-line);
    margin: 8px 0;
  }

  .btn-toggle-mode {
    width: 100%;
    font-size: 0.75rem;
    padding: 6px 8px;
    background: var(--binder-teal-light);
    border: 1px solid var(--binder-teal);
    color: var(--binder-teal);
    border-radius: 4px;
    cursor: pointer;
  }

  .filter-indicator-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    background: var(--binder-teal-light);
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 10px;
    border-left: 3px solid var(--binder-teal);
  }

  .btn-link-sm {
    background: transparent;
    border: none;
    color: var(--note-color-red);
    cursor: pointer;
    font-weight: 600;
    font-size: 0.75rem;
  }

  /* Note Cards List */
  .note-cards-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: calc((100 * var(--vh)) - 240px);
    overflow-y: auto;
    padding-right: 4px;
  }

  .note-card-item {
    background: var(--c-ffffff);
    border: 1px solid var(--border-line);
    border-radius: 6px;
    box-shadow: 0 2px 8px var(--c-rgba-0-0-0-0p04);
    transition: all var(--duration-slow) var(--ease-standard);
  }

  .note-card-item.collapsed {
    background: var(--c-f7faf9);
  }

  .quote-card {
    background: var(--c-ffffff);
    border: 1px solid var(--border-line);
    border-radius: 6px;
    box-shadow: 0 2px 8px var(--c-rgba-0-0-0-0p04);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .quote-card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--binder-teal-light);
    border-bottom: 1px solid var(--border-line);
    cursor: pointer;
  }

  .quote-card.collapsed .quote-card-header {
    border-bottom: none;
  }

  .quote-card-title {
    font-family: var(--font-family-header);
    font-weight: 600;
    color: var(--heading-color);
    font-size: 0.9rem;
  }

  .quote-card-body {
    padding: 12px 14px 14px;
    transition: opacity var(--duration-slow) var(--ease-standard);
  }

  .quote-card-text {
    font-family: var(--font-family-header);
    font-style: italic;
    color: var(--text-primary);
    line-height: 1.5;
    margin: 0 0 6px;
  }

  .quote-card-author {
    color: var(--text-muted);
    font-size: 0.85rem;
    text-align: right;
    margin: 0;

  .card-topic-input:focus-visible {

  .topic-dropdown-header {

  .topic-dropdown-hint {

  .topic-item-main {

  .topic-item-name {

    flex-shrink: 0;

  }

  .topic-lru-item:hover .topic-item-remove-btn,

  }

  .topic-item-remove-btn:hover {
    opacity: 1 !important;
    color: #b33939;
    background: rgba(179, 57, 57, 0.1);
  }

  .card-heading-input {
    flex: 1;
    min-width: 80px;
    font-family: var(--font-family-base);
    font-weight: 400;
    font-size: 0.9rem;
    border: none !important;
    border-bottom: 1px dashed transparent !important;
    background: transparent !important;
    color: var(--text-primary) !important;
    padding: 2px 4px;
    box-shadow: none;
    border-radius: 3px;
    cursor: text;
    resize: none;
    overflow: hidden;
    line-height: 1.35;
    margin-bottom: 0;
  }

  .card-heading-input:focus-visible {
    outline: none;
  }
  .card-heading-input:disabled {
    color: var(--text-muted) !important;
    cursor: not-allowed;
  }
  .card-heading-input:hover:not(:disabled) {
    border-bottom-color: var(--border-line) !important;
  }
  .card-heading-input:focus-visible {
    outline: none;
    border-bottom: 1px solid var(--binder-teal) !important;
    box-shadow: none !important;
    background: transparent !important;
  }

  .card-heading-help {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    color: var(--text-muted);

  }

  .card-heading-help-tip {

    background: var(--c-ffffff);

    color: var(--text-primary);

  .card-heading-help:hover .card-heading-help-tip,
  .card-heading-help:focus .card-heading-help-tip {
    display: block;
  }

  .task-link-tag {
    font-size: 0.72rem;
    font-family: var(--font-family-header);
    font-weight: 700;
    color: var(--binder-teal);
    background: var(--binder-teal-light);
    border: 1px solid var(--border-line);
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
  }

  .card-summary-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .card-summary-main-row {
    display: flex;
    align-items: center;
    gap: 4px;
    width: 100%;
    min-width: 0;
  }

  .card-category-segmented-wrap {
    display: flex;
    align-items: center;
    margin-top: 1px;
    margin-bottom: 1px;
    overflow-x: auto;
    max-width: 100%;
  }

  .category-segmented-control {
    display: inline-flex;
    border: 1px solid var(--border-line, var(--c-c8ded7));
    border-radius: 2px;
    overflow: hidden;
    background: var(--c-ffffff);
    box-sizing: border-box;
    flex-wrap: nowrap;
    height: 20px;
  }

  .category-segment-btn {
    border: none;
    border-right: 1px solid var(--border-line, var(--c-c8ded7));
    background: var(--c-ffffff);
    color: var(--text-muted, var(--c-5f7a70));
    font-family: var(--font-family-header, Georgia, serif);
    font-size: 0.68rem;
    font-weight: 600;
    padding: 0 6px 2px 6px;
    height: 20px;
    line-height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: background-color var(--duration-standard) var(--ease-standard), color var(--duration-standard) var(--ease-standard);
    border-radius: 0;
    margin: 0;
    box-sizing: border-box;
    white-space: nowrap;
  }

  .category-segment-btn:last-child {

  }

  .category-segment-btn:hover:not(.is-active) {

  }

  .category-segment-btn:focus-visible {

  .category-segment-btn.is-active {
    background-color: var(--binder-teal, var(--c-2d6a5a));

  .category-check-icon {

    width: 11px;
    height: 11px;
    line-height: 11px !important;
  }

  .index-topic-cell {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .index-category-stamp {
    display: inline-block;
    font-size: 0.7rem;
    padding: 1px 5px;
    border: 1px solid var(--border-line, var(--c-c8ded7));
    border-radius: 2px;
    background: var(--c-eef5f2);
    color: var(--binder-teal, var(--c-2d6a5a));
    font-weight: 600;
    align-self: flex-start;
  }

  .card-delete-btn {
    background: transparent;
    border: none;
    color: #a0a0a0;
    cursor: pointer;
    padding: 2px;
    display: flex;
    align-items: center;
  }
  .card-delete-btn:hover {
    color: var(--note-color-red);
  }

  /* Google Chat Style Formatting Toolbar */
  .gchat-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    background: var(--c-f7faf9);
    border-bottom: 1px solid #e1ede8;
    overflow-x: auto;
    flex-wrap: wrap;
  }

  .format-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--c-4a5d56);
    border-radius: 3px;
    padding: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .format-btn:hover:not(.color-swatch-btn) {
    background: var(--binder-teal-light);
    color: var(--binder-teal);
    border-color: var(--border-line);
  }
  .format-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .format-btn:disabled:hover {
    background: transparent;
    color: var(--c-4a5d56);
    border-color: transparent;
  }

  .toolbar-divider {
    width: 1px;
    height: 16px;
    background: var(--border-line);
    margin: 0 4px;
    flex-shrink: 0;
  }

  .stt-mic-btn.stt-listening {
    background: var(--binder-teal);
    color: var(--c-ffffff);
    border-color: var(--binder-teal);
  }

  .stt-mic-btn.stt-blocked {
    color: var(--c-8a3b2f);
  }

  .stt-mic-btn-inline {
    display: inline-flex;
    vertical-align: middle;
    margin-left: 6px;
  }

  .stt-error-hint {
    margin-top: 4px;
    padding: 4px 8px;
    font-size: 0.78rem;
    color: var(--c-8a3b2f);
    background: #fbecea;
    border: 1px solid #e6b8ae;
    border-radius: 4px;
  }

  .stt-error-text {
    cursor: pointer;
  }

  .stt-fallback-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }

  .stt-fallback-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    font-size: 0.76rem;
    font-family: var(--font-family-base);
    color: var(--binder-teal);
    background: var(--c-ffffff);
    border: 1px solid var(--binder-teal);
    border-radius: 4px;
    cursor: pointer;
  }

  .stt-fallback-btn:hover:not(:disabled) {
    background: var(--binder-teal-light);
  }

  .stt-fallback-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .color-swatch-btn {
    width: var(--target-min);
    height: var(--target-min);
    padding: 0;
    border-radius: 3px;
    cursor: pointer;
  }
  .color-swatch-teal { background: var(--note-color-teal); border: 1px solid var(--c-rgba-0-0-0-0p2); }
  .color-swatch-red { background: var(--note-color-red); border: 1px solid var(--c-rgba-0-0-0-0p2); }
  .color-swatch-green { background: var(--note-color-green); border: 1px solid var(--c-rgba-0-0-0-0p2); }
  .color-swatch-blue { background: var(--note-color-blue); border: 1px solid var(--c-rgba-0-0-0-0p2); }
  .color-swatch-btn:hover { filter: brightness(1.1); }
  .color-swatch-btn.active {
    box-shadow: 0 0 0 2px var(--c-ffffff), 0 0 0 3px var(--binder-teal);
  }

  .note-card-item.note-color-teal { border-left: 3px solid var(--note-color-teal); }
  .note-card-item.note-color-red { border-left: 3px solid var(--note-color-red); }
  .note-card-item.note-color-green { border-left: 3px solid var(--note-color-green); }
  .note-card-item.note-color-blue { border-left: 3px solid var(--note-color-blue); }

  .note-card-lines {
    width: 100%;
    min-height: 90px;
    max-height: 280px;
    font-family: var(--font-family-base);
    font-size: 0.88rem;
    line-height: 1.5;
    padding: 8px 12px;
    overflow-y: auto;
  }
  .note-render-line-item {
    cursor: text;
    min-height: 1.4em;
    word-break: break-word;
    display: flex;
    align-items: flex-start;
    gap: 4px;
  }
  .note-render-line-item .note-render-list {
    margin: 0;
  }
  .note-card-line-row {
    padding: 1px 4px;
    border-radius: 3px;
  }
  .note-card-line-row.note-line-selected {
    background: var(--binder-teal-light);
  }
  .note-card-line-input {
    display: block;
    width: 100%;
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    padding: 0;
    margin: 0;
    border: none;
    background: transparent;
    color: inherit;
    box-shadow: none;
  }

  .note-card-line-input:focus-visible {
    outline: none;
  }
  .note-card-line-edit {
    display: flex;
    align-items: baseline;
    gap: 0.4em;
  }
  .note-card-line-prefix {
    flex: none;
    user-select: none;
    color: inherit;
  }
  .note-card-line-rich {
    flex: 1 1 auto;
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    min-height: 1.4em;
  }
  .note-card-line-rich:empty::before {
    content: attr(data-placeholder);
    opacity: 0.55;
    font-style: italic;
    pointer-events: none;
  }
  .note-card-line-rich b { font-weight: 700; }
  .note-card-line-rich i { font-style: italic; }
  .note-card-line-rich u { text-decoration: underline; }
  .note-card-line-rich s { text-decoration: line-through; }
  .note-card-line-rich a[data-href] {
    text-decoration: underline;
    color: var(--binder-teal);
    cursor: text;
  }
  .note-card-line-rich [data-color="teal"] { color: var(--note-color-teal); }
  .note-card-line-rich [data-color="red"] { color: var(--note-color-red); }
  .note-card-line-rich [data-color="green"] { color: var(--note-color-green); }
  .note-card-line-rich [data-color="blue"] { color: var(--note-color-blue); }
  .note-card-empty-placeholder {
    opacity: 0.55;
    font-style: italic;
  }
  .note-render-line:empty::after {
    content: '\00a0';
  }
  .note-render-list {
    margin: 0;
    padding-left: 1.25em;
  }
  .note-render-bold { font-weight: 700; }
  .note-render-italic { font-style: italic; }
  .note-render-underline { text-decoration: underline; }
  .note-render-strike { text-decoration: line-through; }
  .note-render-link {
    text-decoration: underline;
    color: var(--binder-teal);
  }
  .note-render-color-teal { color: var(--note-color-teal); }
  .note-render-color-red { color: var(--note-color-red); }
  .note-render-color-green { color: var(--note-color-green); }
  .note-render-color-blue { color: var(--note-color-blue); }

  /* Note Cards Checklist Styling (☐ / ☒) */
  .note-checkbox-btn {
    background: transparent;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1.4;
    height: 1.4em;
    flex-shrink: 0;
    color: var(--binder-teal, var(--c-2d6a5a));
    font-size: 1.15rem;
    font-family: inherit;
    user-select: none;

  .note-checkbox-btn:hover {

  [data-theme="dark"] .note-checkbox-btn {

    text-decoration-color: var(--c-79d6bd);

  .doc-preview-heading {
    font-family: var(--font-family-header);
    color: var(--binder-teal);
    font-size: 1.1rem;
    margin: 16px 0 8px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .doc-preview-topic-badge {
    font-size: 0.75rem;
    font-family: var(--font-family-base);
    font-weight: 600;
    color: var(--binder-teal);
    background: var(--binder-teal-light);
    border: 1px solid var(--border-line);
    padding: 2px 6px;
    border-radius: 3px;

  .decision-badge {
