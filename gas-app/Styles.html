<style>

  @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0');

  :root {

    --bg-binder: #1b4332;
    --text-primary: #1c2826;
    --text-muted: #5c6b66;
    --binder-teal: #2d6a5a;
    --binder-teal-light: #e9f5f2;
    --border-line: #c8ded7;

    --priority-b: #f0ad4e;
    --priority-c: #337ab7;

    margin: 0;
    padding: 0;

  body {
    font-family: 'Inter', sans-serif;
    background-color: #12241d;
    color: var(--text-primary);
    min-height: 100vh;
    padding: 16px;

  .material-symbols-outlined {

    font-style: normal;
    font-size: 20px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-smoothing: antialiased;
    vertical-align: middle;

  .binder-container {

    justify-content: space-between;
    align-items: center;

  .brand-title {

    font-size: 1.4rem;
    font-weight: 700;

    align-items: center;

  .brand-title span.badge {

    font-size: 0.7rem;

    padding: 3px 8px;

  .search-trigger-btn {

    border: 1px solid #ffffff44;

    align-items: center;

  }

  .kbd-shortcut {
    background: #ffffff33;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.75rem;
  }

  /* Top View Tabs */
  .view-tabs-bar {
    background: #e1efe9;
    padding: 8px 16px 0 16px;
    display: flex;
    gap: 6px;
    border-bottom: 2px solid var(--border-line);
    overflow-x: auto;
  }

  .tab-btn {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 10px 18px;
    border: 1px solid var(--border-line);
    border-bottom: none;
    background: #d4e7df;
    color: var(--text-muted);
    border-top-left-radius: 6px;
    border-top-right-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab-btn:hover {
    background: var(--binder-teal-light);
    color: var(--binder-teal);
  }

  .tab-btn.active {
    background: var(--bg-parchment);
    color: var(--binder-teal);
    border-top: 3px solid var(--binder-teal);
    font-weight: 700;
  }

  /* Date Header Bar */
  .date-bar {
    padding: 12px 24px;
    background: var(--bg-parchment);
    border-bottom: 1px solid var(--border-line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .date-display {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--binder-teal);
  }

  .nav-btn-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .nav-btn {

    border: 1px solid var(--border-line);
    color: var(--binder-teal);
    padding: 6px 12px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .nav-btn:hover {
    background: var(--binder-teal);
    color: #ffffff;
  }

  .binder-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .two-page-spread {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
    gap: 16px;
    padding: 20px;
    background: var(--bg-parchment);

  .page-panel {
    background: #ffffff;
    border: 1px solid var(--border-line);
    border-radius: 8px;
    padding: 20px;
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    gap: 16px;

    border-bottom: 2px solid var(--binder-teal);

    display: flex;
    justify-content: space-between;
    align-items: center;

  .task-table {
    width: 100%;

  .task-table th {
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;

    align-items: center;

    display: inline-flex;
    align-items: center;

    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    padding: 20px;

    border-radius: 6px;

    align-items: center;

  .future-month-card {
