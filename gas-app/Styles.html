<style>
  @import url('https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css');
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0');

  :root,
  :root[data-theme="light"],
  :root[data-theme="dark"],
  [data-theme="light"],
  [data-theme="dark"] {
    /* Pico CSS v2 Design System Overrides */
    --pico-font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --pico-font-size: 100%;
    --pico-line-height: 1.5;
    --pico-header-font-family: 'Playfair Display', Georgia, serif;
    --pico-primary: #2d6a5a !important;
    --pico-primary-background: #2d6a5a !important;
    --pico-primary-hover: #1b4332 !important;
    --pico-primary-hover-background: #1b4332 !important;
    --pico-primary-focus: rgba(45, 106, 90, 0.25) !important;
    --pico-primary-inverse: #ffffff !important;
    --pico-primary-border: #2d6a5a !important;
    --pico-form-element-active-border-color: #2d6a5a !important;
    --pico-form-element-focus-color: rgba(45, 106, 90, 0.25) !important;
    --pico-url-color: #2d6a5a !important;
    --pico-url-hover-color: #1b4332 !important;
    --pico-background-color: #12241d !important;
    --pico-card-background-color: #ffffff !important;
    --pico-border-color: #c8ded7 !important;
    --pico-color: #1c2826 !important;
    --pico-h1-color: #142e23 !important;
    --pico-h2-color: #142e23 !important;
    --pico-h3-color: #142e23 !important;
    --pico-h4-color: #142e23 !important;
    --pico-h5-color: #142e23 !important;
    --pico-h6-color: #142e23 !important;
    --pico-spacing: 0.75rem;
    --pico-border-radius: 6px;

    /* Franklin Covey Aesthetic Tokens */
    --bg-parchment: #fcfbfa;
    --bg-binder: #142e23;
    --text-primary: #1c2826;
    --text-muted: #5c6b66;
    --binder-teal: #2d6a5a;
    --binder-teal-light: #e9f5f2;
    --border-line: #c8ded7;
    --priority-a: #d9534f;
    --priority-b: #f0ad4e;
    --priority-c: #3d7a68;
    --status-complete: #2b8a3e;
    --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  /* Force Headings to Dark Forest Green */
  h1, h2, h3, h4, h5, h6,
  .date-display,
  .panel-header-title,
  .view-title,
  .modal-title,
  .modal-title-with-icon {
    color: #142e23 !important;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: var(--pico-font-family);
    background-color: var(--pico-background-color);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 16px;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Material Symbols Font Integration */
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-size: 20px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-smoothing: antialiased;
    vertical-align: middle;
  }

  /* Shared Interactive Element Resets (D.R.Y. Button Rule) */
  .search-trigger-btn,
  .tab-btn,
  .nav-btn,
  .status-btn,
  .event-pill,
  .btn-primary,
  .btn-secondary,
  .btn-success,
  .error-close-btn {
    margin-bottom: 0;
    font-family: inherit;
  }

  /* Binder Outer Frame */
  .binder-container {
    width: 100%;
    max-width: 1380px;
    background: var(--bg-parchment);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    border: 12px solid var(--bg-binder);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 92vh;
    margin: 0;
    padding: 0;
  }

  /* Header & Navigation Bar */
  header.binder-header {
    background: #142e23 !important;
    color: #ffffff !important;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #0b1c15;
    margin-bottom: 0;
  }

  .brand-title {
    font-family: var(--pico-header-font-family);
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    color: #ffffff !important;
  }

  .brand-title span.badge {
    font-family: var(--pico-font-family);
    font-size: 0.7rem;
    background: rgba(255, 255, 255, 0.2);
    padding: 3px 8px;
    border-radius: 12px;
    text-transform: uppercase;
    color: #ffffff !important;
  }

  .search-trigger-btn {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.27);
    color: #ffffff !important;
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s ease;
    width: auto;
  }

  .search-trigger-btn:hover {
    background: rgba(255, 255, 255, 0.21);
    color: #ffffff !important;
  }

  kbd.kbd-shortcut {
    background: rgba(255, 255, 255, 0.2);
    color: #ffffff !important;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.75rem;
    border: none;
    font-family: inherit;
  }

  /* Top View Tabs Bar */
  nav.view-tabs-bar {
    background: #dcece6 !important;
    padding: 8px 16px 0 16px;
    display: flex;
    gap: 6px;
    border-bottom: 2px solid #c8ded7 !important;
    overflow-x: auto;
    margin-bottom: 0;
  }

  .tab-btn {
    font-family: var(--pico-header-font-family);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 10px 18px;
    border: 1px solid #c8ded7 !important;
    border-bottom: none !important;
    background: #cbe0d7 !important;
    color: #3b5249 !important;
    border-top-left-radius: 6px;
    border-top-right-radius: 6px;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    width: auto;
  }

  .tab-btn:hover {
    background: #e9f5f2 !important;
    color: #142e23 !important;
  }

  .tab-btn.active {
    background: #fcfbfa !important;
    color: #142e23 !important;
    border-top: 3px solid #2d6a5a !important;
    font-weight: 700 !important;
  }
  .tab-btn.active .material-symbols-outlined {
    color: #2d6a5a !important;
  }

  /* Date Header Bar */
  header.date-bar {
    padding: 12px 24px;
    background: #fcfbfa !important;
    border-bottom: 1px solid #c8ded7 !important;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0;
  }

  .date-display {
    font-family: var(--pico-header-font-family);
    font-size: 1.5rem;
    font-weight: 700;
    color: #142e23 !important;
    margin: 0;
  }

  nav.nav-btn-group {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 0;
    padding: 0;
  }

  .nav-btn {
    background: #e9f5f2 !important;
    border: 1px solid #c8ded7 !important;
    color: #142e23 !important;
    padding: 6px 12px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    width: auto;
  }

  .nav-btn:hover {
    background: #2d6a5a !important;
    color: #ffffff !important;
  }

  /* Main Workspace Spread */
  main.binder-body, section.binder-body {
    display: flex;
    flex: 1;
    overflow: hidden;
    margin: 0;
    padding: 0;
  }

  section.two-page-spread {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
    gap: 16px;
    padding: 20px;
    background: var(--bg-parchment);
    margin: 0;
  }

  @media (max-width: 992px) {
    section.two-page-spread {
      grid-template-columns: 1fr;
    }
  }

  article.page-panel {
    background: #ffffff;
    border: 1px solid var(--border-line);
    border-radius: var(--pico-border-radius);
    padding: 20px;
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 0;
  }

  header.panel-header {
    font-family: var(--pico-header-font-family);
    font-size: 1.2rem;
    color: var(--binder-teal);
    border-bottom: 2px solid var(--binder-teal);
    padding-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0;
    background: transparent;
  }

  .panel-header-title {
    font-family: var(--pico-header-font-family);
    font-size: 1.2rem;
    color: var(--binder-teal);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Form & Quick Add Bar (Pico CSS role="group" compatible) */
  form.task-quick-add-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 0;
  }
  
  form[role="group"].task-quick-add-bar {
    border-radius: var(--pico-border-radius);
  }

  .task-priority-select {
    padding: 6px 10px;
    border-radius: 4px;
    border: 1px solid #c8ded7 !important;
    background-color: #ffffff !important;
    color: #1c2826 !important;
    margin-bottom: 0;
    width: auto;
    min-width: 110px;
    font-size: 0.85rem;
  }

  .task-input-field {
    flex: 1;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid #c8ded7 !important;
    background-color: #ffffff !important;
    color: #1c2826 !important;
    margin-bottom: 0;
    font-size: 0.85rem;
  }

  /* Universal Input Fallbacks */
  input[type="text"],
  input[type="search"],
  select,
  textarea {
    background-color: #ffffff !important;
    color: #1c2826 !important;
    border: 1px solid #c8ded7 !important;
  }

  /* Task Table Styling */
  figure.table-container {
    margin: 0;
    padding: 0;
    overflow-x: auto;
  }

  table.task-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 0;
    background-color: #ffffff !important;
    color: #1c2826 !important;
  }

  table.task-table tr,
  table.task-table tbody tr {
    background-color: #ffffff !important;
    color: #1c2826 !important;
  }

  table.task-table tr:nth-child(even) {
    background-color: #f7faf9 !important;
  }

  table.task-table th {
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #3b5249 !important;
    border-bottom: 2px solid #c8ded7 !important;
    padding: 6px 8px;
    background: #eef6f3 !important;
  }

  table.task-table td {
    padding: 8px;
    border-bottom: 1px solid #e2eee9 !important;
    font-size: 0.9rem;
    color: #1c2826 !important;
    background-color: transparent !important;
  }

  .priority-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 0.75rem;
    color: #ffffff !important;
  }
  .priority-badge.A { background-color: #d9534f !important; }
  .priority-badge.B { background-color: #f0ad4e !important; }
  .priority-badge.C { background-color: #3d7a68 !important; }

  .status-btn {
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 1px solid #c8ded7 !important;
    background: #fcfbfa !important;
    color: #1c2826 !important;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  /* Schedule Grid */
  section.schedule-list {
    display: flex;
    flex-direction: column;
    max-height: 420px;
    overflow-y: auto;
    border: 1px solid var(--border-line);
    border-radius: var(--pico-border-radius);
    margin-bottom: 0;
  }

  .schedule-row {
    display: flex;
    border-bottom: 1px solid #eef5f2;
    min-height: 32px;
    align-items: center;
  }

  .schedule-row.half-hour {
    background-color: #fafdfc;
  }

  time.schedule-time {
    width: 85px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    padding: 6px 10px;
    border-right: 1px solid var(--border-line);
    background: #f4f9f7;
    display: flex;
    align-items: center;
  }

  .schedule-content {
    flex: 1;
    padding: 4px 10px;
  }

  button.event-pill, div.event-pill {
    background: var(--binder-teal-light);
    border: none;
    border-left: 4px solid var(--binder-teal);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--binder-teal);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    width: auto;
  }

  button.event-pill:hover {
    background: var(--binder-teal);
    color: #ffffff;
  }

  /* Daily Notes Pane */
  article.notes-pane {
    background: #fffefb;
    border: 1px solid var(--border-line);
    border-radius: var(--pico-border-radius);
    padding: 16px;
    min-height: 200px;
    font-family: var(--pico-font-family);
    font-size: 0.9rem;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-y: auto;
    margin: 0;
  }

  /* Monthly Calendar View */
  section.monthly-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    padding: 20px;
    width: 100%;
    margin: 0;
  }

  article.calendar-day-cell {
    background: #ffffff;
    border: 1px solid var(--border-line);
    border-radius: var(--pico-border-radius);
    min-height: 110px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.1s ease;
    margin: 0;
  }

  article.calendar-day-cell:hover {
    border-color: var(--binder-teal);
    box-shadow: var(--shadow-soft);
  }

  article.calendar-day-cell.other-month {
    background: #f5f8f7;
    opacity: 0.5;
  }

  header.day-num {
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--binder-teal);
    margin-bottom: 6px;
    padding: 0;
    background: transparent;
    border: none;
  }

  /* Modal System (Pico CSS Native <dialog> Integration) */
  dialog.modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    border: none;
    padding: 0;
    margin: 0;
    max-width: 100%;
    max-height: 100%;
  }

  dialog.modal-backdrop[open] {
    display: flex;
  }

  article.modal-card {
    background: var(--pico-card-background-color);
    border-radius: 8px;
    width: 90%;
    max-width: 550px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 0;
  }

  article.modal-card header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0;
    margin: 0;
    background: transparent;
    border: none;
  }

  footer.modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 12px;
    padding: 0;
    background: transparent;
    border: none;
  }

  /* Standardized Buttons */
  .btn-primary {
    background: var(--binder-teal);
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: auto;
  }

  .btn-primary:hover {
    background: var(--pico-primary-hover);
    color: #ffffff;
  }

  .btn-add-task-round {
    width: 36px;
    height: 36px;
    border-radius: 50% !important;
    padding: 0 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    min-width: 36px !important;
    flex-shrink: 0;
  }

  .btn-secondary {
    background: #e2ece8;
    color: var(--text-primary);
    border: 1px solid var(--border-line);
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: auto;
  }

  .btn-secondary:hover {
    background: #c8ded7;
    color: var(--text-primary);
  }

  /* Utility Classes */
  .icon-14 { font-size: 14px !important; }
  .icon-16 { font-size: 16px !important; }
  .icon-18 { font-size: 18px !important; }
  .icon-28 { font-size: 28px !important; }
  .icon-32 { font-size: 32px !important; }

  .flex-gap-8 {
    display: flex;
    gap: 8px;
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .nav-btn-sync {
    background: rgba(255, 255, 255, 0.13);
    color: #ffffff;
    border-color: rgba(255, 255, 255, 0.33);
  }

  /* Error Banner */
  aside.error-banner {
    background: #ffebee;
    border: 1px solid #ef5350;
    border-radius: var(--pico-border-radius);
    padding: 12px 20px;
    margin: 12px 20px 0 20px;
    color: #c62828;
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .error-banner-content {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .error-close-btn {
    background: transparent;
    border: none;
    color: #c62828;
    cursor: pointer;
    font-weight: bold;
    font-size: 1.1rem;
    padding: 0;
    width: auto;
  }

  /* Subtitles & Spacing Utilities */
  .panel-header-subtitle {
    font-size: 0.8rem;
    font-weight: normal;
    color: var(--text-muted);
  }

  .panel-header-spaced {
    margin-top: 12px;
  }

  /* Table Helper Classes */
  .th-w-40 { width: 40px; }
  .th-w-80 { width: 80px; }
  .th-w-150 { width: 150px; }
  .th-align-right, .td-align-right { text-align: right; }
  .td-category {
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .table-header-row {
    background: #f4f9f7;
  }
  .table-card {
    background: #ffffff;
    border-radius: var(--pico-border-radius);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }

  /* View Containers & Layouts */
  section.view-container {
    width: 100%;
    padding: 20px;
    margin: 0;
  }
  section.view-container-compact {
    width: 100%;
    padding: 10px;
    margin: 0;
  }
  header.view-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    background: transparent;
    padding: 0;
    border: none;
  }
  .view-title {
    font-family: var(--pico-header-font-family);
    color: var(--binder-teal);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.5rem;
  }
  .event-pill-sm {
    font-size: 0.72rem;
    padding: 2px 4px;
    margin-bottom: 2px;
  }
  .btn-sm {
    font-size: 0.75rem;
    padding: 4px 8px;
  }
  .btn-meet {
    background: #1b5e4c;
  }
  .btn-meet:hover {
    background: #124235;
  }
  .doc-link {
    color: var(--binder-teal);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
  }
  .doc-link:hover {
    text-decoration: underline;
  }

  /* Future Planning Matrix */
  section.future-matrix-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 0;
  }
  article.future-month-card {
    background: #ffffff;
    border: 1px solid var(--border-line);
    border-radius: var(--pico-border-radius);
    padding: 12px;
    min-height: 100px;
    margin: 0;
  }
  .future-month-title {
    font-family: var(--pico-header-font-family);
    color: var(--binder-teal);
    border-bottom: 1px solid var(--border-line);
    padding-bottom: 4px;
    margin-top: 0;
    margin-bottom: 8px;
    font-size: 1.1rem;
  }
  .future-month-empty {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Modals & Search Styling */
  .modal-title {
    font-family: var(--pico-header-font-family);
    color: var(--binder-teal);
    margin: 0;
  }
  .modal-title-with-icon {
