    border-radius: 3px;
  }

  /* Margin-annotation look for a decision line; render-time only, nothing is written to the note. */
  .note-card-line-row:has(.note-line-decision) {
    border-left: 3px solid var(--decision-rule);
    border-radius: 0 3px 3px 0;
  }
  .note-card-line-row:has(.note-line-decision):not(.note-line-selected) {
    background: var(--decision-tint);
  }

  .note-card-textarea {
    width: 100%;
    min-height: 90px;
    max-height: 240px;
    font-family: var(--font-family-base);
    font-size: 0.88rem;
    line-height: 1.5;
    padding: 8px 12px;
    border: none;
    background: transparent;
    resize: vertical;
    overflow-y: auto;
    margin-bottom: 0;
  }

  .continuous-doc-textarea {
    width: 100%;
    min-height: 380px;
    font-family: var(--font-family-base);
    font-size: 0.9rem;
    line-height: 28px;
    padding: 12px;
    border: 1px solid var(--border-line) !important;
    background: transparent !important;
    resize: vertical;
    margin-bottom: 0;
  }

  .doc-preview-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    background: var(--c-eef6f3);
    color: var(--binder-teal);
    padding: 6px 12px;
    border-radius: 4px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .empty-cards-notice {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.88rem;
    background: var(--bg-card);
    border: 1px dashed var(--border-line);
    border-radius: 6px;
  }

  .note-card-skeleton,
  .note-card-empty-state {
    padding: 28px 16px;
    text-align: center;
  }

  .note-card-skeleton {
    color: var(--binder-teal);
  }

  .note-card-skeleton .material-symbols-outlined {
    font-size: 1.375rem;
  }

  .note-card-empty-state p {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.88rem;
  }

  /* Monthly Calendar View - Full Screen Vertical Expansion & Y-Scroll */
  section.monthly-calendar-container {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-height: calc((100 * var(--vh)) - 80px);
    padding: 16px 20px 20px 20px;
    box-sizing: border-box;
    overflow-y: auto;
  }

  header.monthly-header-bar {
    flex-shrink: 0;
    margin-bottom: 8px;
  }

  .monthly-weekday-header-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  .monthly-weekday-label {
    text-align: center;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--binder-teal);
    padding: 2px 0;
  }

  section.monthly-grid {
    flex: 1 1 0;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 1fr;
    gap: 8px;
    padding: 0;
    width: 100%;
    margin: 0;
    box-sizing: border-box;
  }

  article.calendar-day-cell {
    background: var(--c-ffffff);
    border: 1px solid var(--border-line);
    border-radius: var(--border-radius);
    height: 100%;
    min-height: 0;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform var(--duration-fast) var(--ease-standard), border-color var(--duration-standard) var(--ease-standard);
    margin: 0;
    box-sizing: border-box;
    overflow: hidden;
  }

  article.calendar-day-cell:hover {
    border-color: var(--binder-teal);
    box-shadow: var(--shadow-soft);
  }

  article.calendar-day-cell.other-month {
    background: #f5f8f7;
    opacity: 0.5;
  }

  article.calendar-day-cell.is-today {
    border: 2px solid var(--priority-a);
    background: var(--binder-teal-light);
  }

  article.calendar-day-cell.is-today:hover {
    border-color: var(--priority-a);
  }

  header.day-num {
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--binder-teal);
    margin-bottom: 4px;
    padding: 0;
    background: transparent;
    border: none;
    flex-shrink: 0;
  }

  article.calendar-day-cell.is-today header.day-num {
    color: var(--priority-a);
  }

  .calendar-day-events {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 2px;
  }

  .calendar-day-events .event-pill-sm {
    flex: 0 0 auto;
    min-height: 20px;
    height: auto;
    line-height: 1.3;
    margin-bottom: 0;
    font-size: 0.72rem;
    padding: 2px 6px;
    border-radius: 2px;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    box-sizing: border-box;
  }

  .calendar-day-events::-webkit-scrollbar {
    width: 4px;
  }
  .calendar-day-events::-webkit-scrollbar-track {
    background: transparent;
  }
  .calendar-day-events::-webkit-scrollbar-thumb {
    background: rgba(45, 106, 90, 0.2);
    border-radius: 2px;
  }
  .calendar-day-events:hover::-webkit-scrollbar-thumb {
    background: rgba(45, 106, 90, 0.45);
  }

  /* Master Tasks Header & Status Filter Stamp Toggles */
  header.master-tasks-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 12px;
  }

  header.master-tasks-header .view-title {
    margin-bottom: 0;
  }

  .master-tasks-filters-wrap {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .task-filter-stamp-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--c-rgba-0-0-0-0p03);
    padding: 3px 6px;
    border: 1px solid var(--border-line);
    border-radius: 2px;
  }

  .task-filter-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-right: 4px;
  }

  .task-filter-stamp {
    border-radius: 2px;
    border: 1px solid var(--border-line);
    background: var(--c-ffffff);
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 7px;
    cursor: pointer;
    transition: all var(--duration-standard) var(--ease-standard);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 26px;
    box-sizing: border-box;
    line-height: 1;
    font-family: inherit;
  }

  .task-filter-stamp:hover {
    border-color: var(--binder-teal);
    color: var(--binder-teal);
  }

  .task-filter-stamp.is-active {
    background: var(--binder-teal);
    border-color: var(--binder-teal);
    color: var(--c-ffffff);
    box-shadow: 0 1px 2px var(--c-rgba-0-0-0-0p12);
  }

  .filter-stamp-glyph {
    font-weight: 700;
    font-size: 0.82rem;
  }

  .filter-stamp-text {
    font-size: 0.72rem;
  }

  /* Master Tasks Date Horizon Filters — Thematic Archival Blue */
  .horizon-filter-stamp {
    border-radius: 2px;
    border: 1px solid var(--border-line);
    background: var(--c-ffffff);
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 8px;
    cursor: pointer;
    transition: all var(--duration-standard) var(--ease-standard);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 26px;
    box-sizing: border-box;
    line-height: 1;
    font-family: inherit;
  }

  .horizon-filter-stamp:hover {
    border-color: var(--ink-blue, var(--c-1d5fa8));
    color: var(--ink-blue, var(--c-1d5fa8));
  }

  .horizon-filter-stamp.is-active {
    background: var(--ink-blue, var(--c-1d5fa8));
    border-color: var(--ink-blue, var(--c-1d5fa8));
    color: var(--c-ffffff);
    box-shadow: 0 1px 2px var(--c-rgba-0-0-0-0p12);
  }

  .empty-tasks-cell {
    text-align: center;
    padding: 24px 16px !important;
    color: var(--text-muted);
    font-size: 0.88rem;
    font-style: italic;
  }

  .btn-link-reset-filter {
    background: none;
    border: none;
    padding: 0 4px;
    color: var(--binder-teal);
    text-decoration: underline;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    font-family: inherit;
  }

  .btn-link-reset-filter:hover {
    color: var(--binder-teal-hover);
  }

  /* Modal System (Native <dialog> Integration) */
  dialog.modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: calc(100 * var(--vw));
    height: calc(100 * var(--vh));
    background: var(--c-rgba-0-0-0-0p5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: var(--z-10000);
    border: none;
    padding: 0;
    margin: 0;
    max-width: 100%;
    max-height: 100%;
  }

  dialog.modal-backdrop:not([open]),
  dialog.modal-backdrop[open="false"] {
    display: none !important;
  }

  dialog.modal-backdrop[open] {
    display: flex !important;
  }

  article.modal-card {
    background: var(--bg-card);
    border-radius: 8px;
    width: 90%;
    max-width: 550px;
    padding: 24px;
    box-shadow: 0 10px 30px var(--c-rgba-0-0-0-0p25);
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 0;
  }

  article.modal-card header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0;
    margin: 0;
    background: transparent;
    border: none;
  }

  footer.modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 12px;
    padding: 0;
    background: transparent;
    border: none;
  }

  /* Standardized Buttons */
  .btn-primary {
    background: var(--binder-teal);
    color: var(--c-ffffff);
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: auto;
  }

  .btn-primary:hover {
    background: var(--binder-teal-hover);
    color: var(--c-ffffff);
  }

  .btn-add-task-round {
    width: 36px;
    height: 36px;
    border-radius: 4px;
    padding: 0;
    display: inline-flex;
    align-items: center !important;
    justify-content: center !important;
    min-width: 36px;
    flex-shrink: 0;
    align-self: center;
  }

  .btn-secondary {
    background: #e2ece8;
    color: var(--text-primary);
    border: 1px solid var(--border-line);
    padding: 8px 16px;
    border-radius: 2px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: auto;
  }

  .btn-secondary:hover {
    background: var(--c-c8ded7);
    color: var(--text-primary);
  }

  /* Utility Classes */
  .icon-14 { font-size: 0.875rem !important; }
  .icon-16 { font-size: 1rem !important; }
  .icon-18 { font-size: 1.125rem !important; }
  .icon-28 { font-size: 1.75rem !important; }
  .icon-32 { font-size: 2rem !important; }

  .flex-gap-8 {
    display: flex;
    gap: 8px;
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .nav-btn-sync {
    background: rgba(255, 255, 255, 0.13);
    color: var(--c-ffffff);
    border-color: rgba(255, 255, 255, 0.33);
  }

  /* Error Banner */
  aside.error-banner {
    background: var(--c-ffebee);
    border: 1px solid var(--c-ef5350);
    border-radius: var(--border-radius);
    padding: 12px 20px;
    margin: 12px 20px 0 20px;
    color: var(--c-c62828);
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .error-banner-content {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .error-close-btn {
    background: transparent;
    border: none;
    color: var(--c-c62828);
    cursor: pointer;
    font-weight: bold;
    font-size: 1.1rem;
    padding: 0;
    width: auto;
  }

  /* Keyed Error Tray: flat bordered rows on parchment, serif header, no pills */
  aside.error-tray {
    background: var(--bg-parchment, var(--c-fcfbfa));
    border: 1px solid var(--border-line);
    border-left: 3px solid var(--note-color-red);
    border-radius: 4px;
    margin: 12px 20px 0 20px;
    color: var(--text-primary);
    font-size: 0.875rem;
  }

  .error-tray-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border-line);
    color: var(--note-color-red);
  }

  .error-tray-title {
    font-family: var(--font-family-header);
    font-size: 1rem;
    font-weight: 600;
    color: var(--binder-teal);
    margin: 0;
  }

  .error-tray-count {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .error-tray-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .error-tray-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border-line);
  }

  .error-tray-row:last-child {
    border-bottom: none;
  }

  .error-tray-icon {
    color: var(--note-color-red);
    flex-shrink: 0;
  }

  .error-tray-row.is-stale .error-tray-icon {
    color: var(--text-muted);
  }

  .error-tray-message {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .error-tray-action,
  .error-tray-more {
    background: transparent;
    border: 1px solid var(--binder-teal);
    border-radius: 4px;
    color: var(--binder-teal);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 2px 10px;
    flex-shrink: 0;
  }

  .error-tray-action:hover,
  .error-tray-more:hover {
    background: var(--binder-teal-light);
  }

  .error-tray-more {
    border: none;
    border-top: 1px solid var(--border-line);
    border-radius: 0;
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 12px;
  }

  .error-tray .error-close-btn {
    color: var(--text-muted);
  }

  /* Subtitles & Spacing Utilities */
  .panel-header-subtitle {
    font-size: 0.8rem;
    font-weight: normal;
    color: var(--text-muted);
  }

  .panel-header-spaced {
    margin-top: 12px;
  }

  /* Table Helper Classes */
  .th-w-40 { width: 40px; }
  .th-w-80 { width: 80px; }
  .th-w-100 { width: 100px; }
  .th-w-150 { width: 150px; }
  .th-w-200 { width: 200px; }
  .th-w-230 { width: 230px; }
  .th-align-right, .td-align-right { text-align: right; }
  .td-category {
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .table-header-row {
    background: var(--c-f4f9f7);
  }
  .table-card {
    background: var(--c-ffffff);
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }

  /* View Containers & Layouts */
  section.view-container {
    width: 100%;
    padding: 20px;
    margin: 0;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  section.view-container-compact {
    width: 100%;
    padding: 10px;
    margin: 0;
    box-sizing: border-box;
    min-height: 0;
  }
  header.view-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    background: transparent;
    padding: 0;
    border: none;
  }
  .view-title {
    font-family: var(--font-family-header);
    color: var(--binder-teal);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.5rem;
  }
  .event-pill-sm {
    font-size: 0.72rem;
    padding: 2px 4px;
    margin-bottom: 2px;
  }
  .btn-sm {
    font-size: 0.75rem;
    padding: 4px 8px;
  }
  .btn-meet {
    background: var(--c-1b5e4c);
  }
  .btn-meet:hover {
    background: var(--c-124235);
  }
  .doc-link {
    color: var(--binder-teal);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    font-size: 0.8rem;
  }
  .doc-link:hover {
    text-decoration: underline;
  }

  .btn-jump-day {
    background: var(--binder-teal-light, var(--c-eef7f4));
    color: var(--binder-teal, var(--c-2d6a5a));
    border: 1px solid var(--border-line, #ccd8d4);
    border-radius: 2px;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 3px 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all var(--duration-standard) var(--ease-standard);
    white-space: nowrap;
    font-family: inherit;
    line-height: 1.2;
  }
  .btn-jump-day:hover {
    background: var(--binder-teal, var(--c-2d6a5a));
    border-color: var(--binder-teal, var(--c-2d6a5a));
    color: var(--c-ffffff);
  }

  /* Future Planning Matrix */
  .future-matrix-container {
    max-height: calc((100 * var(--vh)) - 200px);
    min-height: 280px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 4px;
    padding-bottom: 16px;
  }

  section.future-matrix-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    margin: 0;
  }
  article.future-month-card {
    background: var(--c-ffffff);
    border: 1px solid var(--border-line);
    border-radius: var(--border-radius);
    padding: 12px;
    min-height: 100px;
    margin: 0;
    display: flex;
    flex-direction: column;
  }
  article.future-month-card:has(.status-menu-wrap:hover),
  article.future-month-card:focus-within {
    z-index: var(--z-40);
    position: relative;
  }
  article.future-month-card.is-current-month {
    border: 2px solid var(--priority-a);
    background: var(--binder-teal-light);
    padding: 11px;
  }
  .future-month-title {
    font-family: var(--font-family-header);
    color: var(--binder-teal);
    border-bottom: 1px solid var(--border-line);
    padding-bottom: 4px;
    margin-top: 0;
    margin-bottom: 8px;
    font-size: 1.1rem;
  }
  article.future-month-card.is-current-month .future-month-title {
    color: var(--priority-a);
  }
  .future-month-empty {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 8px;
  }
  .future-matrix-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
    margin-bottom: 12px;
  }
  .future-matrix-year-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .future-matrix-year-label {
    font-family: var(--font-family-header);
    font-weight: 700;
    font-size: 1rem;
    color: var(--binder-teal);
    min-width: 3.5ch;
    text-align: center;
  }
  .future-item-add-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .future-item-input-field {
    flex: 1;
    margin-bottom: 0;
    font-size: 0.8rem;
    padding: 4px 8px;
    height: 28px;
    background-color: var(--c-ffffff);
    color: inherit;
    border: 1px solid var(--border-line);
    border-radius: 4px;
  }

  .future-item-input-field:focus-visible {
    outline: none;
  }
  .future-item-input-field:focus {
    border-color: var(--binder-teal);
  }
  .future-item-input-field::placeholder {
    color: var(--text-muted);
  }
  .future-item-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .future-item-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border-line);
  }
  .future-item-row:last-child {
    border-bottom: none;
  }
  .future-item-row:has(.status-menu-wrap:hover),
  .future-item-row:focus-within {
    z-index: var(--z-50);
    position: relative;
  }
  .future-item-main {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    width: 100%;
  }
  .future-item-title {

    text-decoration: underline;
    cursor: pointer;
  }
  .search-mode-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 6px 0 2px;
  }
  /* The task row a search result jumped to: a teal tint that fades */
  tr.search-hit > td {
    animation: search-hit-fade 2.5s ease-out;
  }
  tr[tabindex="-1"]:focus-visible {
    outline: none;
  }
  @keyframes search-hit-fade {
    0%, 40% { background-color: var(--c-rgba-45-106-90-0p22); }
    100% { background-color: transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    tr.search-hit > td {
      animation: none;
    }
    tr.search-hit {
      outline: 2px solid var(--binder-teal);
      outline-offset: -2px;
    }
  }
  /* Appointment Event Details Modal (33% wider and taller) */
  article.modal-card-event {
    max-width: 735px;
    width: 92%;
    min-height: min(460px, (80 * var(--vh)));
    max-height: calc(88 * var(--vh));
    display: flex;
    flex-direction: column;
  }
  .modal-card-event .modal-body-details {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }
  .modal-card-event .modal-meet-row {
    word-break: break-all;
  }
  .modal-card-event .modal-meet-link {
    color: var(--priority-a);
    text-decoration: underline;
    font-weight: 500;
  }
  .modal-card-event .modal-meet-link:hover {
    color: var(--binder-teal-hover);
  }
  .modal-card-event .modal-description {
    flex: 1;
    min-height: 180px;
    max-height: min(420px, (50 * var(--vh)));
    overflow-y: auto;
    background: var(--bg-surface, var(--c-rgba-0-0-0-0p02));
    border: 1px solid var(--border-line);
    border-radius: 4px;
    padding: 12px 14px;
  }
  [data-theme="dark"] .modal-card-event .modal-description {
    background: rgba(255, 255, 255, 0.03);
    border-color: var(--c-rgba-255-255-255-0p12);
  }
  article.modal-card-wide {
    max-width: 650px;
  }
  input.search-input-field {
    width: 100%;
    padding: 10px;
    border-radius: var(--border-radius);
    border: 1px solid var(--border-line);
    font-size: 1rem;
    margin-bottom: 16px;
  }
  .search-results-container {
    max-height: 300px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-no-results {
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  article.search-result-item {
    padding: 8px 12px;
    border-radius: 4px;
    margin: 0;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background-color var(--duration-standard) var(--ease-standard), border-color var(--duration-standard) var(--ease-standard), box-shadow var(--duration-standard) var(--ease-standard);
  }
  article.search-result-item:hover,
  article.search-result-item.selected {
    border-color: var(--binder-teal);
    box-shadow: 0 0 0 1px var(--binder-teal);
  }
  .search-result-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
  }
  .search-result-badge {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    background: rgba(0, 0, 0, 0.08);
    color: var(--text-primary);
    flex-shrink: 0;
  }
  .search-result-title {
    flex: 1;
    font-size: 0.92rem;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .search-result-date {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .search-result-snippet {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-left: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .result-calendar {
    background: var(--binder-teal-light);
  }
  .result-task {
    background: #fff8e1;
  }
  .result-note {
    background: #f0f4f8;
  }
  .result-index {
    background: var(--c-e2f2ec);
  }
  .result-archive {
    background: #fbf5ea;
    border-left: 3px solid var(--c-b8860b);
  }
  .search-modal-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }
  .search-archive-indicator {
    font-size: 0.78rem;
    color: var(--binder-teal);
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  .search-result-doc-link {
    margin-left: auto;
    color: var(--binder-teal);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
    border-radius: 3px;
    opacity: 0.65;
    text-decoration: none;
    transition: opacity 0.15s ease, background-color 0.15s ease;
  }
  .search-result-doc-link:hover {
    opacity: 1;
    background: var(--c-rgba-0-0-0-0p06);
  }

  /* About Page Styling */
  .about-view-container {
    max-height: calc((100 * var(--vh)) - 80px);
    min-height: 280px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 16px 24px 16px;
    box-sizing: border-box;
    width: 100%;
  }

  article.about-container {
    max-width: 960px;
    margin: 12px auto 24px auto;
    padding: 32px;
    background: var(--c-ffffff);
    border: 1px solid var(--border-line);
    border-radius: 8px;
    box-shadow: var(--shadow-soft);
    font-family: var(--font-family-base);
    color: var(--text-primary);
    line-height: 1.7;
  }
  header.about-header {
    border-bottom: 2px solid var(--binder-teal);
    padding-bottom: 16px;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: transparent;
  }
  .about-title {
    font-family: var(--font-family-header);
    color: var(--binder-teal);

    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
  }
  .about-subtitle {

  .build-badge {
    display: inline-block;

    font-size: 0.72rem;
    font-weight: 600;

    color: var(--binder-teal);
    background: var(--binder-teal-light);
    border: 1px solid var(--border-line);
    vertical-align: middle;
    cursor: default;
  }
  .security-badge {
    background: var(--binder-teal-light);

    font-weight: 700;
    padding: 6px 14px;
    font-size: 0.8rem;
    border-radius: 4px;

    align-items: center;

  }
  .about-version {
    color: var(--binder-teal);
    font-weight: 600;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-install-app-header {
    background: var(--binder-teal, var(--c-2d6a5a));
    color: var(--c-ffffff);
    border: 1px solid var(--binder-teal, var(--c-2d6a5a));
    border-radius: 2px;
    font-family: var(--font-family-header, Georgia, serif);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 4px 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: background var(--duration-standard) var(--ease-standard), box-shadow var(--duration-standard) var(--ease-standard);
  }
  .btn-install-app-header:hover {
    background: #245548;
    box-shadow: 0 1px 3px var(--c-rgba-0-0-0-0p15);
  }
  .install-actions-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .install-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    padding: 6px 14px;
    border-radius: 2px;
  }
  .install-actions-bar .btn-secondary,
  .modal-card-install .btn-secondary {
    background: transparent;
    color: var(--binder-teal, var(--c-2d6a5a));
    border: 1px solid var(--binder-teal, var(--c-2d6a5a));
    border-radius: 2px;
    font-weight: 600;
  }
  .install-actions-bar .btn-secondary:hover,
  .modal-card-install .btn-secondary:hover {
    background: var(--c-rgba-45-106-90-0p08);
    color: #1e4a3e;
  }
  .modal-card-install {
    max-width: 520px;
    width: 90%;
  }
  .install-platform-guide {
    background: var(--bg-hover, rgba(45, 106, 90, 0.05));
    border: 1px solid var(--border-line);
    border-radius: 2px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .install-platform-title {
    margin: 0 0 6px 0;
    font-size: 0.88rem;
    font-family: var(--font-family-header);
    color: var(--binder-teal);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .modal-detail-intro {
    margin-top: 0;
    margin-bottom: 14px;
    color: var(--text-secondary);
  }

  /* Time Machine (Note Version History) */
  article.modal-card-time-machine {
    max-width: 820px;
    width: calc(92 * var(--vw));
  }
  .time-machine-container {
    display: flex;
    min-height: 380px;
    max-height: 520px;
    border: 1px solid var(--border-line);
    background: var(--bg-paper);
    margin-top: 10px;
  }
  .time-machine-sidebar {
    width: 280px;
    min-width: 240px;
    border-right: 1px solid var(--border-line);
    overflow-y: auto;
    background: var(--bg-surface, var(--c-rgba-0-0-0-0p02));
    display: flex;
    flex-direction: column;
  }
  .time-machine-empty-list {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .time-machine-item {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-line);
    cursor: pointer;
    transition: background 0.15s ease;
    text-align: left;
    border-left: 3px solid transparent;
  }
  .time-machine-item:hover {
    background: var(--bg-hover, var(--c-rgba-0-0-0-0p04));
  }
  .time-machine-item.is-selected {
    background: var(--c-rgba-45-106-90-0p08);
    border-left: 3px solid var(--binder-teal, var(--c-2d6a5a));
  }
  .time-machine-item-time {
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--text-primary);
    display: flex;
    align-items: center;

  }
  .time-machine-badge-latest {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--binder-teal, var(--c-2d6a5a));
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-left: 4px;
  }
  .time-machine-item-meta {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .time-machine-preview-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px 20px;
    overflow: hidden;
    background: var(--bg-paper);
  }
  .time-machine-preview-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-line);
    margin-bottom: 12px;
  }
  .time-machine-preview-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.05rem;
    color: var(--binder-teal, var(--c-2d6a5a));
    margin: 0;
  }
  .time-machine-preview-stats {
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .time-machine-preview-content {
    flex: 1;

    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.6;

    word-break: break-word;
    padding: 12px;
    background: var(--bg-surface, var(--c-rgba-0-0-0-0p02));
    border: 1px solid var(--border-line);
    border-radius: 2px;
  }
  .time-machine-toast,
  .task-toast {

    color: var(--c-ffffff);
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 0.9rem;
    box-shadow: 0 4px 14px var(--c-rgba-0-0-0-0p25);
    z-index: var(--z-9999);
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  [data-theme="dark"] .time-machine-item.is-selected {
    background: var(--c-rgba-45-106-90-0p25);
    border-left-color: var(--c-79d6bd);
  }
  [data-theme="dark"] .time-machine-badge-latest {
    color: var(--c-79d6bd);
  }
  [data-theme="dark"] .time-machine-preview-title {
    color: var(--c-79d6bd);
  }

  .about-section-heading {
    font-family: var(--font-family-header);
    color: var(--binder-teal);
    margin-top: 24px;
    margin-bottom: 8px;
    font-size: 1.3rem;
  }
  .about-paragraph {
    margin-top: 8px;
    margin-bottom: 12px;
  }
  /* About page: sticky in-page jump strip (flat underline, same idiom as .segment-btn) */
  nav.about-toc {
    position: sticky;
    top: -10px;
    z-index: var(--z-5);
    display: flex;
    flex-wrap: wrap;
    gap: 2px 4px;
    margin: -8px 0 8px 0;
    padding: 8px 0 0 0;
    background: var(--c-ffffff);
    border-bottom: 1px solid var(--border-line);
  }
  @media (max-width: 640px) {
    nav.about-toc {
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
  }
  .about-toc-link {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 6px 10px;
    font-family: var(--font-family-base);
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: color var(--duration-standard) var(--ease-standard), border-color var(--duration-standard) var(--ease-standard);
  }
  .about-toc-link:hover,
  .about-toc-link:focus-visible {
    color: var(--binder-teal);
    border-bottom-color: var(--binder-teal);
  }
  .about-container .about-section-heading {
    scroll-margin-top: 56px;
  }
  .about-container .guide-card-text + .guide-card-text {
    margin-top: 8px;
  }
  table.about-tag-table code {
    white-space: nowrap;
  }
  details.about-details {
    background: var(--c-f8fcfa);
    border: 1px solid var(--border-line);
    border-radius: var(--border-radius);
    padding: 14px 18px;
    margin: 0;
  }
  details.about-details > summary {
    cursor: pointer;
    list-style: none;
    margin-bottom: 0;
  }
  details.about-details > summary::-webkit-details-marker {
    display: none;
  }
  details.about-details > summary::after {
    content: 'expand_more';
    font-family: 'Material Symbols Outlined';
    margin-left: auto;
    transition: transform var(--duration-standard) var(--ease-standard);
  }
  details.about-details[open] > summary::after {
    transform: rotate(180deg);
  }
  details.about-details[open] > summary {
    margin-bottom: 6px;
  }
  /* Flat outline action button (About hub link, Tutorial). No pills: 2px radius like .btn-install-app-header. */
  .about-action-btn {
    background: transparent;
    color: var(--binder-teal, var(--c-2d6a5a));
    border: 1px solid var(--binder-teal, var(--c-2d6a5a));
    border-radius: 2px;
    font-family: var(--font-family-base);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 3px 10px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: background var(--duration-standard) var(--ease-standard);
  }
  .about-action-btn:hover,
  .about-action-btn:focus-visible {
    background: var(--c-eef6f3);
  }
  .about-action-btn.is-on {
    background: var(--binder-teal, var(--c-2d6a5a));
    color: var(--c-ffffff);
  }
  .about-action-btn.is-on.is-fail {
    background: var(--c-b3261e);

  .hub-sheet-link {

    flex-wrap: wrap;
    align-items: center;
    gap: 6px 8px;
  }

    color: var(--binder-teal, var(--c-2d6a5a));

    align-items: center;
    gap: 2px;

    font-size: 0.8rem;

    color: var(--c-b3261e);
  }

  }
  .tutorial-ex-id {

    padding: 0 4px;

  .tutorial-ex-mark.is-fail {

      margin-bottom: 6px;

  .tutorial-ex-actions {

    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .tutorial-note {
    flex: 1 1 200px;

    border-radius: 2px;

  [data-theme="dark"] .about-action-btn,
  [data-theme="dark"] .hub-sheet-link-anchor,

  [data-theme="dark"] .hub-sheet-link-error,

  [data-theme="dark"] .about-toc-link:hover,

    border-bottom-color: var(--c-79d6bd);

  [data-theme="dark"] details.guide-card {
    background: var(--c-193328);
    border-color: var(--c-244a3b);

  aside.security-callout, section.security-callout {
    background: var(--c-eef7f4);

    padding: 16px 20px;
    border-radius: var(--border-radius);

  .security-callout-title {
    font-family: var(--font-family-header);

    color: var(--c-ffffff);

    height: 36px;
    border-radius: 4px;

    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--duration-slow) var(--ease-standard), transform var(--duration-slow) var(--ease-standard);

    padding: 0;

  /* ==========================================
     Gmail / Meeting Hub: Triage and Meeting Prep views.
     Flat bordered tables and text labels, no pill or circular chrome.
     ========================================== */
  .hub-view {
    gap: 12px;
  }

  .hub-header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 16px;
  }

  .hub-header .view-title {
    margin: 0;
  }

  .hub-header-meta {
    margin: 0;
    flex: 1 1 auto;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  /* Under the header in a column flex container: must not grow like the header-row meta. */
  .hub-mail-note {
    margin: 0;
    flex: none;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .hub-filed-emails {
    margin: 0 0 8px;
    padding: 6px 12px;
    border: 1px solid var(--border-color, #ccc);
  }

  .hub-filed-emails ul {
    margin: 6px 0 0;
    padding-left: 18px;
  }

  .hub-filed-meta {
    opacity: 0.7;
    font-size: 0.85em;
  }

  .hub-refresh-btn {
    margin-left: auto;
  }

  /* Trial mode / Live: always-visible mode badge plus its switch button, left of Refresh. */
  .hub-mode-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  .hub-mode-control + .hub-refresh-btn {
    margin-left: 0;
  }

  .hub-mode-control,
  .hub-mode-control + .hub-refresh-btn {
    align-self: center;
  }

  .hub-mode-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border: 1px solid currentColor;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .hub-mode-badge.is-trial {
    color: var(--c-8a5a00);
    background: #fff6e0;
  }

  /* Live is the normal state: a quiet mark, no box. Tap or focus shows the full sentence. */
  .hub-live-quiet {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--c-5f6b68);
    font-size: 0.78rem;
    cursor: default;
    border-radius: 4px;
    padding: 2px 4px;
  }

  .hub-live-quiet:focus-visible {
    outline: 2px solid var(--binder-teal, var(--c-2d6a5a));
    outline-offset: 2px;
  }

  /* Status light: a small square, per the no-pills rule (no circles). */
  .hub-live-dot {
    display: inline-block;
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: #2e9d6f;
  }

  .about-mode-row {
    margin: 0 0 12px;
    padding: 8px 12px;
    border-left: 3px solid var(--binder-teal, var(--c-2d6a5a));
    color: var(--c-5f6b68);
    font-size: 0.85rem;
  }

  .about-mode-row p {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  [data-theme="dark"] .hub-mode-badge.is-trial {
    color: var(--c-f5c26b);
    background: rgba(245, 194, 107, 0.12);
  }

  [data-theme="dark"] .hub-live-quiet,
  [data-theme="dark"] .about-mode-row {
    color: var(--c-9fb5ad) !important;
  }

  [data-theme="dark"] .hub-live-dot {
    background: #5fd3a5 !important;
  }

  .hub-link-btn {
    background: transparent;
    border: none;
    padding: 0 2px;
    width: auto;
    color: var(--binder-teal);
    font: inherit;
    text-decoration: underline;
    cursor: pointer;
  }

  .hub-link-btn:focus-visible,
  .hub-action-btn:focus-visible {
    outline: 2px solid var(--binder-teal);
    outline-offset: 2px;
  }

  .hub-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 12px;
    margin: 0;
    padding: 8px 12px;
    border: 1px solid var(--border-line);
    border-left: 4px solid var(--binder-teal);
    border-radius: 2px;
    background: var(--bg-card);
    color: var(--text-primary);
    font-size: 0.88rem;
  }

  .hub-banner-dryrun {
    border-left-color: var(--c-8a5a00);
  }

  .hub-banner-error {
    border-left-color: var(--c-b91c1c);
  }

  .auth-approval-banner {
    margin: 8px 16px;
    align-items: center;
  }

  /* Busy buttons: a turning Material icon, not a CSS ring (no circles, see no-pills). */
  .btn-spinner {
    display: inline-block;
    margin-right: 4px;
    vertical-align: -3px;
    animation: btn-spin 1s linear infinite;
  }

  @keyframes btn-spin {
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-spinner { animation: none; }
  }

  .learn-progress-wrap {
    display: flex;
    flex-basis: 100%;
    flex-direction: column;
    gap: 4px;
    margin: 6px 0;
  }

  .learn-progress {
    display: block;
    width: 100%;
    max-width: 420px;
    height: 8px;
    border: 1px solid var(--binder-teal);
    border-radius: 2px;
    overflow: hidden;
  }

  .learn-progress-fill {
    display: block;
    height: 100%;
    background: var(--binder-teal);
    transition: width 0.4s ease;
  }

  .auth-recheck-note {
    flex-basis: 100%;
    font-weight: 600;
  }

  /* The one action that unblocks the app: a solid gold button, hard to miss (user missed a plain link). */
  .auth-approve-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: 2px solid var(--c-b8860b);
    border-radius: 4px;
    background: #f5b301;
    color: var(--c-1c1400);
    font-weight: 700;
    font-size: 0.92rem;
    text-decoration: none;
    box-shadow: 0 1px 3px var(--c-rgba-0-0-0-0p25);
  }

  .auth-approve-btn:hover,
  .auth-approve-btn:focus-visible {
    background: #ffc72c;
    outline: 2px solid var(--c-1c1400);
    outline-offset: 2px;
  }

  .trial-mode-banner {
    margin: 8px 16px;
    align-items: center;
  }

  .hub-banner-btn {
    padding: 4px 12px;
    font-size: 0.85rem;
  }

  .go-live-body p {
    margin: 6px 0;
  }

  .go-live-body ul {
    margin: 4px 0 8px 20px;
    padding: 0;
  }

  .go-live-body li {
    margin: 2px 0;
  }

  .hub-mode-snack {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: calc(100vw - 32px);
    padding: 8px 8px 8px 16px;
    background: #2b2b2b;
    color: var(--c-ffffff);
    border-radius: 4px;
    box-shadow: 0 4px 14px var(--c-rgba-0-0-0-0p25);
    font-size: 0.9rem;
    z-index: var(--z-9999);
  }

  .hub-snack-btn {
    background: transparent;
    border: 0;
    border-radius: 4px;
    padding: 6px 10px;
    color: #9fdcc9;
    font-weight: 600;
    cursor: pointer;
  }

  .hub-snack-btn:hover,
  .hub-snack-btn:focus-visible {
    background: var(--c-rgba-255-255-255-0p1);
  }

  .hub-notice-link {
    color: var(--binder-teal);
  }

  .hub-empty {
    padding: 16px;
    border: 1px solid var(--border-line);
    border-radius: 2px;
    background: var(--bg-card);
    color: var(--text-primary);
    max-width: 62ch;
  }

  .hub-empty-title,
  .hub-queue-title,
  .hub-prep-title {
    font-family: var(--font-family-header);
    margin: 0 0 6px 0;
  }

  .hub-empty-title {
    font-size: 1.1rem;
  }

  .hub-queue-title {
    font-size: 1rem;
  }

  .hub-prep-title {
    font-size: 1.25rem;
  }

  .hub-queues {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .hub-queue-empty {
    margin: 0 0 6px 0;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .hub-carryins,
  .hub-carryin-item {
    margin: 0 0 6px 0;
    border: 1px solid var(--border-line);
    border-radius: 2px;
    background: var(--bg-card);
  }

  .hub-carryins-summary,
  .hub-carryin-item-summary {
    padding: 6px 8px;
    cursor: pointer;
  }

  .hub-carryin-item {
    margin: 0 8px 6px 8px;
  }

  .hub-carryin-body {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 2px 12px;
    margin: 0;
    padding: 4px 8px 8px 8px;
    font-size: 0.85rem;
  }

  .hub-carryin-body dt {
    color: var(--text-muted);
  }

  .hub-carryin-body dd {
    margin: 0;
  }

  .hub-carryin-copy {
    padding: 0 8px 8px 8px;
  }

  .hub-carryin-text {
    display: block;
    box-sizing: border-box;
    width: 100%;
    min-height: 96px;
    margin: 8px 0 6px 0;
    padding: 8px;
    font: inherit;
    font-size: 0.85rem;
    color: var(--text-primary);
    background: var(--bg-card);
    border: 1px solid var(--border-line);
    border-radius: 2px;
    resize: vertical;
  }

  .hub-table-wrap {
    margin: 0;
    overflow-x: auto;
    border: 1px solid var(--border-line);
    border-radius: 2px;
    background: var(--bg-card);
  }

  .hub-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-card);
    color: var(--text-primary);
    font-size: 0.88rem;
  }

  .hub-table th {
    text-align: left;
    padding: 6px 8px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    background: var(--binder-teal-light);
    border-bottom: 2px solid var(--border-line);
    vertical-align: bottom;
  }

  .hub-table td {
    padding: 8px;
    border-bottom: 1px solid var(--border-line);
    vertical-align: top;
  }

  .hub-table tbody tr:last-child td {
    border-bottom: none;
  }

  .hub-facts {
    max-width: 640px;
    margin-bottom: 14px;
    border: 1px solid var(--border-line);
  }

  .hub-facts th {
    width: 130px;
    text-transform: none;
    letter-spacing: 0;
    font-size: 0.85rem;
  }

  .hub-col-score { width: 120px; }
  .hub-col-signals { width: 22%; }
  .hub-col-ledger { width: 110px; }
  .hub-col-actions { width: 300px; }

  .hub-score-num {
    display: block;
    font-weight: 700;
    font-size: 1.05rem;
  }

  .hub-band {
    display: block;
    font-size: 0.74rem;
    color: var(--text-muted);
  }

  .hub-subject {
    display: block;
    font-weight: 600;
  }

  /* Thread cell hierarchy, as in Gmail: subject (bold), sender (dark, semibold) and date (muted), preview (muted). */
  .hub-from-name {
    color: var(--text-primary);
    font-weight: 600;
  }

  /* Gmail inbox-style preview of the latest message: one line, click to show three. */
  .hub-snippet {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 1;
    line-clamp: 1;
    overflow: hidden;
    width: 100%;
    margin: 3px 0 0;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: none;
    color: var(--text-muted);
    font: inherit;
    font-size: 0.8rem;
    text-align: left;
    cursor: pointer;
  }

  .hub-snippet.is-open.lines-3 {
    -webkit-line-clamp: 3;
    line-clamp: 3;
  }

  .hub-snippet.is-open.lines-4 {
    -webkit-line-clamp: 4;
    line-clamp: 4;
  }

  .hub-snippet.is-open.lines-5 {
    -webkit-line-clamp: 5;
    line-clamp: 5;
  }

  .hub-snippet:hover {
    color: var(--text-primary);
  }

  .hub-snippet:focus-visible {
    outline: 2px solid var(--binder-teal);
    outline-offset: 2px;
  }

  .hub-from,
  .hub-suggest,
  .hub-signals,
  .hub-labels {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .hub-suggest-item {
    margin-left: 6px;
    text-decoration: underline dotted;
  }

  .hub-ledger {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .hub-ledger-done { color: #1f6b34; }
  .hub-ledger-error { color: var(--c-b91c1c); }
  .hub-ledger-deferred { color: var(--c-8a5a00); }
  .hub-ledger-dry-run { color: var(--c-1d5fa8); }

  [data-theme="dark"] .hub-ledger-done { color: #6ee7a1; }
  [data-theme="dark"] .hub-ledger-error { color: var(--c-fca5a5); }
  [data-theme="dark"] .hub-ledger-deferred { color: var(--c-f5c26b); }
  [data-theme="dark"] .hub-ledger-dry-run { color: #8cc0f5; }
  [data-theme="dark"] .hub-banner-dryrun { border-left-color: var(--c-f5c26b); }
  [data-theme="dark"] .hub-banner-error { border-left-color: var(--c-fca5a5); }
  [data-theme="dark"] .auth-approve-btn {
    background: rgba(255, 213, 74, 0.14);
    border-color: var(--c-ffd54a);
    color: var(--c-ffd54a) !important;
  }
  [data-theme="dark"] .auth-approve-btn:hover,
  [data-theme="dark"] .auth-approve-btn:focus-visible {
    background: rgba(255, 213, 74, 0.26);
    outline-color: var(--c-ffd54a);
  }

  .hub-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .hub-action-btn {
    display: inline-block;
    width: auto;
    padding: 3px 8px;
    border: 1px solid var(--binder-teal);
    border-radius: 3px;
    background: transparent;
    color: var(--binder-teal);
    font: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1.3;
    text-decoration: none;
    cursor: pointer;
  }

  .hub-action-btn:hover {
    background: var(--binder-teal-light);
  }

  /* Saved board on screen (still refreshing): actions wait for fresh data. */
  .hub-action-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    background: transparent;
  }

  /* Colour mapping: teal = creates a task or note, muted = routine routing, red (below) = Delete only. */
  .hub-action-btn.hub-action-quiet {
    border-color: var(--border-line);
    color: var(--text-muted);
  }

  /* Triage Archive / Delete: icon + label, same flat 3px-radius chrome as the other actions. */
  .hub-action-btn.hub-action-icon {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }

  .hub-action-btn.hub-action-danger {
    border-color: var(--c-b3261e);
    color: var(--c-b3261e);
  }
