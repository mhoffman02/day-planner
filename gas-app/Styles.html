<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0');

  :root {
    --bg-parchment: #fcfbfa;
    --bg-binder: #1b4332;
    --text-primary: #1c2826;
    --text-muted: #5c6b66;
    --binder-teal: #2d6a5a;
    --binder-teal-light: #e9f5f2;
    --border-line: #c8ded7;
    --priority-a: #d9534f;
    --priority-b: #f0ad4e;
    --priority-c: #337ab7;
    --status-complete: #2b8a3e;
    --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: #12241d;
    color: var(--text-primary);
    min-height: 100vh;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Material Symbols Styling */
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-size: 20px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-smoothing: antialiased;
    vertical-align: middle;
  }

  /* Binder Outer Frame */
  .binder-container {
    width: 100%;
    max-width: 1380px;
    background: var(--bg-parchment);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    border: 12px solid #142e23;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 92vh;
  }

  /* Header & Navigation Bar */
  .binder-header {
    background: var(--binder-teal);
    color: #ffffff;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #1c453a;
  }

  .brand-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-title span.badge {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    background: #ffffff33;
    padding: 3px 8px;
    border-radius: 12px;
    text-transform: uppercase;
  }

  .search-trigger-btn {
    background: #ffffff1f;
    border: 1px solid #ffffff44;
    color: #ffffff;
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s ease;
  }

  .search-trigger-btn:hover {
    background: #ffffff35;
  }

  .kbd-shortcut {
    background: #ffffff33;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.75rem;
  }

  /* Top View Tabs */
  .view-tabs-bar {
    background: #e1efe9;
    padding: 8px 16px 0 16px;
    display: flex;
    gap: 6px;
    border-bottom: 2px solid var(--border-line);
    overflow-x: auto;
  }

  .tab-btn {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 10px 18px;
    border: 1px solid var(--border-line);
    border-bottom: none;
    background: #d4e7df;
    color: var(--text-muted);
    border-top-left-radius: 6px;
    border-top-right-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab-btn:hover {
    background: var(--binder-teal-light);
    color: var(--binder-teal);
  }

  .tab-btn.active {
    background: var(--bg-parchment);
    color: var(--binder-teal);
    border-top: 3px solid var(--binder-teal);
    font-weight: 700;
  }

  /* Date Header Bar */
  .date-bar {
    padding: 12px 24px;
    background: var(--bg-parchment);
    border-bottom: 1px solid var(--border-line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .date-display {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--binder-teal);
  }

  .nav-btn-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .nav-btn {
    background: var(--binder-teal-light);
    border: 1px solid var(--border-line);
    color: var(--binder-teal);
    padding: 6px 12px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .nav-btn:hover {
    background: var(--binder-teal);
    color: #ffffff;
  }

  /* Main Workspace Spread */
  .binder-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .two-page-spread {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
    gap: 16px;
    padding: 20px;
    background: var(--bg-parchment);
  }

  @media (max-width: 992px) {
    .two-page-spread {
      grid-template-columns: 1fr;
    }
  }

  .page-panel {
    background: #ffffff;
    border: 1px solid var(--border-line);
    border-radius: 8px;
    padding: 20px;
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-header {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--binder-teal);
    border-bottom: 2px solid var(--binder-teal);
    padding-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Task Table Styling */
  .task-table {
    width: 100%;
    border-collapse: collapse;
  }

  .task-table th {
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border-line);
    padding: 6px 8px;
  }

  .task-table td {
    padding: 8px;
    border-bottom: 1px solid #f0f5f3;
    font-size: 0.9rem;
  }

  .priority-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 0.75rem;
    color: #ffffff;
  }
  .priority-badge.A { background-color: var(--priority-a); }
  .priority-badge.B { background-color: var(--priority-b); }
  .priority-badge.C { background-color: var(--priority-c); }

  .status-btn {
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 1px solid var(--border-line);
    background: var(--bg-parchment);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Schedule Grid */
  .schedule-list {
    display: flex;
    flex-direction: column;
    max-height: 420px;
    overflow-y: auto;
    border: 1px solid var(--border-line);
    border-radius: 6px;
  }

  .schedule-row {
    display: flex;
    border-bottom: 1px solid #eef5f2;
    min-height: 32px;
    align-items: center;
  }

  .schedule-row.half-hour {
    background-color: #fafdfc;
  }

  .schedule-time {
    width: 85px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    padding: 6px 10px;
    border-right: 1px solid var(--border-line);
    background: #f4f9f7;
  }

  .schedule-content {
    flex: 1;
    padding: 4px 10px;
  }

  .event-pill {
    background: var(--binder-teal-light);
    border-left: 4px solid var(--binder-teal);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--binder-teal);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* Daily Notes Pane */
  .notes-pane {
    background: #fffefb;
    border: 1px solid var(--border-line);
    border-radius: 6px;
    padding: 16px;
    min-height: 200px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-y: auto;
  }

  /* Monthly Calendar View */
  .monthly-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    padding: 20px;
    width: 100%;
  }

  .calendar-day-cell {
    background: #ffffff;
    border: 1px solid var(--border-line);
    border-radius: 6px;
    min-height: 110px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .calendar-day-cell:hover {
    border-color: var(--binder-teal);
    box-shadow: var(--shadow-soft);
  }

  .calendar-day-cell.other-month {
    background: #f5f8f7;
    opacity: 0.5;
  }

  .day-num {
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--binder-teal);
    margin-bottom: 6px;
  }

  /* Modal System */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .modal-card {
    background: #ffffff;
    border-radius: 8px;
    width: 90%;
    max-width: 550px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 12px;
  }

  .btn-primary {
    background: var(--binder-teal);
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn-secondary {
    background: #e2ece8;
    color: var(--text-primary);
    border: 1px solid var(--border-line);
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
</style>
