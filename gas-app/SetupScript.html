<script>
  document.addEventListener('DOMContentLoaded', function() {
    var form = document.getElementById('formContainer');
    if (form) {
      form.addEventListener('submit', function(event) {
        event.preventDefault();
        submitFolderUrl();
      });
    }

    var autoCreateBtn = document.getElementById('autoCreateBtn');
    if (autoCreateBtn) {
      autoCreateBtn.addEventListener('click', function() {
        handleAutoCreateFolder();
      });
    }
  });

  function showToast(message, type, durationMs, title) {
    type = type || 'info';
    durationMs = durationMs || 10000;
    title = title || (type === 'error' ? 'Notice' : type === 'success' ? 'Success' : 'Information');

    var container = document.getElementById('toastContainer');
    if (!container) return;

    var toast = document.createElement('div');
    toast.className = 'toast-item toast-' + type;
    toast.setAttribute('role', 'alert');

    var iconName = type === 'error' ? 'error' : type === 'warning' ? 'warning' : type === 'success' ? 'check_circle' : 'info';

    toast.innerHTML = 
      '<div class="toast-body">' +
        '<span class="material-symbols-outlined toast-icon">' + iconName + '</span>' +
        '<div class="toast-content">' +
          '<div class="toast-title">' + escapeHtml(title) + '</div>' +
          '<div class="toast-message">' + escapeHtml(message) + '</div>' +
        '</div>' +
        '<button type="button" class="toast-dismiss-btn" aria-label="Dismiss notification">✕</button>' +
      '</div>' +
      '<div class="toast-progress-bar">' +
        '<div class="toast-progress-fill" style="animation-duration: ' + durationMs + 'ms;"></div>' +
      '</div>';

    container.appendChild(toast);

    var dismissBtn = toast.querySelector('.toast-dismiss-btn');
    var timerId = setTimeout(dismiss, durationMs);

    function dismiss() {
      clearTimeout(timerId);
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(-8px) scale(0.96)';
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 250);
    }

    dismissBtn.addEventListener('click', dismiss);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function handleAutoCreateFolder() {
    var autoCreateBtn = document.getElementById('autoCreateBtn');
    var statusBox = document.getElementById('statusBox');
    var ackContainer = document.getElementById('ackContainer');

    autoCreateBtn.disabled = true;
    autoCreateBtn.innerHTML = '<span class="material-symbols-outlined">hourglass_top</span> Creating Day Planner Folder...';
    statusBox.style.display = 'none';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .autoCreateRootFolder();
    } else {
      setTimeout(function() {
        onSuccess({ success: true, folderName: 'Day Planner', folderId: 'mock_auto_id_123', message: 'Dedicated Day Planner folder created successfully!' });
      }, 600);
    }

    function onSuccess(res) {
      autoCreateBtn.disabled = false;
      autoCreateBtn.innerHTML = '<span class="material-symbols-outlined">add_circle</span> 1-Click Auto-Create "Day Planner" Folder';

      if (res && res.success) {
        showToast(res.message || 'Connected to folder: ' + res.folderName, 'success', 10000, 'Folder Ready');
        statusBox.className = 'status-box success';
        statusBox.style.display = 'block';
        statusBox.innerHTML = '<b><span class="material-symbols-outlined">check_circle</span> Success!</b> Connected to Google Drive folder: <b>"' + (res.folderName || 'Day Planner') + '"</b>.';
        document.getElementById('formContainer').style.display = 'none';
        autoCreateBtn.parentElement.style.display = 'none';
        ackContainer.style.display = 'block';
      } else {
        var errText = (res && res.error) || 'Failed to auto-create folder. Please check your Drive permissions.';
        showToast(errText, 'error', 10000, 'Folder Creation Notice');
        statusBox.className = 'status-box error';
        statusBox.style.display = 'block';
        statusBox.innerHTML = '<b><span class="material-symbols-outlined">error</span> Notice:</b> ' + errText;
      }
    }

    function onFailure(err) {
      autoCreateBtn.disabled = false;
      autoCreateBtn.innerHTML = '<span class="material-symbols-outlined">add_circle</span> 1-Click Auto-Create "Day Planner" Folder';
      var errText = err.message || err.toString();
      showToast(errText, 'error', 10000, 'Connection Error');
      statusBox.className = 'status-box error';
      statusBox.style.display = 'block';
      statusBox.innerHTML = '<b><span class="material-symbols-outlined">error</span> Error:</b> ' + errText;
    }
  }

  function submitFolderUrl() {
    var input = document.getElementById('folderUrlInput').value.trim();
    var statusBox = document.getElementById('statusBox');
    var submitBtn = document.getElementById('submitBtn');
    var ackContainer = document.getElementById('ackContainer');

    if (!input) {
      showToast('Please paste a Google Drive folder URL or use the 1-click Auto-Create button.', 'warning', 8000, 'Input Required');
      statusBox.className = 'status-box error';
      statusBox.style.display = 'block';
      statusBox.innerHTML = '<span class="material-symbols-outlined">warning</span> Please paste your Google Drive folder web link or folder ID.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = 'Validating Folder...';
    statusBox.style.display = 'none';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .validateAndSaveFolderUrl(input);
    } else {
      setTimeout(function() {
        onSuccess({ success: true, folderName: 'Day Planner', folderId: '1N2WRrFmtsAWKgqeaFIj9HtiQ2wupFEk0' });
      }, 500);
    }

    function onSuccess(res) {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Validate & Connect Folder';

      if (res && res.success) {
        var msg = res.message || 'Connected to Google Drive folder: ' + res.folderName;
        showToast(msg, 'success', 10000, 'Folder Connected');
        statusBox.className = 'status-box success';
        statusBox.style.display = 'block';
        statusBox.innerHTML = '<b><span class="material-symbols-outlined">check_circle</span> Success!</b> ' + msg;
        document.getElementById('formContainer').style.display = 'none';
        if (document.getElementById('autoCreateBtn')) {
          document.getElementById('autoCreateBtn').parentElement.style.display = 'none';
        }
        ackContainer.style.display = 'block';
      } else {
        var errText = (res && res.error) || 'Folder not found. Please verify the URL or click "Auto-Create Folder".';
        showToast(errText, 'error', 10000, 'Connection Notice');
        statusBox.className = 'status-box error';
        statusBox.style.display = 'block';
        statusBox.innerHTML = '<b><span class="material-symbols-outlined">error</span> Notice:</b> ' + errText;
      }
    }

    function onFailure(err) {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Validate & Connect Folder';
      var errText = err.message || err.toString();
      showToast(errText, 'error', 10000, 'Error');
      statusBox.className = 'status-box error';
      statusBox.style.display = 'block';
      statusBox.innerHTML = '<b><span class="material-symbols-outlined">error</span> Error:</b> ' + errText;
    }
  }
</script>
