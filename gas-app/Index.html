<!--
/**
 * @file gas-app/Index.html
 * @description Google Apps Script Production runtime entry point for Day Planner SPA.
 *
 * Runtime Environment:
 * 2. gas-app/Index.html (Google Apps Script Production):
 *    • Apps Script web app template deployed to Google Workspace via clasp.
 *    • Google Apps Script does not support local relative file loading or external ES module paths in HtmlService.
 *      Instead, it uses GAS template includes (<?!= include("Styles"); ?> and <?!= include("Script"); ?>)
 *      to bundle gas-app/Styles.html and gas-app/Script.html into a single pure-GAS payload served at /exec.
 *
 * Note: See root index.html for the local development / mock server entry point.
 */
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Day Planner">
  <meta name="theme-color" content="#2d6a5a">
  <title>Day Planner</title>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('dayPlannerTheme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <?!= include('Styles'); ?>
  <!-- Inline Styles Fallback when serving locally -->
  <style>
    /* Includes base styles inline if template includes fail */
  </style>
</head>
<body>
  <!-- Main Binder Application Container -->
  <main class="binder-container" x-data="plannerApp" x-cloak>
    
    <!-- Single Consolidated Top Bar (Brand, Date Controls, View Tabs, & Actions) -->
    <header class="binder-header single-top-bar" aria-label="Day Planner Header">
      
      <!-- Left: Brand & Date Controls -->
      <div class="header-left">
        <h1 class="brand-title-compact" title="Day Planner SPA">
          <span class="material-symbols-outlined icon-22">auto_stories</span>
          <span class="brand-name">Day Planner</span>
        </h1>

        <span class="header-vdivider" role="separator"></span>

        <!-- Context-aware Date Controls -->
        <div class="date-nav-compact">
          <!-- Daily Date Nav -->
          <template x-if="!isMonthlyView && activeView !== 'master-tasks'">
            <div class="date-controls-group">
              <button type="button" class="icon-nav-btn" @click="navigateDay(-1)" title="Previous Day" aria-label="Previous Day">
                <span class="material-symbols-outlined icon-18">chevron_left</span>
              </button>
              <button type="button" class="today-jump-btn" @click="jumpToToday()" title="Jump to Today">Today</button>
              <button type="button" class="icon-nav-btn" @click="navigateDay(1)" title="Next Day" aria-label="Next Day">
                <span class="material-symbols-outlined icon-18">chevron_right</span>
              </button>
              <span class="date-text-display" x-text="new Date(selectedDate + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })"></span>
            </div>
          </template>

          <!-- Monthly Date Nav -->
          <template x-if="isMonthlyView && activeView !== 'future-matrix'">
            <div class="date-controls-group">
              <button type="button" class="icon-nav-btn" @click="navigateMonth(-1)" title="Previous Month" aria-label="Previous Month">
                <span class="material-symbols-outlined icon-18">chevron_left</span>
              </button>
              <div class="month-picker-wrap" @mouseenter="openMonthPicker()" @mouseleave="scheduleMonthPickerClose()">
                <button type="button" class="today-jump-btn month-jump-btn" @click="jumpToCurrentMonth()" @dblclick="toggleMonthPicker()" title="Jump to Current Month (or hover to pick month)" aria-haspopup="true" :aria-expanded="monthPickerOpen">
                  <span>This Month</span>
                  <span class="material-symbols-outlined icon-14 dropdown-arrow" @click.stop="toggleMonthPicker()">arrow_drop_down</span>
                </button>
                <div class="month-picker-dropdown" x-show="monthPickerOpen" @click.outside="monthPickerOpen = false" x-cloak>
                  <div class="month-picker-year-nav">
                    <button type="button" class="icon-nav-btn" @click.stop="changeMonthPickerYear(-1)" aria-label="Previous Year" title="Previous Year">
                      <span class="material-symbols-outlined icon-16">chevron_left</span>
                    </button>
                    <span class="month-picker-year-text" x-text="monthPickerYear"></span>
                    <button type="button" class="icon-nav-btn" @click.stop="changeMonthPickerYear(1)" aria-label="Next Year" title="Next Year">
                      <span class="material-symbols-outlined icon-16">chevron_right</span>
                    </button>
                  </div>
                  <div class="month-picker-grid">
                    <template x-for="(mName, mIdx) in MONTH_NAMES_SHORT" :key="mName">
                      <button type="button" class="month-picker-cell"
                              :class="{ 'is-selected': selectedYear === monthPickerYear && selectedMonth === (mIdx + 1), 'is-current': isCurrentCalendarMonth(monthPickerYear, mIdx + 1) }"
                              @click.stop="selectNavMonth(monthPickerYear, mIdx + 1)"
                              :title="mName + ' ' + monthPickerYear">
                        <span x-text="mName"></span>
                      </button>
                    </template>
                  </div>
                </div>
              </div>
              <button type="button" class="icon-nav-btn" @click="navigateMonth(1)" title="Next Month" aria-label="Next Month">
                <span class="material-symbols-outlined icon-18">chevron_right</span>
              </button>
              <span class="date-text-display" x-text="selectedMonthName + ' ' + selectedYear"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Center: View Navigation Segmented Control -->
      <nav class="view-segmented-control" aria-label="Planner Views">
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'daily' }" @click="setView('daily')" title="Daily 3-Column View">
          <span class="material-symbols-outlined icon-16">calendar_today</span>
          <span>Today</span>
        </button>
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'monthly-calendar' }" @click="setView('monthly-calendar')" title="Monthly Calendar View">
          <span class="material-symbols-outlined icon-16">calendar_month</span>
          <span>Month</span>
        </button>
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'master-tasks' }" @click="setView('master-tasks')" title="Master Task List">
          <span class="material-symbols-outlined icon-16">checklist</span>
          <span>Master Tasks</span>
        </button>
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'monthly-index' }" @click="setView('monthly-index')" title="#index Decision Registry">
          <span class="material-symbols-outlined icon-16">topic</span>
          <span>Index</span>
        </button>
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'future-matrix' }" @click="setView('future-matrix')" title="Future Planning">
          <span class="material-symbols-outlined icon-16">explore</span>
          <span>Future</span>
        </button>
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'about' }" @click="setView('about')" title="About & Specs">
          <span class="material-symbols-outlined icon-16">info</span>
          <span>About</span>
        </button>
      </nav>

      <!-- Right: Global Action Utilities -->
      <div class="header-actions-compact">
        <button type="button" class="search-trigger-compact" @click.stop="toggleSearchModal()" title="Search Across All Items (Ctrl+K)">
          <span class="material-symbols-outlined icon-18">search</span>
          <span class="search-label">Search</span>
          <kbd class="kbd-shortcut-sm">⌘K</kbd>
        </button>
        <button type="button" class="sync-btn-compact" @click="trigger2WaySync()" :disabled="isSyncing" title="Sync with Google Calendar & Tasks">
          <span class="material-symbols-outlined icon-18" :class="{ 'spin': isSyncing }">sync</span>
          <span class="sync-label" x-text="isSyncing ? 'Syncing' : 'Sync'"></span>
        </button>
        <button type="button" class="theme-toggle-compact" @click="toggleTheme()" :aria-label="'Switch to ' + (theme === 'dark' ? 'Light' : 'Dark') + ' Mode'" :title="'Switch to ' + (theme === 'dark' ? 'Light' : 'Dark') + ' Mode'">
          <span class="material-symbols-outlined icon-18" x-text="theme === 'dark' ? 'light_mode' : 'dark_mode'"></span>
        </button>
      </div>

    </header>

    <!-- Centralized Error & Warning Banner -->
    <template x-if="errorMessage">
      <aside class="error-banner" role="alert">
        <div class="error-banner-content">
          <span class="material-symbols-outlined">warning</span>
          <span x-text="errorMessage"></span>
        </div>
        <button type="button" @click="errorMessage = null" class="error-close-btn" aria-label="Close">
          <span class="material-symbols-outlined icon-18">close</span>
        </button>
      </aside>
    </template>

    <!-- Main Workspace Area -->
    <section class="binder-body">

      <!-- View 1: 3-Column Daily Spread -->
      <template x-if="activeView === 'daily'">
        <section class="two-page-spread"
                 aria-label="Daily Planner 3-Column Workspace"
                 :class="{ 'is-resizing': isResizing, 'has-maximized-column': !!maximizedColumn }"
                 :style="{ '--col1-w': colWidths[0] + '%', '--col2-w': colWidths[1] + '%', '--col3-w': colWidths[2] + '%' }">
          
          <!-- Column 1: Daily Task List Panel -->
          <article class="page-panel col-tasks" :class="{ 'is-maximized': maximizedColumn === 'tasks' }">
            <header class="panel-header">
              <h3 class="panel-header-title">
                <span class="material-symbols-outlined">format_list_numbered</span> Tasks
              </h3>
              <div class="tasks-header-actions">
                <button type="button" class="btn-icon-subtle" @click="toggleMaximizeColumn('tasks')" :title="maximizedColumn === 'tasks' ? 'Restore Columns (Esc)' : 'Maximize Tasks'" :aria-label="maximizedColumn === 'tasks' ? 'Restore Columns (Esc)' : 'Maximize Tasks'">
                  <span class="material-symbols-outlined" x-text="maximizedColumn === 'tasks' ? 'close_fullscreen' : 'open_in_full'"></span>
                </button>
              </div>
            </header>

            <!-- Task Quick Add Form -->
            <form @submit.prevent="addDailyTask()" role="group" class="task-quick-add-bar">
              <div class="priority-segmented-group" role="radiogroup" aria-label="Task Priority">
                <button type="button" class="priority-segment-btn" :class="{ 'active a': newTaskPriorityGroup === 'A' }" @click="newTaskPriorityGroup = 'A'" role="radio" :aria-checked="newTaskPriorityGroup === 'A'" aria-label="Priority A" title="A: Top priority (Alt+A or #a)" accesskey="a">A</button>
                <button type="button" class="priority-segment-btn" :class="{ 'active b': newTaskPriorityGroup === 'B' }" @click="newTaskPriorityGroup = 'B'" role="radio" :aria-checked="newTaskPriorityGroup === 'B'" aria-label="Priority B" title="B: Medium priority (Alt+B or #b)" accesskey="b">B</button>
                <button type="button" class="priority-segment-btn" :class="{ 'active c': newTaskPriorityGroup === 'C' }" @click="newTaskPriorityGroup = 'C'" role="radio" :aria-checked="newTaskPriorityGroup === 'C'" aria-label="Priority C" title="C: Normal priority (Alt+C or #c)" accesskey="c">C</button>
              </div>
              <input type="text" x-model="newTaskTitle" @input="handleTaskTitleInput()" placeholder="Add task title (e.g. Call vendor / #a Call vendor)..." class="task-input-field" aria-label="New task description">
              <button type="submit" class="btn-primary btn-add-task-round" aria-label="Add Task" title="Add Task">
                <span class="material-symbols-outlined">add</span>
              </button>
            </form>

            <!-- Task Table Grid -->
            <figure class="table-container">
              <table class="task-table">
                <thead>
                  <tr>
                    <th scope="col" class="th-w-40 th-sortable" @click="setTaskSort('dailyTaskSort', 'priority')">
                      Pri<span class="sort-arrow" x-show="dailyTaskSort.column === 'priority'" x-text="dailyTaskSort.direction === 'asc' ? '▲' : '▼'"></span>
                    </th>
                    <th scope="col" class="th-w-40 th-sortable" @click="setTaskSort('dailyTaskSort', 'status')">
                      Sts<span class="sort-arrow" x-show="dailyTaskSort.column === 'status'" x-text="dailyTaskSort.direction === 'asc' ? '▲' : '▼'"></span>
                    </th>
                    <th scope="col" class="th-sortable" @click="setTaskSort('dailyTaskSort', 'title')">
                      Task Description<span class="sort-arrow" x-show="dailyTaskSort.column === 'title'" x-text="dailyTaskSort.direction === 'asc' ? '▲' : '▼'"></span>
                    </th>
                    <th scope="col" class="th-w-80 th-sortable" @click="setTaskSort('dailyTaskSort', 'category')">
                      Category<span class="sort-arrow" x-show="dailyTaskSort.column === 'category'" x-text="dailyTaskSort.direction === 'asc' ? '▲' : '▼'"></span>
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="task in sortedTasks(dailyTasks, dailyTaskSort)" :key="task.id">
                    <tr>
                      <td>
                        <span class="priority-badge" :class="parseTask(task.title).priorityGroup || 'A'" x-text="parseTask(task.title).priorityCode || 'A1'"></span>
                      </td>
                      <td>
                        <div class="status-menu-wrap" @mouseenter="openStatusMenu(task.id, $event)" @mouseleave="scheduleStatusMenuClose(task.id)">
                          <button type="button" class="status-btn" @click="toggleStatusMenu(task.id, $event)" x-text="task.status || '•'"
                                  aria-haspopup="menu" :aria-expanded="openStatusMenuTaskId === task.id"
                                  :aria-label="'Task status: ' + (task.status || 'Open') + '. Click to choose a status.'"></button>
                          <div class="status-menu" :class="{ 'dropup': statusMenuDropUp, 'dropdown-down': !statusMenuDropUp }" role="menu" x-show="openStatusMenuTaskId === task.id" @click.outside="openStatusMenuTaskId = null" x-cloak>
                            <template x-for="opt in statusOptions" :key="opt.value">
                              <button type="button" class="status-menu-item" role="menuitem"
                                      :class="{ 'is-active': (task.status || '•') === opt.value }"
                                      @click="selectTaskStatus(task, opt.value)"
                                      :aria-label="'Set status: ' + opt.label">
                                <span class="status-menu-item-glyph" x-text="opt.value"></span>
                                <span x-text="opt.label"></span>
                              </button>
                            </template>
                            <div class="status-menu-separator" role="separator"></div>
                            <button type="button" class="status-menu-item status-menu-item-delete" role="menuitem"
                                    @click="deleteDailyTask(task)"
                                    aria-label="Delete task">
                              <span class="status-menu-item-glyph status-menu-item-glyph-delete">
                                <span class="material-symbols-outlined icon-14">delete</span>
                              </span>
                              <span>Delete</span>
                            </button>
                          </div>
                        </div>
                      </td>
                      <td class="task-title-cell" :class="{ 'task-canceled': task.status === 'X', 'task-done': task.status === '✓' || task.status === 'Ⓓ' || task.status === 'D/✓' }">
                        <button type="button" class="star-toggle" :class="{ 'is-starred': task.starred }" @click.stop="toggleTaskStar(task)"
                                :aria-label="task.starred ? 'Unstar task' : 'Star task'" x-text="task.starred ? '★' : '☆'"></button>
                        <span x-text="parseTask(task.title).cleanTitle"></span>
                        <span class="notes-indicator-wrap" x-show="hasNotes(task)" @mouseenter="openNotesPopover(task.id, $event)" @mouseleave="scheduleNotesPopoverClose(task.id)">
                          <button type="button" class="notes-indicator" @click.stop="toggleNotesPopover(task.id, $event)"
                                  aria-label="View notes" aria-haspopup="true" :aria-expanded="openNotesPopoverTaskId === task.id">
                            <span class="material-symbols-outlined icon-14">sticky_note_2</span>
                          </button>
                          <div class="notes-popover" :class="{ 'dropup': notesPopoverDropUp, 'dropdown-down': !notesPopoverDropUp }" role="tooltip" x-show="openNotesPopoverTaskId === task.id" x-cloak x-text="task.notes"></div>
                        </span>
                      </td>
                      <td class="td-category" x-text="task.category || 'Work'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </figure>

          </article>

          <!-- Column Resizer 1 (Between Tasks & Appointments) -->
          <div class="column-resizer"
               :class="{ 'is-resizing': activeResizerIndex === 1 }"
               @mousedown="initResize(1, $event)"
               @touchstart="initResize(1, $event)"
               @dblclick="resetColumnWidths()"
               role="separator"
               aria-orientation="vertical"
               aria-label="Resize Tasks and Appointments columns"
               title="Drag left or right to resize columns (Double-click to reset)">
            <div class="resizer-handle"></div>
          </div>

          <!-- Column 2: Appointment Panel -->
          <article class="page-panel col-appointments" :class="{ 'is-maximized': maximizedColumn === 'appointments' }">
            <header class="panel-header appointments-header">
              <h3 class="panel-header-title">
                <span class="material-symbols-outlined">schedule</span> Appointments
              </h3>
              <div class="appointments-header-actions">
                <button type="button" class="btn-icon-subtle" @click="toggleMaximizeColumn('appointments')" :title="maximizedColumn === 'appointments' ? 'Restore Columns (Esc)' : 'Maximize Appointments'" :aria-label="maximizedColumn === 'appointments' ? 'Restore Columns (Esc)' : 'Maximize Appointments'">
                  <span class="material-symbols-outlined" x-text="maximizedColumn === 'appointments' ? 'close_fullscreen' : 'open_in_full'"></span>
                </button>
                <button type="button" class="btn-primary btn-add-task-round" @click.stop="openCreateEventModal()" title="Add New Appointment" aria-label="Add New Appointment">
                  <span class="material-symbols-outlined">add</span>
                </button>
              </div>
            </header>

            <!-- Hourly Schedule Grid -->
            <section class="schedule-list" aria-label="Hourly Schedule">
              <template x-for="slot in scheduleGrid" :key="slot.timeKey">
                <div class="schedule-row" :class="{ 'half-hour': slot.timeKey.endsWith(':30') }">
                  <time class="schedule-time" x-text="slot.displayTime"></time>
                  <div class="schedule-content">
                    <template x-for="(evt, evtIdx) in slot.events" :key="evt.id || ('evt_' + evtIdx)">
                      <button type="button" class="event-pill" @click.stop="openEventModal(evt)" title="View appointment details">
                        <span class="material-symbols-outlined icon-14">event</span>
                        <span class="event-pill-text" x-text="evt.title"></span>
                      </button>
                    </template>
                  </div>
                </div>
              </template>
            </section>
          </article>

          <!-- Column Resizer 2 (Between Appointments & Notes) -->
          <div class="column-resizer"
               :class="{ 'is-resizing': activeResizerIndex === 2 }"
               @mousedown="initResize(2, $event)"
               @touchstart="initResize(2, $event)"
               @dblclick="resetColumnWidths()"
               role="separator"
               aria-orientation="vertical"
               aria-label="Resize Appointments and Notes columns"
               title="Drag left or right to resize columns (Double-click to reset)">
            <div class="resizer-handle"></div>
          </div>

          <!-- Column 3: Daily Notes Panel (Franklin Lined Paper & Modular Topic Cards) -->
          <article class="page-panel notes-column-panel col-notes" :class="{ 'is-maximized': maximizedColumn === 'notes' }">
            <header class="panel-header notes-header">
              <h3 class="panel-header-title">
                <span class="material-symbols-outlined">description</span> Notes
              </h3>

              <div class="notes-header-actions">
                <button type="button" class="btn-icon-subtle" @click="toggleMaximizeColumn('notes')" :title="maximizedColumn === 'notes' ? 'Restore Columns (Esc)' : 'Maximize Notes'" :aria-label="maximizedColumn === 'notes' ? 'Restore Columns (Esc)' : 'Maximize Notes'">
                  <span class="material-symbols-outlined" x-text="maximizedColumn === 'notes' ? 'close_fullscreen' : 'open_in_full'"></span>
                </button>
                <!-- Dropdown Filter Menu Toggle -->
                <div class="dropdown-container">
                  <button type="button" class="btn-icon-subtle" @click="noteFilterMenuOpen = !noteFilterMenuOpen" title="Filter & Search Notes" aria-label="Filter & Search Notes">
                    <span class="material-symbols-outlined">tune</span>
                  </button>
                  
                  <div class="dropdown-menu notes-filter-menu" x-show="noteFilterMenuOpen" @click.outside="noteFilterMenuOpen = false" x-cloak>
                    <div class="dropdown-header">Filter & Search Cards</div>
                    <div class="dropdown-item-group">
                      <input type="search" x-model="noteCardSearchQuery" placeholder="Search card heading, notes..." class="dropdown-search-input">
                    </div>
                    <div class="dropdown-item-group">
                      <label class="dropdown-label">Category Filter:</label>
                      <select x-model="noteCardCategoryFilter" class="dropdown-select">
                        <option value="ALL">All Categories</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="Meeting">Meeting</option>
                        <option value="Decision">Decision</option>
                        <option value="Project">Project</option>
                      </select>
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item-group">
                      <label class="dropdown-label">View Mode:</label>
                      <button type="button" class="btn-toggle-mode" @click="noteViewMode = noteViewMode === 'cards' ? 'doc' : 'cards'">
                        <span x-text="noteViewMode === 'cards' ? 'Switch to Continuous Lined Doc (Future Preview)' : 'Switch to Topic Cards Mode'"></span>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Add Topic Card Button (Round button matching Tasks) -->
                <button type="button" class="btn-primary btn-add-task-round" @click="addNoteCard()" title="Add Topic Card" aria-label="Add Topic Card">
                  <span class="material-symbols-outlined">add</span>
                </button>
              </div>
            </header>

            <!-- Mode 1: Modular Topic Cards (Option 1) -->
            <div class="note-cards-container" x-show="noteViewMode === 'cards'">
              
              <!-- Filter Active Indicator -->
              <template x-if="noteCardSearchQuery || noteCardCategoryFilter !== 'ALL'">
                <div class="filter-indicator-bar">
                  <span>Filtered: <strong x-text="noteCardCategoryFilter !== 'ALL' ? noteCardCategoryFilter : ''"></strong> <span x-text="noteCardSearchQuery ? ('&quot;' + noteCardSearchQuery + '&quot;') : ''"></span></span>
                  <button type="button" class="btn-link-sm" @click="noteCardSearchQuery = ''; noteCardCategoryFilter = 'ALL';">Clear</button>
                </div>
              </template>

              <!-- Shared autocomplete source for the Topic field below -->
              <datalist id="index-topics-datalist">
                <template x-for="t in indexTopicOptions()" :key="t">
                  <option :value="t"></option>
                </template>
              </datalist>

              <!-- Cards List -->
              <template x-for="card in filteredNoteCards" :key="card.id">
                <article class="note-card-item" :id="'note-card-' + card.id" :data-card-id="card.id" :class="{ 'collapsed': card.collapsed, 'note-color-teal': cardNoteColor(card) === 'teal', 'note-color-red': cardNoteColor(card) === 'red', 'note-color-green': cardNoteColor(card) === 'green', 'note-color-blue': cardNoteColor(card) === 'blue' }" @click.away="clearLineSelection(card)" @keydown.escape.window="clearLineSelection(card)">
                  <!-- Card Header -->
                  <header class="note-card-header">
                    <button type="button" class="card-twistie-btn" @click="toggleCardExpand(card)" :title="card.collapsed ? 'Expand Topic' : 'Collapse Topic'">
                      <span class="material-symbols-outlined icon-18" x-text="card.collapsed ? 'arrow_right' : 'arrow_drop_down'"></span>
                    </button>

                    <input type="text" x-model="card.indexTopic" @input="syncCardsToDailyNote()" list="index-topics-datalist" placeholder="Local-only" class="card-topic-input" :style="'flex: 0 0 ' + topicColWidth + 'px; width: ' + topicColWidth + 'px'" aria-label="Monthly Index Topic (optional)" title="Topic: set this to add the card to the Monthly Index. Leave blank to keep it private to today.">

                    <div class="card-header-resizer"
                         :class="{ 'is-resizing': isHeaderResizing }"
                         @mousedown="initHeaderResize($event)"
                         @touchstart="initHeaderResize($event)"
                         @dblclick="resetHeaderSplit()"
                         role="separator"
                         aria-orientation="vertical"
                         aria-label="Resize Topic and Summary fields"
                         title="Drag to resize Topic/Summary (double-click to reset)">
                      <div class="resizer-handle"></div>
                    </div>

                    <textarea rows="1" maxlength="60" x-model="card.heading" :disabled="!card.indexTopic" x-init="$nextTick(() => autoGrowNoteHeading($el))" @input="syncCardsToDailyNote(); autoGrowNoteHeading($event.target)" :placeholder="card.indexTopic ? 'Summary for the index...' : 'Set a Topic to index this card'" class="card-heading-input" aria-label="Card Summary" title="Summary: the one-line description shown in the Monthly Index (60 char max)."></textarea>

                    </span>

                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'clear')" title="Clear All Formatting" aria-label="Clear All Formatting"><span class="material-symbols-outlined icon-16">format_clear</span></button>
                      <span class="toolbar-divider"></span>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'bold')" title="Bold (Ctrl+B)"><span class="material-symbols-outlined icon-16">format_bold</span></button>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'italic')" title="Italic (Ctrl+I)"><span class="material-symbols-outlined icon-16">format_italic</span></button>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'underline')" title="Underline (Ctrl+U)"><span class="material-symbols-outlined icon-16">format_underlined</span></button>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'strike')" title="Strikethrough"><span class="material-symbols-outlined icon-16">strikethrough_s</span></button>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'link')" title="Insert Link (Ctrl+K)" aria-label="Insert Link"><span class="material-symbols-outlined icon-16">link</span></button>
                      <span class="toolbar-divider"></span>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'bullet')" title="Bullet List"><span class="material-symbols-outlined icon-16">format_list_bulleted</span></button>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'ordered')" title="Numbered List"><span class="material-symbols-outlined icon-16">format_list_numbered</span></button>
                      <span class="toolbar-divider"></span>
                      <button type="button" class="format-btn color-swatch-btn color-swatch-default" @mousedown.prevent @click="applyCardFormat(card, 'color-default')" title="Remove Text Color Only"><span class="material-symbols-outlined icon-16">format_color_reset</span></button>
                      <button type="button" class="format-btn color-swatch-btn color-swatch-teal" :class="{ active: cardNoteColor(card) === 'teal' }" @mousedown.prevent @click="applyCardFormat(card, 'color-teal')" title="Color: Teal" aria-label="Color: Teal"></button>
                      <button type="button" class="format-btn color-swatch-btn color-swatch-red" :class="{ active: cardNoteColor(card) === 'red' }" @mousedown.prevent @click="applyCardFormat(card, 'color-red')" title="Color: Red" aria-label="Color: Red"></button>
                      <button type="button" class="format-btn color-swatch-btn color-swatch-green" :class="{ active: cardNoteColor(card) === 'green' }" @mousedown.prevent @click="applyCardFormat(card, 'color-green')" title="Color: Green" aria-label="Color: Green"></button>
                      <button type="button" class="format-btn color-swatch-btn color-swatch-blue" :class="{ active: cardNoteColor(card) === 'blue' }" @mousedown.prevent @click="applyCardFormat(card, 'color-blue')" title="Color: Blue" aria-label="Color: Blue"></button>
                      <span class="toolbar-divider"></span>
                      <span class="card-heading-help" tabindex="0" role="note" aria-label="Typing shortcuts for formatting">
                        <span class="material-symbols-outlined icon-16">keyboard</span>
                        <span class="card-heading-help-tip">Start a line with <code>- </code> for bullets, <code>1. </code> for numbers. Inline: <code>**bold**</code>, <code>*italic*</code>, <code>__underline__</code>, <code>~~strike~~</code>.</span>
                      </span>
                    </div>

                    <!-- Note Card Content: per-line live preview -->
                    <div class="note-card-lines">
                      <template x-for="(line, idx) in cardLines(card)" :key="idx">
                        <div class="note-card-line-row" :class="{ 'note-line-selected': isLineInSelectedRange(card, idx) }">
                          <div class="note-render-line-item" x-show="card._activeLineIndex !== idx" @click="$event.shiftKey ? extendLineSelection(card, idx) : startEditingLine(card, idx)" x-html="renderCardLine(line, cardLines(card).length === 1 && !line)" aria-label="Note line, click to edit, shift+click to extend selection"></div>
                          <input type="text" x-show="card._activeLineIndex === idx" :id="'card-line-' + card.id + '-' + idx" :value="line" @input="updateCardLine(card, idx, $event.target.value)" @keydown="handleLineKeydown($event, card, idx)" @paste="handleLinePaste($event, card, idx)" @blur="stopEditingLine(card, idx)" :placeholder="cardLines(card).length === 1 && idx === 0 ? 'Type notes for this topic (e.g. - #index [Topic] key decisions...)' : ''" class="note-card-line-input" aria-label="Note line">
                        </div>
                      </template>
                    </div>
                  </div>
                </article>
              </template>

              <template x-if="filteredNoteCards.length === 0">

                  <p>No note cards found. Click <strong>+ Add Card</strong> above to create a new topic section.</p>

              </div>
              <textarea x-model="dailyNote" @input="syncDailyNoteToCards()" placeholder="# Daily Log\n\n### Topic 1\nNotes..." class="continuous-doc-textarea" aria-label="Continuous Daily Notes"></textarea>
            </div>

          </article>

        </section>
      </template>

      <!-- View 2: Full-Screen Monthly Overview Calendar -->
      <template x-if="activeView === 'monthly-calendar'">

              <span class="material-symbols-outlined">calendar_month</span>

            </h2>
          </header>
          <div class="monthly-weekday-header-row" aria-hidden="true">
            <div class="monthly-weekday-label">Sun</div>
            <div class="monthly-weekday-label">Mon</div>
            <div class="monthly-weekday-label">Tue</div>
            <div class="monthly-weekday-label">Wed</div>
            <div class="monthly-weekday-label">Thu</div>
            <div class="monthly-weekday-label">Fri</div>
            <div class="monthly-weekday-label">Sat</div>
          </div>
          <section class="monthly-grid" :style="{ gridTemplateRows: 'repeat(' + (monthlyGrid.length ? monthlyGrid.length / 7 : 5) + ', minmax(0, 1fr))' }" aria-label="Calendar Grid Matrix">

                  </template>
                </div>
              </article>
            </template>
          </section>
        </section>
      </template>

      <!-- View 3: Master Tasks / Undated Task Backlog Page -->
      <template x-if="activeView === 'master-tasks'">
        <section class="view-container" aria-label="Master Tasks">
          <header class="master-tasks-header">
            <h2 class="view-title">
              <span class="material-symbols-outlined">checklist</span>
              Master Tasks
            </h2>
            <div class="task-filter-stamp-group" role="group" aria-label="Filter Master Tasks by Status">
              <span class="task-filter-label">Filter:</span>
              <button type="button" class="task-filter-stamp" :class="{ 'is-active': isAllMasterTaskStatusSelected() }"
                      @click="toggleAllMasterTaskStatusFilters()"
                      :aria-pressed="isAllMasterTaskStatusSelected()"
                      title="Show all statuses or toggle to Open only">
                All
              </button>
              <template x-for="opt in statusOptions" :key="opt.value">
                <button type="button" class="task-filter-stamp glyph-stamp"
                        :class="{ 'is-active': isMasterTaskStatusFilterActive(opt.value) }"
                        @click="toggleMasterTaskStatusFilter(opt.value)"
                        :aria-pressed="isMasterTaskStatusFilterActive(opt.value)"
                        :title="opt.value + ' ' + opt.label + ' (Click to toggle)'">
                  <span class="filter-stamp-glyph" x-text="opt.value"></span>
                  <span class="filter-stamp-text" x-text="opt.label"></span>
                </button>
              </template>
            </div>
          </header>
          <form @submit.prevent="addMasterTask()" role="group" class="task-quick-add-bar master-task-add-bar">
            <div class="priority-segmented-group" role="radiogroup" aria-label="Master Task Priority">
              <button type="button" class="priority-segment-btn" :class="{ 'active a': newMasterTaskPriorityGroup === 'A' }" @click="newMasterTaskPriorityGroup = 'A'" role="radio" :aria-checked="newMasterTaskPriorityGroup === 'A'" aria-label="Priority A" title="A: Top priority (Alt+A or #a)" accesskey="a">A</button>
              <button type="button" class="priority-segment-btn" :class="{ 'active b': newMasterTaskPriorityGroup === 'B' }" @click="newMasterTaskPriorityGroup = 'B'" role="radio" :aria-checked="newMasterTaskPriorityGroup === 'B'" aria-label="Priority B" title="B: Medium priority (Alt+B or #b)" accesskey="b">B</button>
              <button type="button" class="priority-segment-btn" :class="{ 'active c': newMasterTaskPriorityGroup === 'C' }" @click="newMasterTaskPriorityGroup = 'C'" role="radio" :aria-checked="newMasterTaskPriorityGroup === 'C'" aria-label="Priority C" title="C: Normal priority (Alt+C or #c)" accesskey="c">C</button>
            </div>
            <input type="text" x-model="newMasterTaskTitle" @input="handleMasterTaskTitleInput()" placeholder="Add master task title (e.g. Call vendor / #a Call vendor)..." class="task-input-field master-task-title-input" aria-label="New master task description">
            <input type="text" x-model="newMasterTaskCategory" placeholder="Category" class="task-input-field master-task-category-input" aria-label="New master task category">
            <button type="submit" class="btn-primary btn-add-task-round" :disabled="addingMasterTask" aria-label="Add master task" title="Add master task">
              <span class="material-symbols-outlined">add</span>
            </button>
          </form>
          <figure class="table-container">
            <table class="task-table table-card master-tasks-table">
              <thead>
                <tr class="table-header-row">
                  <th scope="col" class="th-w-48 th-sortable" @click="setTaskSort('masterTaskSort', 'priority')">
                    Pri<span class="sort-arrow" x-show="masterTaskSort.column === 'priority'" x-text="masterTaskSort.direction === 'asc' ? '▲' : '▼'"></span>
                  </th>
                  <th scope="col" class="th-w-48 th-sortable" @click="setTaskSort('masterTaskSort', 'status')">
                    Sts<span class="sort-arrow" x-show="masterTaskSort.column === 'status'" x-text="masterTaskSort.direction === 'asc' ? '▲' : '▼'"></span>
                  </th>
                  <th scope="col" class="th-sortable" @click="setTaskSort('masterTaskSort', 'title')">
                    Task Description<span class="sort-arrow" x-show="masterTaskSort.column === 'title'" x-text="masterTaskSort.direction === 'asc' ? '▲' : '▼'"></span>
                  </th>
                  <th scope="col" class="th-w-100 th-sortable" @click="setTaskSort('masterTaskSort', 'category')">
                    Category<span class="sort-arrow" x-show="masterTaskSort.column === 'category'" x-text="masterTaskSort.direction === 'asc' ? '▲' : '▼'"></span>
                  </th>
                  <th scope="col" class="th-w-260">Action</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="mTask in sortedTasks(filteredMasterTasks, masterTaskSort)" :key="mTask.id">
                  <tr>
                    <td>
                      <span class="priority-badge" :class="parseTask(mTask.title).priorityGroup || 'A'" x-text="parseTask(mTask.title).priorityCode || 'A1'"></span>
                    </td>
                    <td>
                      <div class="status-menu-wrap" @mouseenter="openStatusMenu(mTask.id, $event)" @mouseleave="scheduleStatusMenuClose(mTask.id)">
                        <button type="button" class="status-btn" @click="toggleStatusMenu(mTask.id, $event)" x-text="mTask.status || '•'"
                                aria-haspopup="menu" :aria-expanded="openStatusMenuTaskId === mTask.id"
                                :aria-label="'Master task status: ' + (mTask.status || 'Open') + '. Click to choose a status.'"></button>
                        <div class="status-menu" :class="{ 'dropup': statusMenuDropUp, 'dropdown-down': !statusMenuDropUp }" role="menu" x-show="openStatusMenuTaskId === mTask.id" @click.outside="openStatusMenuTaskId = null" x-cloak>
                          <template x-for="opt in statusOptions" :key="opt.value">
                            <button type="button" class="status-menu-item" role="menuitem"
                                    :class="{ 'is-active': (mTask.status || '•') === opt.value }"
                                    @click="selectTaskStatus(mTask, opt.value)"
                                    :aria-label="'Set status: ' + opt.label">
                              <span class="status-menu-item-glyph" x-text="opt.value"></span>
                              <span x-text="opt.label"></span>
                            </button>
                          </template>
                          <div class="status-menu-separator" role="separator"></div>
                          <button type="button" class="status-menu-item status-menu-item-delete" role="menuitem"
                                  @click="deleteMasterTask(mTask)"
                                  aria-label="Delete master task">
                            <span class="status-menu-item-glyph status-menu-item-glyph-delete">
                              <span class="material-symbols-outlined icon-14">delete</span>
                            </span>
                            <span>Delete</span>
                          </button>
                        </div>
                      </div>
                    </td>
                    <td class="task-title-cell" :class="{ 'task-canceled': mTask.status === 'X', 'task-done': mTask.status === '✓' || mTask.status === 'D/✓' }">
                      <button type="button" class="star-toggle" :class="{ 'is-starred': mTask.starred }" @click.stop="toggleTaskStar(mTask)"
                              :aria-label="mTask.starred ? 'Unstar task' : 'Star task'" x-text="mTask.starred ? '★' : '☆'"></button>
                      <span x-text="parseTask(mTask.title).cleanTitle"></span>
                      <span class="notes-indicator-wrap" x-show="hasNotes(mTask)" @mouseenter="openNotesPopover(mTask.id, $event)" @mouseleave="scheduleNotesPopoverClose(mTask.id)">
                        <button type="button" class="notes-indicator" @click.stop="toggleNotesPopover(mTask.id, $event)"
                                aria-label="View notes" aria-haspopup="true" :aria-expanded="openNotesPopoverTaskId === mTask.id">
                          <span class="material-symbols-outlined icon-14">sticky_note_2</span>
                        </button>
                        <div class="notes-popover" :class="{ 'dropup': notesPopoverDropUp, 'dropdown-down': !notesPopoverDropUp }" role="tooltip" x-show="openNotesPopoverTaskId === mTask.id" x-cloak x-text="mTask.notes"></div>
                      </span>
                      <span class="master-task-moved-note" x-show="mTask.movedTo" x-text="formatMovedDate(mTask.movedTo)"></span>
                    </td>
                    <td class="td-category" x-text="mTask.category || 'General'"></td>
                    <td class="master-task-action-cell">
                      <span class="master-task-action-wrap">
                        <input type="date" x-model="mTask._moveDate" class="master-task-date-input" :aria-label="'Move date for ' + mTask.title" :disabled="mTask._moving || !!mTask.movedTo" x-show="!mTask.movedTo">
                        <button type="button" class="btn-move-to" @click="moveMasterTaskToDate(mTask)" :disabled="mTask._moving" x-show="!mTask.movedTo" title="Move task to scheduled date">
                          <span class="material-symbols-outlined icon-18" :class="{ spin: mTask._moving }" x-show="mTask._moving">progress_activity</span>
                          <span x-text="mTask._moving ? 'Moving' : 'Move'"></span>
                        </button>
                        <button type="button" class="btn-delete-row" @click="deleteMasterTask(mTask)" aria-label="Delete master task" title="Delete master task">
                          <span class="material-symbols-outlined icon-16">delete</span>
                        </button>
                      </span>
                    </td>
                  </tr>
                </template>
                <tr x-show="filteredMasterTasks.length === 0">
                  <td colspan="5" class="empty-tasks-cell">
                    <span x-show="masterTasks.length === 0">No master tasks recorded for this month. Add one above!</span>
                    <span x-show="masterTasks.length > 0">No master tasks matching selected status filter. <button type="button" class="btn-link-reset-filter" @click="toggleAllMasterTaskStatusFilters()">Show all tasks</button></span>
                  </td>
                </tr>
              </tbody>
            </table>
          </figure>
        </section>
      </template>

      <!-- View 4: Monthly Index Page -->

          <figure class="table-container">

                          <span>Move</span>
                        </button>
                        <button type="button" class="icon-nav-btn" @click="pushFutureItemForward(String(idx + 1).padStart(2, '0'), item)" title="Push to next month" aria-label="Push to next month">
                          <span class="material-symbols-outlined icon-16">redo</span>
                        </button>
                      </div>
                    </li>
                  </template>
                </ul>
              </article>
            </template>
          </section>
        </section>
      </template>

    <!-- Event Detail Modal -->
    <dialog class="modal-backdrop" :open="eventModalOpen" x-show="eventModalOpen" x-cloak aria-labelledby="eventModalTitle" @click.self="closeEventModal()">
      <article class="modal-card modal-card-event" @click.away="closeEventModal()">
        <header class="modal-header-spaced">
          <h3 id="eventModalTitle" class="modal-title" x-text="selectedEvent?.title || 'Event Details'"></h3>
          <button type="button" class="btn-icon-subtle" @click="closeEventModal()" title="Close">
            <span class="material-symbols-outlined icon-18">close</span>
          </button>
        </header>
        <div class="modal-body-details">

            <span class="material-symbols-outlined icon-18">schedule</span> <span x-text="formatEventTime(selectedEvent)"></span>
          </p>
          <p class="modal-detail-row">
            <span class="material-symbols-outlined icon-18">location_on</span> <span x-text="selectedEvent?.location ? (selectedEvent.location.includes('meet.google.com') ? 'Google Meet' : selectedEvent.location) : 'No location set'"></span>

          <template x-if="selectedEvent?.meetLink">

              <span class="material-symbols-outlined">videocam</span> Join Google Meet

          <a :href="selectedEvent?.gCalLink" target="_blank" rel="noopener noreferrer" class="btn-primary" role="button">

        </header>

        <form @submit.prevent="saveNewEvent()" class="create-event-form">

                <option value="11:30">11:30 AM</option>

                <option value="13:00">01:00 PM</option>

          <div class="form-group">

            <input type="text" id="evtLocationInput" x-model="newEventData.location" placeholder="e.g. Conference Room A / Google Meet" class="form-input">

          <div class="form-group">
            <label for="evtDescInput" class="form-label">Notes / Agenda</label>
            <textarea id="evtDescInput" x-model="newEventData.description" placeholder="Appointment agenda..." class="form-textarea" rows="2"></textarea>

            <button type="button" class="btn-secondary btn-gcal-popup" @click="launchNativeGCalCreate()" title="Open pre-filled Google Calendar event creator window">

            </button>
            <div class="action-right-group">
              <button type="button" class="btn-link" @click="closeCreateEventModal()">Cancel</button>
              <button type="submit" class="btn-primary">

        </form>
      </article>

    <!-- Universal Search Modal -->
    <dialog class="modal-backdrop" :open="searchModalOpen" x-show="searchModalOpen" x-cloak aria-labelledby="searchModalTitle" @click.self="closeSearchModal()" @keydown.escape.window="if (searchModalOpen) closeSearchModal()">
      <article class="modal-card modal-card-wide" @click.away="closeSearchModal()">
        <header>
          <h3 id="searchModalTitle" class="modal-title-with-icon">
            <span class="material-symbols-outlined">search</span> Universal Search (Ctrl + K)
          </h3>
        </header>
        <section>
          <input
            type="search"
            x-ref="searchInput"
            autofocus
            x-model="searchQuery"
            @input="runSearch()"
            @keydown.down.prevent="navigateSearchResults(1)"
            @keydown.up.prevent="navigateSearchResults(-1)"
            @keydown.enter.prevent="selectActiveSearchResult()"
            @keydown.escape.prevent.stop="closeSearchModal()"
            placeholder="Type to search calendar, tasks, notes, index..."
            class="search-input-field"
            aria-label="Universal Search Input"
          >
          
          <div class="search-results-container" role="listbox">
            <template x-if="searchResults.totalMatches === 0 && searchQuery">
              <p class="search-no-results">No matching entries found.</p>
            </template>

            <template x-for="(item, idx) in getFlattenedSearchResults()" :key="item.type + '-' + (item.title || item.snippet) + '-' + idx">
              <article
                class="search-result-item"
                :class="{
                  'result-calendar': item.type === 'calendar',
                  'result-task': item.type === 'task',
                  'result-note': item.type === 'note',
                  'result-index': item.type === 'index',
                  'selected': selectedSearchIndex === idx
                }"
                role="option"
                :aria-selected="selectedSearchIndex === idx"
                @mouseenter="selectedSearchIndex = idx"
                @click="selectSearchResult(item)"
              >
                <div class="search-result-header">
                  <span class="search-result-badge" x-text="item.type.toUpperCase()"></span>
                  <strong class="search-result-title" x-text="item.title"></strong>
                  <span class="search-result-date" x-show="item.date" x-text="item.date"></span>
                </div>
                <div class="search-result-snippet" x-show="item.snippet" x-text="item.snippet"></div>
              </article>
            </template>
          </div>
        </section>
        <footer class="modal-actions">
          <button type="button" class="btn-secondary" @click="closeSearchModal()">Close</button>
        </footer>
      </article>
    </dialog>

  </main>
