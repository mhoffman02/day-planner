<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day Planner</title>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('dayPlannerTheme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <?!= include('Styles'); ?>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body>
  <!-- Main Binder Application Container -->
  <main class="binder-container" x-data="plannerApp" x-cloak>
    
    <!-- Toast Notification Container (everything except pending task-forwards, which anchor
         next to the task row they belong to instead -- see .toast-item-anchored below) -->
    <div class="toast-container" aria-live="assertive" role="region" aria-label="Notifications">
      <template x-for="toast in toasts.filter(t => t.kind !== 'task-forward')" :key="toast.id">
        <div class="toast-item" :class="'toast-' + toast.type" role="alert">
          <div class="toast-body">
            <span class="material-symbols-outlined toast-icon" x-text="toast.type === 'error' ? 'error' : toast.type === 'warning' ? 'warning' : toast.type === 'success' ? 'check_circle' : 'info'"></span>
            <div class="toast-content">
              <div class="toast-title" x-text="toast.title"></div>
              <div class="toast-message" x-text="toast.message"></div>
            </div>
            <button type="button" class="toast-dismiss-btn" @click="dismissToast(toast.id)" aria-label="Dismiss notification">✕</button>
          </div>
          <div class="toast-progress-bar">
            <div class="toast-progress-fill" :style="`animation-duration: ${toast.duration}ms;`"></div>
          </div>
        </div>
      </template>
    </div>

    <!-- Pending task-forward popovers: anchored right next to the status button that was
         clicked (see startPendingForward/_computeForwardAnchor in Script.html) so picking an
         alternate date doesn't require a trip to the corner of the screen. Falls back to the
         same top-right spot as regular toasts if there was no click to anchor to. -->
    <template x-for="toast in toasts.filter(t => t.kind === 'task-forward')" :key="toast.id">
      <div class="toast-item toast-item-anchored" :class="'toast-' + toast.type"
           :style="toast.anchor ? `top: ${toast.anchor.top}px; left: ${toast.anchor.left}px;` : 'top: 20px; right: 20px;'"
           role="alert">
        <div class="toast-body">
          <span class="material-symbols-outlined toast-icon" x-text="'info'"></span>
          <div class="toast-content">
            <div class="toast-title" x-text="toast.title"></div>
            <div class="toast-message" x-text="toast.message"></div>
            <div class="toast-forward-actions">
              <button type="button" class="toast-action-btn" @click="pickForwardDate(toast, addDaysToDateStr(toast.sourceDateStr, 2))">+2 days</button>
              <button type="button" class="toast-action-btn" @click="pickForwardDate(toast, addDaysToDateStr(toast.sourceDateStr, 7))">+1 week</button>
              <input type="date" class="toast-date-input" :value="toast.targetDate" @change="pickForwardDate(toast, $event.target.value)" aria-label="Pick a different forward date">
            </div>
          </div>
          <button type="button" class="toast-dismiss-btn" @click="dismissToast(toast.id)" aria-label="Cancel forwarding">✕</button>
        </div>
        <div class="toast-progress-bar">
          <div class="toast-progress-fill" :style="`animation-duration: ${toast.duration}ms;`"></div>
        </div>
      </div>
    </template>

    <!-- Single Consolidated Top Bar (Brand, Date Controls, View Tabs, & Actions) -->
    <header class="binder-header single-top-bar" aria-label="Day Planner Header">
      
      <!-- Left: Brand & Date Controls -->
      <div class="header-left">
        <h1 class="brand-title-compact" title="Day Planner SPA">
          <span class="material-symbols-outlined icon-22">auto_stories</span>
          <span class="brand-name">Day Planner</span>
        </h1>

        <span class="header-vdivider" role="separator"></span>

        <!-- Context-aware Date Controls -->
        <div class="date-nav-compact">
          <!-- Daily Date Nav -->
          <template x-if="!isMonthlyView">
            <div class="date-controls-group">
              <button type="button" class="icon-nav-btn" @click="navigateDay(-1)" title="Previous Day" aria-label="Previous Day">
                <span class="material-symbols-outlined icon-18">chevron_left</span>
              </button>
              <button type="button" class="today-jump-btn" @click="jumpToToday()" title="Jump to Today">Today</button>
              <button type="button" class="icon-nav-btn" @click="navigateDay(1)" title="Next Day" aria-label="Next Day">
                <span class="material-symbols-outlined icon-18">chevron_right</span>
              </button>
              <span class="date-text-display" x-text="new Date(selectedDate + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })"></span>
            </div>
          </template>

          <!-- Monthly Date Nav -->
          <template x-if="isMonthlyView">
            <div class="date-controls-group">
              <button type="button" class="icon-nav-btn" @click="navigateMonth(-1)" title="Previous Month" aria-label="Previous Month">
                <span class="material-symbols-outlined icon-18">chevron_left</span>
              </button>
              <button type="button" class="today-jump-btn" @click="jumpToCurrentMonth()" x-text="currentMonthName" title="Jump to Current Month"></button>
              <button type="button" class="icon-nav-btn" @click="navigateMonth(1)" title="Next Month" aria-label="Next Month">
                <span class="material-symbols-outlined icon-18">chevron_right</span>
              </button>
              <span class="date-text-display" x-text="selectedMonthName + ' ' + selectedYear"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Center: View Navigation Segmented Control -->
      <nav class="view-segmented-control" aria-label="Planner Views">
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'daily' }" @click="setView('daily')" title="Daily 3-Column View">
          <span>Today</span>
        </button>
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'monthly-calendar' }" @click="setView('monthly-calendar')" title="Monthly Calendar View">
          <span>Month</span>
        </button>
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'master-tasks' }" @click="setView('master-tasks')" title="Master Task List">
          <span>Master Tasks</span>
        </button>
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'monthly-index' }" @click="setView('monthly-index')" title="#index Decision Registry">
          <span>Index</span>
        </button>
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'future-matrix' }" @click="setView('future-matrix')" title="Future Planning Matrix">
          <span>Future</span>
        </button>
        <button type="button" class="segment-btn" :class="{ 'active': activeView === 'about' }" @click="setView('about')" title="About & Help">
          <span>About</span>
        </button>
      </nav>

      <!-- Right: Global Action Utilities -->
      <div class="header-actions-compact">
        <button type="button" class="search-trigger-compact" @click="toggleSearchModal()" title="Search Across All Items (Ctrl+K)">
          <span class="material-symbols-outlined icon-18">search</span>
        </button>
        <button type="button" class="sync-btn-compact" @click="trigger2WaySync()" :disabled="isSyncing" :title="outboxCount > 0 ? outboxCount + ' change' + (outboxCount === 1 ? '' : 's') + ' queued offline — will sync automatically' : 'Sync with Google Calendar & Tasks'">
          <span class="material-symbols-outlined icon-18" :class="{ 'spin': isSyncing }">sync</span>
          <span class="sync-label" x-text="isSyncing ? 'Syncing' : 'Sync'"></span>
          <span class="outbox-badge" x-show="outboxCount > 0" x-text="outboxCount" aria-label="Offline changes pending sync"></span>
        </button>
        <button type="button" class="theme-toggle-compact" @click="toggleTheme()" :aria-label="'Switch to ' + (theme === 'dark' ? 'Light' : 'Dark') + ' Mode'" :title="'Switch to ' + (theme === 'dark' ? 'Light' : 'Dark') + ' Mode'">
          <span class="material-symbols-outlined icon-18" x-text="theme === 'dark' ? 'light_mode' : 'dark_mode'"></span>
        </button>
      </div>

    </header>

    <!-- Centralized Error & Warning Banner -->
    <template x-if="errorMessage">
      <aside class="error-banner" role="alert">
        <div class="error-banner-content">
          <span class="material-symbols-outlined">warning</span>
          <span x-text="errorMessage"></span>
        </div>
        <button type="button" @click="errorMessage = null" class="error-close-btn" aria-label="Close">
          <span class="material-symbols-outlined icon-18">close</span>
        </button>
      </aside>
    </template>

    <!-- Main Workspace Area -->
    <section class="binder-body">

      <!-- View 1: 3-Column Daily Spread -->
      <template x-if="activeView === 'daily'">
        <section class="two-page-spread"
                 aria-label="Daily Planner 3-Column Workspace"
                 :class="{ 'is-resizing': isResizing }"
                 :style="{ '--col1-w': colWidths[0] + '%', '--col2-w': colWidths[1] + '%', '--col3-w': colWidths[2] + '%' }">
          
          <!-- Column 1: Daily Task List Panel -->
          <article class="page-panel col-tasks">
            <header class="panel-header">
              <h3 class="panel-header-title">
                <span class="material-symbols-outlined">format_list_numbered</span> Tasks
              </h3>
            </header>

            <!-- Task Quick Add Form -->
            <form @submit.prevent="addDailyTask()" role="group" class="task-quick-add-bar">
              <select x-model="newTaskPriorityGroup" class="task-priority-select" aria-label="Task priority group">
                <option value="A">Priority A</option>
                <option value="B">Priority B</option>
                <option value="C">Priority C</option>
              </select>
              <input type="text" x-model="newTaskTitle" placeholder="Add task title (e.g. Call vendor)..." class="task-input-field" aria-label="New task description">
              <button type="submit" class="btn-primary btn-add-task-round" aria-label="Add Task" title="Add Task">
                <span class="material-symbols-outlined">add</span>
              </button>
            </form>

            <!-- Task Table Grid -->
            <figure class="table-container">
              <table class="task-table">
                <thead>
                  <tr>
                    <th scope="col" class="th-w-40">Pri</th>
                    <th scope="col" class="th-w-40">Sts</th>
                    <th scope="col">Task Description</th>
                    <th scope="col" class="th-w-80">Category</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="task in dailyTasks" :key="task.id">
                    <tr :class="{ 'task-canceled': task.status === 'X' }">
                      <td>
                        <span class="priority-badge" :class="parseTask(task.title).priorityGroup || 'A'" x-text="parseTask(task.title).priorityCode || 'A1'"></span>
                      </td>
                      <td>
                        <div class="status-menu-wrap"
                             @mouseenter="openStatusMenu(task.id)"
                             @mouseleave="scheduleStatusMenuClose(task.id)">
                          <button type="button" class="status-btn"
                                  @click="toggleStatusMenu(task.id)"
                                  x-text="task.status || '•'"
                                  aria-haspopup="menu"
                                  :aria-expanded="openStatusMenuTaskId === task.id"
                                  :title="task.status === '→' && task.forwardedToDate ? ('Forwarded to ' + task.forwardedToDate) : ''"
                                  :aria-label="task.status === '→' && task.forwardedToDate ? ('Task status: Forwarded to ' + task.forwardedToDate + '. Click to choose a status.') : ('Task status: ' + (task.status || 'Open') + '. Click to choose a status.')"></button>
                          <div class="status-menu" role="menu" x-show="openStatusMenuTaskId === task.id" @click.outside="clearTimeout(statusMenuCloseTimer); openStatusMenuTaskId = null" x-cloak>
                            <template x-for="opt in statusOptions" :key="opt.value">
                              <button type="button" class="status-menu-item" role="menuitem"
                                      :class="{ 'is-active': (task.status || '•') === opt.value }"
                                      @click="selectTaskStatus(task, opt.value, $event)"
                                      :aria-label="'Set status: ' + opt.label">
                                <span class="status-menu-item-glyph" x-text="opt.value"></span>
                                <span x-text="opt.label"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                      </td>
                      <td class="task-title-cell">
                        <span x-text="parseTask(task.title).cleanTitle"></span>
                        <template x-if="linkedNoteForTask(task)">
                          <button type="button" class="task-note-link-btn" @click="jumpToLinkedNote(task)"
                                  :title="'Linked note: ' + (linkedNoteForTask(task).summary || 'Jump to note')"
                                  aria-label="Jump to linked note">
                            <span class="material-symbols-outlined icon-16">sticky_note_2</span>
                          </button>
                        </template>
                      </td>
                      <td class="td-category" x-text="task.category || 'Work'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </figure>

          </article>

          <!-- Column Resizer 1 (Between Tasks & Appointments) -->
          <div class="column-resizer"
               :class="{ 'is-resizing': activeResizerIndex === 1 }"
               @mousedown="initResize(1, $event)"
               @touchstart="initResize(1, $event)"
               @dblclick="resetColumnWidths()"
               role="separator"
               aria-orientation="vertical"
               aria-label="Resize Tasks and Appointments columns"
               title="Drag left or right to resize columns (Double-click to reset)">
            <div class="resizer-handle"></div>
          </div>

          <!-- Column 2: Appointment Panel -->
          <article class="page-panel col-appointments">
            <header class="panel-header appointments-header">
              <h3 class="panel-header-title">
                <span class="material-symbols-outlined">schedule</span> Appointments
              </h3>
              <div class="appointments-header-actions">
                <button type="button" class="btn-primary btn-add-task-round" @click="openCreateEventModal()" title="Add New Appointment" aria-label="Add New Appointment">
                  <span class="material-symbols-outlined">add</span>
                </button>
              </div>
            </header>

            <!-- Hourly Schedule Grid -->
            <section class="schedule-list" aria-label="Hourly Schedule">
              <template x-for="slot in scheduleGrid" :key="slot.timeKey">
                <div class="schedule-row" :class="{ 'half-hour': slot.timeKey.endsWith(':30') }">
                  <button type="button" class="schedule-time-btn" @click="openCreateEventModal(slot.timeKey)" :title="'Add appointment at ' + slot.displayTime" :aria-label="'Add appointment at ' + slot.displayTime">
                    <time class="schedule-time" x-text="slot.displayTime"></time>
                  </button>
                  <div class="schedule-content" @click.self="openCreateEventModal(slot.timeKey)">
                    <template x-for="evt in slot.events" :key="evt.id">
                      <button type="button" class="event-pill" @click.stop="openEventModal(evt)">
                        <span class="material-symbols-outlined icon-14">event</span>
                        <span class="event-pill-text" x-text="evt.title"></span>
                      </button>
                    </template>
                  </div>
                </div>
              </template>
            </section>
          </article>

          <!-- Column Resizer 2 (Between Appointments & Notes) -->
          <div class="column-resizer"
               :class="{ 'is-resizing': activeResizerIndex === 2 }"
               @mousedown="initResize(2, $event)"
               @touchstart="initResize(2, $event)"
               @dblclick="resetColumnWidths()"
               role="separator"
               aria-orientation="vertical"
               aria-label="Resize Appointments and Notes columns"
               title="Drag left or right to resize columns (Double-click to reset)">
            <div class="resizer-handle"></div>
          </div>

          <!-- Column 3: Daily Notes Panel (Lined Note Paper & Modular Topic Cards) -->
          <article class="page-panel notes-column-panel col-notes">
            <header class="panel-header notes-header">
              <h3 class="panel-header-title">
                <span class="material-symbols-outlined">description</span> Daily Notes
                <span class="notes-date-text" x-text="new Date(selectedDate + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })"></span>
              </h3>

              <div class="notes-header-actions">
                <!-- Dropdown Filter Menu Toggle -->
                <div class="dropdown-container">
                  <button type="button" class="btn-icon-subtle" @click="noteFilterMenuOpen = !noteFilterMenuOpen" title="Filter & Search Notes" aria-label="Filter & Search Notes">
                    <span class="material-symbols-outlined">tune</span>
                  </button>
                  
                  <div class="dropdown-menu notes-filter-menu" x-show="noteFilterMenuOpen" @click.outside="noteFilterMenuOpen = false" x-cloak>
                    <div class="dropdown-header">Filter & Search Cards</div>
                    <div class="dropdown-item-group">
                      <input type="search" x-model="noteCardSearchQuery" placeholder="Search card heading, notes..." class="dropdown-search-input">
                    </div>
                    <div class="dropdown-item-group">
                      <label class="dropdown-label">Category Filter:</label>
                      <select x-model="noteCardCategoryFilter" class="dropdown-select">
                        <option value="ALL">All Categories</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="Meeting">Meeting</option>
                        <option value="Decision">Decision</option>
                        <option value="Project">Project</option>
                      </select>
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item-group">
                      <label class="dropdown-label">View Mode:</label>
                      <button type="button" class="btn-toggle-mode" @click="noteViewMode = noteViewMode === 'cards' ? 'doc' : 'cards'">
                        <span x-text="noteViewMode === 'cards' ? 'Switch to Continuous Lined Doc (Future Preview)' : 'Switch to Topic Cards Mode'"></span>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Add Topic Card Button (Round button matching Tasks) -->
                <button type="button" class="btn-primary btn-add-task-round" @click="addNoteCard()" title="Add Topic Card" aria-label="Add Topic Card">
                  <span class="material-symbols-outlined">add</span>
                </button>
              </div>
            </header>

            <!-- Mode 1: Modular Topic Cards (Option 1) -->
            <div class="note-cards-container" x-show="noteViewMode === 'cards'">
              
              <!-- Filter Active Indicator -->
              <template x-if="noteCardSearchQuery || noteCardCategoryFilter !== 'ALL'">
                <div class="filter-indicator-bar">
                  <span>Filtered: <strong x-text="noteCardCategoryFilter !== 'ALL' ? noteCardCategoryFilter : ''"></strong> <span x-text="noteCardSearchQuery ? ('&quot;' + noteCardSearchQuery + '&quot;') : ''"></span></span>
                  <button type="button" class="btn-link-sm" @click="clearNoteCardFilter()">Clear</button>
                </div>
              </template>

              <!-- Cards List -->
              <template x-for="card in filteredNoteCards" :key="card.id">
                <article class="note-card-item" :id="'note-card-' + card.id" :class="{ 'collapsed': card.collapsed, 'note-color-teal': cardNoteColor(card) === 'teal', 'note-color-red': cardNoteColor(card) === 'red', 'note-color-green': cardNoteColor(card) === 'green', 'note-color-blue': cardNoteColor(card) === 'blue' }" @click.away="clearLineSelection(card)" @keydown.escape.window="clearLineSelection(card)">
                  <!-- Card Header -->
                  <header class="note-card-header">
                    <button type="button" class="card-twistie-btn" @click="toggleCardExpand(card)" :title="card.collapsed ? 'Expand Topic' : 'Collapse Topic'">
                      <span class="material-symbols-outlined icon-18" x-text="card.collapsed ? 'arrow_right' : 'arrow_drop_down'"></span>
                    </button>

                    <input type="text" x-model="card.heading" @input="syncCardsToDailyNote()" placeholder="Topic Heading (e.g. #index [Architecture])..." class="card-heading-input" aria-label="Topic Heading">

                    <template x-if="taskLinkForCard(card)">
                      <span class="task-link-tag" :title="'Linked to Task ' + taskLinkForCard(card).priority" x-text="'→ ' + taskLinkForCard(card).priority"></span>
                    </template>

                    <select x-model="card.category" @change="syncCardsToDailyNote()" class="card-category-select" aria-label="Card Category">
                      <option value="Work">Work</option>
                      <option value="Personal">Personal</option>
                      <option value="Meeting">Meeting</option>
                      <option value="Decision">Decision</option>
                      <option value="Project">Project</option>
                    </select>

                    <button type="button" class="card-delete-btn" @click="deleteNoteCard(card.id)" title="Delete Card" aria-label="Delete Card">
                      <span class="material-symbols-outlined icon-16">delete</span>
                    </button>
                  </header>

                  <!-- Card Body & Rich Formatting Bar -->
                  <div class="note-card-body" x-show="!card.collapsed">
                    <!-- Google Chat Style Formatting Toolbar -->
                    <div class="gchat-toolbar" role="toolbar" aria-label="Rich text formatting">
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'bold')" title="Bold (Ctrl+B)"><span class="material-symbols-outlined icon-16">format_bold</span></button>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'italic')" title="Italic (Ctrl+I)"><span class="material-symbols-outlined icon-16">format_italic</span></button>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'underline')" title="Underline (Ctrl+U)"><span class="material-symbols-outlined icon-16">format_underlined</span></button>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'strike')" title="Strikethrough"><span class="material-symbols-outlined icon-16">strikethrough_s</span></button>
                      <span class="toolbar-divider"></span>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'bullet')" title="Bullet List (Ctrl+Shift+8)"><span class="material-symbols-outlined icon-16">format_list_bulleted</span></button>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'ordered')" title="Numbered List (Ctrl+Shift+7)"><span class="material-symbols-outlined icon-16">format_list_numbered</span></button>
                      <button type="button" class="format-btn" @mousedown.prevent @click="applyCardFormat(card, 'code')" title="Code/Quote"><span class="material-symbols-outlined icon-16">code</span></button>
                      <span class="toolbar-divider"></span>
                      <button type="button" class="format-btn color-swatch-btn color-swatch-default" @mousedown.prevent @click="applyCardFormat(card, 'color-default')" title="Clear Color"><span class="material-symbols-outlined icon-16">format_color_reset</span></button>
                      <button type="button" class="format-btn color-swatch-btn color-swatch-teal" :class="{ active: cardNoteColor(card) === 'teal' }" @mousedown.prevent @click="applyCardFormat(card, 'color-teal')" title="Color: Teal (Ctrl+Shift+T)" aria-label="Color: Teal"></button>
                      <button type="button" class="format-btn color-swatch-btn color-swatch-red" :class="{ active: cardNoteColor(card) === 'red' }" @mousedown.prevent @click="applyCardFormat(card, 'color-red')" title="Color: Red (Ctrl+Shift+R)" aria-label="Color: Red (Urgent)"></button>
                      <button type="button" class="format-btn color-swatch-btn color-swatch-green" :class="{ active: cardNoteColor(card) === 'green' }" @mousedown.prevent @click="applyCardFormat(card, 'color-green')" title="Color: Green (Ctrl+Shift+G)" aria-label="Color: Green (Done)"></button>
                      <button type="button" class="format-btn color-swatch-btn color-swatch-blue" :class="{ active: cardNoteColor(card) === 'blue' }" @mousedown.prevent @click="applyCardFormat(card, 'color-blue')" title="Color: Blue (Ctrl+Shift+B)" aria-label="Color: Blue (Info)"></button>
                    </div>

                    <!-- Note Card Content: per-line live preview. Each line renders as styled HTML until clicked, then becomes a raw-marker input for just that one line -- so formatting/list toggles can never leak onto lines the user didn't touch. -->
                    <div class="note-card-lines">
                      <template x-for="(line, idx) in cardLines(card)" :key="idx">
                        <div class="note-card-line-row" :class="{ 'note-line-selected': isLineInSelectedRange(card, idx) }">
                          <div class="note-render-line-item" x-show="card._activeLineIndex !== idx" @click="$event.shiftKey ? extendLineSelection(card, idx) : startEditingLine(card, idx)" x-html="renderCardLine(line, cardLines(card).length === 1 && !line)" aria-label="Note line, click to edit, shift+click to extend selection"></div>

              <div class="attendees-tag-list">

    <!-- Create New Event / Appointment Modal -->

      <article class="modal-card modal-card-form" @click.away="closeCreateEventModal()">
        <header class="modal-header-spaced">
          <h3 id="createEventModalTitle" class="modal-title-with-icon">
            <span class="material-symbols-outlined">event</span> Add New Appointment
          </h3>
          <button type="button" class="btn-icon-subtle" @click="closeCreateEventModal()" title="Close">
            <span class="material-symbols-outlined icon-18">close</span>
          </button>
        </header>

        <form @submit.prevent="saveNewEvent()" class="create-event-form">
          <div class="form-group">
            <label for="evtTitleInput" class="form-label">Appointment Title <span class="required-star">*</span></label>
            <input type="text" id="evtTitleInput" x-model="newEventData.title" placeholder="e.g. Client Strategy Sync" required class="form-input">
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label for="evtStartTime" class="form-label">Start Time</label>
              <select id="evtStartTime" x-model="newEventData.startTime" @change="onStartTimeChange()" class="form-select">
                <option value="07:00">07:00 AM</option>
                <option value="07:30">07:30 AM</option>
                <option value="08:00">08:00 AM</option>

                <option value="09:30">09:30 AM</option>
                <option value="10:00">10:00 AM</option>
                <option value="10:30">10:30 AM</option>
                <option value="11:00">11:00 AM</option>
                <option value="11:30">11:30 AM</option>
                <option value="12:00">12:00 PM</option>
                <option value="12:30">12:30 PM</option>
                <option value="13:00">01:00 PM</option>
                <option value="13:30">01:30 PM</option>
                <option value="14:00">02:00 PM</option>
                <option value="14:30">02:30 PM</option>
                <option value="15:00">03:00 PM</option>
                <option value="15:30">03:30 PM</option>
                <option value="16:00">04:00 PM</option>
                <option value="16:30">04:30 PM</option>
                <option value="17:00">05:00 PM</option>
                <option value="17:30">05:30 PM</option>
                <option value="18:00">06:00 PM</option>
                <option value="18:30">06:30 PM</option>
                <option value="19:00">07:00 PM</option>
              </select>
            </div>

            <div class="form-group">
              <label for="evtEndTime" class="form-label">
                <span>End Time</span>
                <span class="duration-badge" x-text="(newEventData.duration || 25) + 'm session'"></span>
              </label>
              <input type="time" id="evtEndTime" x-model="newEventData.endTime" class="form-input">
            </div>
          </div>

          <!-- Meeting Length Preset Selector (25m | 50m | 80m) -->
          <div class="form-group duration-picker-group">
            <label class="form-label">
              <span class="material-symbols-outlined icon-16">timelapse</span> Meeting Length

            <div class="duration-pills-row" role="radiogroup" aria-label="Meeting Duration">

                      class="duration-pill"
                      :class="{ 'active': newEventData.duration === 25 }"

                      role="radio"
                      :aria-checked="newEventData.duration === 25"

                ⏱️ 25 min
              </button>
              <button type="button"
                      class="duration-pill"
                      :class="{ 'active': newEventData.duration === 50 }"
                      @click="setEventDuration(50)"
                      role="radio"
                      :aria-checked="newEventData.duration === 50"
                      title="50-minute meeting (10-minute focus buffer)">
                ⏱️ 50 min
              </button>
              <button type="button"
                      class="duration-pill"
                      :class="{ 'active': newEventData.duration === 80 }"
                      @click="setEventDuration(80)"
                      role="radio"
                      :aria-checked="newEventData.duration === 80"

        <footer class="modal-actions">
          <button type="button" class="btn-secondary" @click="closeSearchModal()">Close</button>
        </footer>
      </article>
    </dialog>
