<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
  // Helper engine definitions bundled for GAS SPA client
  const STATUS_LIST = ['•', '✓', '→', 'X', 'G/✓'];

  function parseTaskTitle(rawTitle = '') {
    if (!rawTitle) return { priorityGroup: null, sequence: null, priorityCode: null, cleanTitle: '' };
    const match = rawTitle.match(/^\[([A-C])([1-9])\]\s*(.*)$/i);
    if (match) {
      return {
        priorityGroup: match[1].toUpperCase(),
        sequence: parseInt(match[2], 10),
        priorityCode: `${match[1].toUpperCase()}${match[2]}`,
        cleanTitle: match[3].trim()
      };
    }
    return { priorityGroup: null, sequence: null, priorityCode: null, cleanTitle: rawTitle.trim() };
  }

  function formatTaskTitle(priorityGroup, sequence, cleanTitle) {
    const trimmed = (cleanTitle || '').trim();
    if (priorityGroup && sequence) return `[${priorityGroup.toUpperCase()}${sequence}] ${trimmed}`;
    return trimmed;
  }

  function getNextStatus(curr) {
    const idx = STATUS_LIST.indexOf(curr);
    if (idx === -1 || idx === STATUS_LIST.length - 1) return STATUS_LIST[0];
    return STATUS_LIST[idx + 1];
  }

  class GASBridge {
    constructor(useMock = false) {
      this.useMock = useMock;
      this.mockData = {
        dailyTasks: {
          '2026-08-15': [
            { id: 't1', title: '[A1] Finalize Day Planner PRD & architecture', status: '✓', category: 'Work', dueDate: '2026-08-15' },
            { id: 't2', title: '[A2] Conduct team sync on Google Suite integration', status: '•', category: 'Work', dueDate: '2026-08-15' },
            { id: 't3', title: '[B1] Review Q3 budget draft', status: '•', category: 'Financial', dueDate: '2026-08-15' },
            { id: 't4', title: '[C1] Order ergonomic desk accessories', status: '•', category: 'Personal', dueDate: '2026-08-15' }
          ]
        },
        masterTasks: [
          { id: 'm1', title: 'Prepare Q3 performance appraisals', category: 'Work', status: '•' },
          { id: 'm2', title: 'Plan annual family retreat', category: 'Personal', status: '•' },
          { id: 'm3', title: 'Rebalance investment portfolio', category: 'Financial', status: '•' },
          { id: 'm4', title: 'Migrate server infrastructure to GCP', category: 'Projects', status: '•' }
        ],
        calendarEvents: {
          '2026-08-15': [
            {
              id: 'e1',
              title: 'Morning Executive Briefing',
              startTime: '2026-08-15T08:00:00Z',
              endTime: '2026-08-15T08:30:00Z',
              location: 'Conference Room 1',
              description: 'Daily executive updates and Q3 metrics review.',
              meetLink: 'https://meet.google.com/abc-defg-hij'
            },
            {
              id: 'e2',
              title: 'Architecture & Design Review',
              startTime: '2026-08-15T10:30:00Z',
              endTime: '2026-08-15T11:30:00Z',
              location: 'Google Meet',
              description: 'Reviewing Day Planner UI binder layout and Alpine.js state bridge.',
              meetLink: 'https://meet.google.com/xyz-uvwx-rst'
            },
            {
              id: 'e3',
              title: 'Q3 Budget Approval Meeting',
              startTime: '2026-08-15T14:00:00Z',
              endTime: '2026-08-15T15:00:00Z',
              location: 'Boardroom B',
              description: 'Final sign-off on Q3 marketing & infrastructure budgets.',
              meetLink: 'https://meet.google.com/q3-budget-meet'
            }
          ]
        },
        dailyNotes: {
          '2026-08-15': `# Daily Log - August 15, 2026

## Key Meetings & Notes
- Executive briefing focused on accelerating digital transformation.
- #index [Architecture] Finalized single page binder layout using Alpine.js and clean UWSDS CSS.
- #index [Finance] Approved $15,000 infrastructure allocation for GCP migration.
- Team sync went smoothly. Reminded everyone about tomorrow's demo.

## Daily Tracker
- Water: 8 / 8 glasses
- Fitness: 45 min cardio
- Priority Focus: 100% on Day Planner Goals`
        },
        indexEntries: [
          { id: 'i1', date: '2026-08-15', topic: 'Architecture', summary: 'Finalized single page binder layout using Alpine.js', docUrl: '#doc-2026-08-15' },
          { id: 'i2', date: '2026-08-15', topic: 'Finance', summary: 'Approved $15,000 infrastructure allocation for GCP migration', docUrl: '#doc-2026-08-15' }
        ]
      };
    }

    async getDailyData(dateStr) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        return {
          date: dateStr,
          tasks: this.mockData.dailyTasks[dateStr] || [],
          calendarEvents: this.mockData.calendarEvents[dateStr] || [],
          noteContent: this.mockData.dailyNotes[dateStr] || `No notes recorded for ${dateStr}.`
        };
      }

      return new Promise((resolve, reject) => {
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getDailyData(dateStr);
      });
    }

    async getMasterTasks(monthYearStr) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        return this.mockData.masterTasks;
      }

      return new Promise((resolve, reject) => {
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getMasterTasks(monthYearStr);
      });
    }

    async addDailyTask(dateStr, title, category = 'General') {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        if (!this.mockData.dailyTasks[dateStr]) {
          this.mockData.dailyTasks[dateStr] = [];
        }
        const newTask = {
          id: `t_${Date.now()}`,
          title,
          status: '•',
          category,
          dueDate: dateStr
        };
        this.mockData.dailyTasks[dateStr].push(newTask);
        return newTask;
      }

      return new Promise((resolve, reject) => {
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .addDailyTask(dateStr, title, category);
      });
    }

    async transferMasterTask(masterTaskId, dateStr, priorityGroup = 'A') {
      const masterTask = (this.mockData.masterTasks || []).find(m => m.id === masterTaskId);
      const cleanTitle = masterTask ? masterTask.title : 'Transferred Task';
      const category = masterTask ? masterTask.category : 'General';
      const formattedTitle = `[${priorityGroup.toUpperCase()}1] ${cleanTitle}`;

      return this.addDailyTask(dateStr, formattedTitle, category);
    }
  }

  document.addEventListener('alpine:init', () => {
    Alpine.data('plannerApp', () => ({
      activeView: 'daily',
      selectedDate: new Date().toISOString().slice(0, 10),
      selectedYear: new Date().getFullYear(),
      selectedMonth: new Date().getMonth() + 1,
      
      // Data collections
      dailyTasks: [],
      masterTasks: [],
      calendarEvents: [],
      scheduleGrid: [],
      dailyNote: '',
      indexRecords: [],
      monthlyGrid: [],

      // Sync & Error states
      isSyncing: false,
      errorMessage: null,

      // Modals
      eventModalOpen: false,
      selectedEvent: null,

      searchModalOpen: false,
      searchQuery: '',
      searchResults: { totalMatches: 0, calendar: [], tasks: [], notes: [], index: [] },

      // Task inputs
      newTaskTitle: '',
      newTaskPriorityGroup: 'A',

      bridge: null,

      theme: 'light',

      get isMonthlyView() {
        return ['monthly-calendar', 'master-tasks', 'monthly-index', 'future-matrix'].includes(this.activeView);
      },

      get selectedMonthName() {
        return new Date(this.selectedYear, this.selectedMonth - 1, 1).toLocaleDateString('en-US', { month: 'long' });
      },

      get currentMonthName() {
        return new Date().toLocaleDateString('en-US', { month: 'long' });
      },

      async init() {
        this.bridge = new GASBridge(false);
        this.initTheme();
        await this.loadDayData();
        await this.loadMasterTasks();
        this.setupKeyboardShortcuts();
      },

      initTheme() {
        try {
          const saved = localStorage.getItem('dayPlannerTheme');
          if (saved) {
            this.theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            this.theme = 'dark';
          } else {
            this.theme = 'light';
          }
        } catch (e) {
          this.theme = 'light';
        }
        this.applyTheme();
      },

      toggleTheme() {
        this.theme = this.theme === 'dark' ? 'light' : 'dark';
        try {
          localStorage.setItem('dayPlannerTheme', this.theme);
        } catch (e) {}
        this.applyTheme();
      },

      applyTheme() {
        document.documentElement.setAttribute('data-theme', this.theme);
      },

      setupKeyboardShortcuts() {
        window.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            this.toggleSearchModal();
          }
        });
      },

      async trigger2WaySync() {
        this.isSyncing = true;
        this.errorMessage = null;

        try {
          await new Promise(r => setTimeout(r, 400)); // Visual indicator

          // Perform bidirectional sync reconciliation
          this.dailyTasks.forEach(task => {
            const isDone = task.status === '✓';
            const matchEvt = this.calendarEvents.find(e => e.syncTaskId === task.id || e.title.includes(parseTaskTitle(task.title).cleanTitle));
            if (matchEvt) {
              matchEvt.title = isDone ? `[✓] ${parseTaskTitle(task.title).cleanTitle}` : task.title;
            } else {
              this.calendarEvents.push({
                id: `evt_sync_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                title: isDone ? `[✓] ${parseTaskTitle(task.title).cleanTitle}` : task.title,
                startTime: `${this.selectedDate}T09:00:00Z`,
                endTime: `${this.selectedDate}T09:30:00Z`,
                syncTaskId: task.id
              });
            }
          });

          this.buildScheduleGrid();
        } catch (err) {
          console.error('🔥 trigger2WaySync error:', err);
          this.errorMessage = `2-Way Sync Warning: ${err.message || err.toString()}`;
        } finally {
          this.isSyncing = false;
        }
      },

      async setView(viewName) {
        this.activeView = viewName;
        if (viewName === 'monthly-calendar') {
          this.buildMonthlyGrid();
        }
      },

      async navigateDay(delta) {
        const d = new Date(`${this.selectedDate}T00:00:00`);
        d.setDate(d.getDate() + delta);
        this.selectedDate = d.toISOString().slice(0, 10);
        this.selectedYear = d.getFullYear();
        this.selectedMonth = d.getMonth() + 1;
        await this.loadDayData();
      },

      async navigateMonth(delta) {
        const [y, m] = this.selectedDate.split('-').map(Number);
        const d = new Date(y, m - 1 + delta, 1);
        const monthStr = (d.getMonth() + 1).toString().padStart(2, '0');
        this.selectedDate = `${d.getFullYear()}-${monthStr}-01`;
        this.selectedYear = d.getFullYear();
        this.selectedMonth = d.getMonth() + 1;
        await this.loadDayData();
        await this.loadMasterTasks();
        if (this.activeView === 'monthly-calendar') {
          this.buildMonthlyGrid();
        }
      },

      async jumpToCurrentMonth() {
        const now = new Date();
        this.selectedYear = now.getFullYear();
        this.selectedMonth = now.getMonth() + 1;
        const monthStr = this.selectedMonth.toString().padStart(2, '0');
        this.selectedDate = `${this.selectedYear}-${monthStr}-01`;
        await this.loadDayData();
        await this.loadMasterTasks();
        if (this.activeView === 'monthly-calendar') {
          this.buildMonthlyGrid();
        }
      },

      async loadDayData() {
        try {
          const data = await this.bridge.getDailyData(this.selectedDate);
          if (data.error) {
            this.errorMessage = data.error;
          }
          if (data.warnings && data.warnings.length > 0) {
            this.errorMessage = data.warnings.join(' | ');
          }
          this.dailyTasks = data.tasks || [];
          this.calendarEvents = data.calendarEvents || [];
          this.dailyNote = data.noteContent || '';
          this.buildScheduleGrid();
          this.buildIndexRecords();
        } catch (err) {
          console.error('🔥 loadDayData error:', err);
          this.errorMessage = `Error loading daily workspace: ${err.message || err.toString()}`;
        }
      },

      async loadMasterTasks() {
        try {
          this.masterTasks = await this.bridge.getMasterTasks(`${this.selectedMonthName} ${this.selectedYear}`);
        } catch (err) {
          console.error('🔥 loadMasterTasks error:', err);
          this.errorMessage = `Error loading master tasks: ${err.message || err.toString()}`;
        }
      },

      buildScheduleGrid() {
        const slots = [];
        for (let hour = 7; hour < 19; hour++) {
          const hourStr = hour > 12 ? `${hour - 12}` : `${hour}`;
          const ampm = hour >= 12 ? 'PM' : 'AM';
          const key00 = `${hour.toString().padStart(2, '0')}:00`;
          const key30 = `${hour.toString().padStart(2, '0')}:30`;

          slots.push({ timeKey: key00, displayTime: `${hourStr}:00 ${ampm}`, events: [] });
          slots.push({ timeKey: key30, displayTime: `${hourStr}:30 ${ampm}`, events: [] });
        }
        slots.push({ timeKey: '19:00', displayTime: '7:00 PM', events: [] });

        // Map events
        this.calendarEvents.forEach(evt => {
          const start = new Date(evt.startTime);
          const slotKey = `${start.getHours().toString().padStart(2, '0')}:${start.getMinutes() < 30 ? '00' : '30'}`;
          const slot = slots.find(s => s.timeKey === slotKey);
          if (slot) slot.events.push(evt);
        });

        this.scheduleGrid = slots;
      },

      buildIndexRecords() {
        if (!this.dailyNote) return;
        const lines = this.dailyNote.split('\n');
        const entries = [];
        lines.forEach(l => {
          if (/#index|\[INDEX\]/i.test(l)) {
            let clean = l.replace(/#index|\[INDEX\]/gi, '').trim();
            let topic = 'General';
            const match = clean.match(/^\[([^\]]+)\]\s*(.*)$/);
            if (match) {
              topic = match[1];
              clean = match[2];
            }
            entries.push({ date: this.selectedDate, topic, summary: clean, docUrl: `#doc-${this.selectedDate}` });
          }
        });
        this.indexRecords = entries;
      },

      buildMonthlyGrid() {
        const firstDay = new Date(this.selectedYear, this.selectedMonth - 1, 1);
        const lastDay = new Date(this.selectedYear, this.selectedMonth, 0);
        const days = [];
        const startDayOfWeek = firstDay.getDay();

        for (let i = startDayOfWeek - 1; i >= 0; i--) {
          days.push({ dayNum: '', isCurrentMonth: false, events: [] });
        }

        for (let day = 1; day <= lastDay.getDate(); day++) {
          const dateStr = `${this.selectedYear}-${this.selectedMonth.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
          days.push({ dateStr, dayNum: day, isCurrentMonth: true, events: this.calendarEvents.filter(e => e.startTime?.startsWith(dateStr)) });
        }

        while (days.length % 7 !== 0) {
          days.push({ dayNum: '', isCurrentMonth: false, events: [] });
        }

        this.monthlyGrid = days;
      },

      async addDailyTask() {
        if (!this.newTaskTitle.trim()) return;
        try {
          const existingCount = this.dailyTasks.length + 1;
          const formattedTitle = formatTaskTitle(this.newTaskPriorityGroup, existingCount, this.newTaskTitle);
          const newTask = await this.bridge.addDailyTask(this.selectedDate, formattedTitle);
          this.dailyTasks.push(newTask);
          this.newTaskTitle = '';
          await this.trigger2WaySync();
        } catch (err) {
          console.error('🔥 addDailyTask error:', err);
          this.errorMessage = `Error adding task: ${err.message || err.toString()}`;
        }
      },

      async toggleTaskStatus(task) {
        task.status = getNextStatus(task.status);
        await this.trigger2WaySync();
      },

      async moveMasterTaskToToday(mTask) {
        try {
          const transferred = await this.bridge.transferMasterTask(mTask.id, this.selectedDate, 'A');
          if (transferred) {
            this.dailyTasks.push(transferred);
            await this.trigger2WaySync();
            alert(`Moved "${mTask.title}" to Today's Task List as ${transferred.title.substring(0, 4)}!`);
          }
        } catch (err) {
          console.error('🔥 moveMasterTaskToToday error:', err);
          this.errorMessage = `Error moving master task: ${err.message || err.toString()}`;
        }
      },

      openEventModal(evt) {
        this.selectedEvent = evt;
        this.eventModalOpen = true;
      },

      closeEventModal() {
        this.eventModalOpen = false;
        this.selectedEvent = null;
      },

      toggleSearchModal() {
        this.searchModalOpen = !this.searchModalOpen;
        if (this.searchModalOpen) {
          this.runSearch();
        }
      },

      runSearch() {
        const q = this.searchQuery.trim().toLowerCase();
        if (!q) {
          this.searchResults = { totalMatches: 0, calendar: [], tasks: [], notes: [], index: [] };
          return;
        }

        const res = { totalMatches: 0, calendar: [], tasks: [], notes: [], index: [] };

        this.calendarEvents.forEach(e => {
          if ((e.title || '').toLowerCase().includes(q) || (e.description || '').toLowerCase().includes(q)) {
            res.calendar.push(e);
            res.totalMatches++;
          }
        });

        [...this.dailyTasks, ...this.masterTasks].forEach(t => {
          if ((t.title || '').toLowerCase().includes(q)) {
            res.tasks.push(t);
            res.totalMatches++;
          }
        });

        if (this.dailyNote.toLowerCase().includes(q)) {
          res.notes.push({ date: this.selectedDate, content: this.dailyNote });
          res.totalMatches++;
        }

        this.indexRecords.forEach(i => {
          if ((i.summary || '').toLowerCase().includes(q) || (i.topic || '').toLowerCase().includes(q)) {
            res.index.push(i);
            res.totalMatches++;
          }
        });

        this.searchResults = res;
      },

      parseTask(title) {
        return parseTaskTitle(title);
      }
    }));
  });
</script>
