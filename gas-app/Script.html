<script>
  // Helper engine definitions bundled for GAS SPA client
  const STATUS_LIST = ['•', '✓', '→', 'X', 'D/✓'];

  function parseTaskTitle(rawTitle = '') {
    if (!rawTitle) return { priorityGroup: null, sequence: null, priorityCode: null, cleanTitle: '' };
    const match = rawTitle.match(/^\[([A-C])([1-9])\]\s*(.*)$/i);
    if (match) {
      return {
        priorityGroup: match[1].toUpperCase(),
        sequence: parseInt(match[2], 10),
        priorityCode: `${match[1].toUpperCase()}${match[2]}`,
        cleanTitle: match[3].trim()
      };
    }
    return { priorityGroup: null, sequence: null, priorityCode: null, cleanTitle: rawTitle.trim() };
  }

  function formatTaskTitle(priorityGroup, sequence, cleanTitle) {
    const trimmed = (cleanTitle || '').trim();
    if (priorityGroup && sequence) return `[${priorityGroup.toUpperCase()}${sequence}] ${trimmed}`;
    return trimmed;
  }

  function getCleanTitle(title = '') {
    if (!title) return '';
    return title.replace(/^(\s*\[(?:✓|[A-Za-z][1-9])\]\s*)+/gi, '').trim();
  }

  function getNextStatus(currentStatus) {
    const idx = STATUS_LIST.indexOf(currentStatus);
    if (idx === -1 || idx === STATUS_LIST.length - 1) return STATUS_LIST[0];
    return STATUS_LIST[idx + 1];
  }

  // Human-readable labels for each status glyph, backing the status-select dropdown -- mirrors
  // src/taskEngine.js's STATUS_OPTIONS.
  const STATUS_OPTIONS = [
    { value: '•', label: 'Open' },
    { value: '✓', label: 'Done' },
    { value: '→', label: 'Forward' },
    { value: 'X', label: 'Canceled' },
    { value: 'D/✓', label: 'Delegated (Done)' }
  ];

  // Mirrors src/taskEngine.js's isValidStatus.
  function isValidStatus(status) {
    return STATUS_LIST.includes(status);
  }

  // Future Planning Matrix (12-month overview) — mirrors src/futureMatrixEngine.js
  const FUTURE_MONTH_KEYS = Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, '0'));

  function createFutureItem(title, category = 'General') {
    return {
      id: `fm_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      title,
      category,
      status: '•',
      createdAt: new Date().toISOString()
    };
  }

  function nextMonthKey(monthKey) {
    const [yearStr, monthStr] = monthKey.split('-');
    let year = parseInt(yearStr, 10);
    let month = parseInt(monthStr, 10) + 1;
    if (month > 12) {
      month = 1;
      year += 1;
    }
    return `${year}-${String(month).padStart(2, '0')}`;
  }

  function emptyYearMatrix(year) {
    const months = {};
    FUTURE_MONTH_KEYS.forEach(mm => {
      months[`${year}-${mm}`] = [];
    });
    return { year: String(year), months };
  }

  function syncTaskToCalendar(task, calendarEvents = []) {
    const parsed = parseTaskTitle(task.title);
    const cleanTitle = getCleanTitle(parsed.cleanTitle || task.title);
    const isCompleted = task.status === '✓';

    const eventTitle = isCompleted ? `[✓] ${cleanTitle}` : (parsed.priorityCode ? `[${parsed.priorityCode}] ${cleanTitle}` : cleanTitle);

    const existingEvent = calendarEvents.find(evt =>
      evt.syncTaskId === task.id || (evt.extendedProperties && evt.extendedProperties.private && evt.extendedProperties.private.gasTaskId === task.id)
    );

    // Day planners keep Tasks and Appointments distinct: a task only becomes a calendar
    // event when the user explicitly time-blocks it (task.scheduledTime). Without that, no
    // event is created — an untimed task must never appear as a phantom "9am appointment".
    if (!task.scheduledTime && !existingEvent) {
      return { updatedEvent: null, isNewEvent: false };
    }

    const startTime = task.scheduledTime || `${task.dueDate || getLocalDateStr()}T09:00:00Z`;
    const defaultEndTime = `${startTime.substring(0, 11)}${String(Math.min(23, parseInt(startTime.substring(11, 13) || '9', 10) + 1)).padStart(2, '0')}:00:00Z`;
    const endTime = task.endTime || (existingEvent ? existingEvent.endTime : defaultEndTime);

    if (existingEvent) {
      return {
        updatedEvent: {
          ...existingEvent,
          title: eventTitle,
          startTime: task.scheduledTime || existingEvent.startTime || startTime,
          endTime: task.endTime || existingEvent.endTime || endTime,
          isCompleted,
          syncTaskId: task.id,
          lastSyncedAt: new Date().toISOString()
        },
        isNewEvent: false
      };
    }

    return {
      updatedEvent: {
        id: `evt_sync_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        title: eventTitle,
        startTime,
        endTime,
        location: task.category || 'Planner Task',
        description: `Synced from Planner Task [${parsed.priorityCode || 'Open'}]`,
        syncTaskId: task.id,
        isCompleted,
        extendedProperties: { private: { gasTaskId: task.id } },
        lastSyncedAt: new Date().toISOString()
      },
      isNewEvent: true
    };
  }

  function syncCalendarToTask(calendarEvent, dailyTasks = []) {
    const linkedTaskId = calendarEvent.syncTaskId || (calendarEvent.extendedProperties && calendarEvent.extendedProperties.private && calendarEvent.extendedProperties.private.gasTaskId);
    let targetTask = linkedTaskId ? dailyTasks.find(t => t.id === linkedTaskId) : null;

    const eventTitleClean = getCleanTitle(calendarEvent.title);
    const parsedEvent = parseTaskTitle(calendarEvent.title);

    if (!targetTask && (parsedEvent.priorityCode || calendarEvent.title.startsWith('[✓]'))) {
      targetTask = dailyTasks.find(t => {
        const parsedT = parseTaskTitle(t.title);
        const cleanT = getCleanTitle(parsedT.cleanTitle || t.title);
        return cleanT && cleanT.toLowerCase() === eventTitleClean.toLowerCase();
      });
    }

    if (!targetTask) return null;

    const parsedTask = parseTaskTitle(targetTask.title);
    const priorityGroup = parsedEvent.priorityGroup || parsedTask.priorityGroup;
    const sequence = parsedEvent.sequence || parsedTask.sequence;
    const formattedTitle = (priorityGroup && sequence)
      ? formatTaskTitle(priorityGroup, sequence, eventTitleClean)
      : eventTitleClean;

    const isCompletedInEvent = calendarEvent.title.startsWith('[✓]') || Boolean(calendarEvent.isCompleted);
    let newStatus = targetTask.status;
    if (isCompletedInEvent) {
      newStatus = '✓';
    } else if (targetTask.status === '✓') {
      newStatus = '•';
    }

    return {
      ...targetTask,
      title: formattedTitle,
      status: newStatus,
      scheduledTime: calendarEvent.startTime || targetTask.scheduledTime,
      dueDate: calendarEvent.startTime ? calendarEvent.startTime.slice(0, 10) : targetTask.dueDate
    };
  }

  function reconcileWorkspaceChanges(dailyTasks = [], calendarEvents = []) {
    const reconciledTasks = [...dailyTasks];
    const reconciledEvents = [...calendarEvents];

    reconciledTasks.forEach((task) => {
      const { updatedEvent, isNewEvent } = syncTaskToCalendar(task, reconciledEvents);
      if (!updatedEvent) return; // untimed task: no calendar event to create or update
      if (isNewEvent) {
        reconciledEvents.push(updatedEvent);
      } else {
        const matchIdx = reconciledEvents.findIndex(e => e.id === updatedEvent.id);
        if (matchIdx !== -1) {
          reconciledEvents[matchIdx] = updatedEvent;
        }
      }
    });

    // Events never create tasks: Tasks belong on the Tasks pane, events belong on
    // the Calendar. Only reconcile events that are already linked to (or title-match)
    // an existing task; an unlinked event is left as calendar-only.
    reconciledEvents.forEach((evt) => {
      const updatedTask = syncCalendarToTask(evt, reconciledTasks);
      if (updatedTask) {
        const taskIdx = reconciledTasks.findIndex(t => t.id === updatedTask.id);
        if (taskIdx !== -1) {
          reconciledTasks[taskIdx] = updatedTask;
        }
      }
    });

    return {
      tasks: reconciledTasks,
      calendarEvents: reconciledEvents,
      syncTimestamp: new Date().toISOString()
    };
  }

  // Client IndexedDB cache for offline-first daily data (tasks/appointments/notes).
  // Mirrors src/indexedDbStore.js — HtmlService can't import ES modules, so this is
  // a hand-duplicated inline copy; keep both in sync per sync-src-and-gas-app.md.
  const IDB_NAME = 'day-planner-db';
  const IDB_VERSION = 2;
  const IDB_STORE_DAILY = 'dailyData';
  const IDB_STORE_OUTBOX = 'outboxQueue';
  // Read-only cache of a whole month's {tasks, calendarEvents, noteContent} per day, used to
  // render the monthly-calendar view and warm the rolling 3-month cache in the background.
  // Deliberately separate from IDB_STORE_DAILY so a background month-batch response can never
  // race a fresher single-day write or a pending offline edit.
  const IDB_STORE_MONTH_OVERVIEW = 'monthOverview';

  function idbSupported() {
    return typeof indexedDB !== 'undefined' && indexedDB !== null;
  }

  // Opening the DB is idempotent, so cache the in-flight/opened promise instead of issuing a
  // fresh indexedDB.open() per call — a month-batch write otherwise means ~30 separate opens.
  let idbDbPromise = null;

  function idbOpen() {
    if (!idbSupported()) return Promise.resolve(null);
    if (idbDbPromise) return idbDbPromise;
    idbDbPromise = new Promise((resolve) => {
      try {
        const request = indexedDB.open(IDB_NAME, IDB_VERSION);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE_DAILY)) {
            db.createObjectStore(IDB_STORE_DAILY, { keyPath: 'dateStr' });
          }
          if (!db.objectStoreNames.contains(IDB_STORE_OUTBOX)) {
            db.createObjectStore(IDB_STORE_OUTBOX, { keyPath: 'id', autoIncrement: true });
          }
          if (!db.objectStoreNames.contains(IDB_STORE_MONTH_OVERVIEW)) {
            db.createObjectStore(IDB_STORE_MONTH_OVERVIEW, { keyPath: 'monthStr' });
          }
        };
        request.onsuccess = (event) => resolve(event.target.result);
        request.onerror = (event) => {
          console.warn('IndexedDB open error:', event.target && event.target.error);
          idbDbPromise = null;
          resolve(null);
        };
      } catch (e) {
        idbDbPromise = null;
        resolve(null);
      }
    });
    return idbDbPromise;
  }

  async function idbGetDaily(dateStr) {
    const db = await idbOpen();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([IDB_STORE_DAILY], 'readonly');
        const req = tx.objectStore(IDB_STORE_DAILY).get(dateStr);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      } catch (e) {
        resolve(null);
      }
    });
  }

  async function idbSaveDaily(dateStr, payload) {
    const db = await idbOpen();
    if (!db) return false;
    const item = Object.assign({}, payload, { dateStr, cachedAt: new Date().toISOString() });
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([IDB_STORE_DAILY], 'readwrite');
        const req = tx.objectStore(IDB_STORE_DAILY).put(item);
        req.onsuccess = () => resolve(true);
        req.onerror = () => resolve(false);
      } catch (e) {
        resolve(false);
      }
    });
  }

  async function idbGetMonthOverview(monthStr) {
    const db = await idbOpen();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([IDB_STORE_MONTH_OVERVIEW], 'readonly');
        const req = tx.objectStore(IDB_STORE_MONTH_OVERVIEW).get(monthStr);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      } catch (e) {
        resolve(null);
      }
    });
  }

  async function idbSaveMonthOverview(monthStr, days) {
    const db = await idbOpen();
    if (!db) return false;
    const item = { monthStr, days, cachedAt: new Date().toISOString() };
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([IDB_STORE_MONTH_OVERVIEW], 'readwrite');
        const req = tx.objectStore(IDB_STORE_MONTH_OVERVIEW).put(item);
        req.onsuccess = () => resolve(true);
        req.onerror = () => resolve(false);
      } catch (e) {
        resolve(false);
      }
    });
  }

  async function idbEnqueueMutation(type, payload) {
    const db = await idbOpen();
    const mutation = { type, payload, enqueuedAt: new Date().toISOString() };
    if (!db) return false;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([IDB_STORE_OUTBOX], 'readwrite');
        const req = tx.objectStore(IDB_STORE_OUTBOX).put(mutation);
        req.onsuccess = () => resolve(true);
        req.onerror = () => resolve(false);
      } catch (e) {
        resolve(false);
      }
    });
  }

  async function idbGetOutbox() {
    const db = await idbOpen();
    if (!db) return [];
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([IDB_STORE_OUTBOX], 'readonly');
        const req = tx.objectStore(IDB_STORE_OUTBOX).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      } catch (e) {
        resolve([]);
      }
    });
  }

  async function idbDequeueMutation(id) {
    const db = await idbOpen();
    if (!db) return false;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([IDB_STORE_OUTBOX], 'readwrite');
        const req = tx.objectStore(IDB_STORE_OUTBOX).delete(id);
        req.onsuccess = () => resolve(true);
        req.onerror = () => resolve(false);
      } catch (e) {
        resolve(false);
      }
    });
  }

  const MONTH_CACHE_TTL_MS = 15 * 60 * 1000;

  const OUTBOX_MUTATION_TYPES = {
    ADD_DAILY_TASK: 'ADD_DAILY_TASK',
    UPDATE_DAILY_TASK: 'UPDATE_DAILY_TASK',
    ADD_CALENDAR_EVENT: 'ADD_CALENDAR_EVENT',
    UPDATE_CALENDAR_EVENT: 'UPDATE_CALENDAR_EVENT',
    SAVE_DAILY_NOTE: 'SAVE_DAILY_NOTE'
  };

  class GASBridge {

            { id: 't4', title: '[C1] Order ergonomic desk accessories', status: '•', category: 'Personal', dueDate: '2026-08-15' }
          ]
        },

            {

    isOnline() {
      if (typeof navigator === 'undefined' || typeof navigator.onLine !== 'boolean') return true;
      return navigator.onLine;
    }

    _runGasCall(fnName, args) {
      return new Promise((resolve, reject) => {
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          [fnName](...args);
      });
    }

    async flushOutbox(onResolved) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        return { flushed: 0, remaining: 0, failed: 0 };
      }
      if (!this.isOnline()) {
        const pending = await idbGetOutbox();
        return { flushed: 0, remaining: pending.length, failed: 0 };
      }
      const outbox = (await idbGetOutbox()).sort((a, b) => a.id - b.id);
      const tempIdMap = {};
      const resolveId = (id) => tempIdMap[id] || id;
      let flushed = 0, failed = 0;
      for (const mutation of outbox) {
        try {
          let result;
          switch (mutation.type) {
            case OUTBOX_MUTATION_TYPES.ADD_DAILY_TASK: {
              const { dateStr, title, category, tempId } = mutation.payload;
              result = await this._runGasCall('addDailyTask', [dateStr, title, category]);
              if (result && result.id && tempId) tempIdMap[tempId] = result.id;
              break;
            }
            case OUTBOX_MUTATION_TYPES.UPDATE_DAILY_TASK: {
              const { dateStr, taskId, updates } = mutation.payload;
              result = await this._runGasCall('updateDailyTask', [dateStr, resolveId(taskId), updates]);
              break;
            }
            case OUTBOX_MUTATION_TYPES.ADD_CALENDAR_EVENT: {
              const { dateStr, eventData, tempId } = mutation.payload;
              result = await this._runGasCall('addCalendarEvent', [dateStr, eventData]);
              if (result && result.id && tempId) tempIdMap[tempId] = result.id;
              break;
            }
            case OUTBOX_MUTATION_TYPES.UPDATE_CALENDAR_EVENT: {
              const { dateStr, eventId, updates } = mutation.payload;
              result = await this._runGasCall('updateCalendarEvent', [dateStr, resolveId(eventId), updates]);
              break;
            }
            case OUTBOX_MUTATION_TYPES.SAVE_DAILY_NOTE: {
              const { dateStr, noteContent } = mutation.payload;
              result = await this._runGasCall('saveDailyDocCards', [dateStr, noteContent]);
              break;
            }
            default:
              result = null;
          }
          await idbDequeueMutation(mutation.id);
          flushed++;
          if (typeof onResolved === 'function') onResolved(mutation, result, tempIdMap);
        } catch (err) {
          console.error('🔥 flushOutbox: mutation failed, stopping to preserve order', mutation, err);
          failed++;
          break;
        }
      }
      const remainingOutbox = await idbGetOutbox();
      return { flushed, remaining: remainingOutbox.length, failed };
    }

    async getDailyData(dateStr) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        const seedTasks = this.mockData.dailyTasks[dateStr] || this.mockData.dailyTasks['2026-08-15'] || [];
        const seedEvents = this.mockData.calendarEvents[dateStr] || this.mockData.calendarEvents['2026-08-15'] || [];
        const seedNote = this.mockData.dailyNotes[dateStr] || this.mockData.dailyNotes['2026-08-15'] || `No notes recorded for ${dateStr}.`;

        const adjustedTasks = seedTasks.map(t => ({ ...t, dueDate: dateStr }));
        const adjustedEvents = seedEvents.map(e => ({
          ...e,
          startTime: e.startTime ? e.startTime.replace(/^\d{4}-\d{2}-\d{2}/, dateStr).replace(/Z$/, '') : `${dateStr}T09:00:00`,
          endTime: e.endTime ? e.endTime.replace(/^\d{4}-\d{2}-\d{2}/, dateStr).replace(/Z$/, '') : `${dateStr}T10:00:00`
        }));

        return {
          date: dateStr,
          tasks: adjustedTasks,
          calendarEvents: adjustedEvents,
          noteContent: seedNote
        };
      }

      return new Promise((resolve, reject) => {
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getDailyData(dateStr);
      });
    }

    async getMonthData(monthStr) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        const [y, m] = monthStr.split('-').map(Number);
        const daysInMonth = new Date(y, m, 0).getDate();
        const days = {};
        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = `${monthStr}-${String(day).padStart(2, '0')}`;
          const dayData = await this.getDailyData(dateStr);
          days[dateStr] = {
            tasks: dayData.tasks || [],
            calendarEvents: dayData.calendarEvents || [],
            noteContent: dayData.noteContent || ''
          };
        }
        return { month: monthStr, days };
      }

      return new Promise((resolve, reject) => {
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getMonthData(monthStr);
      });
    }

    async getMasterTasks(monthYearStr) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        return this.mockData.masterTasks;
      }

      return new Promise((resolve, reject) => {
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getMasterTasks(monthYearStr);
      });
    }

    async addDailyTask(dateStr, title, category = 'General') {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        if (!this.mockData.dailyTasks[dateStr]) {
          this.mockData.dailyTasks[dateStr] = [];
        }
        const newTask = {
          id: `t_${Date.now()}`,
          title,
          status: '•',
          category,
          dueDate: dateStr
        };
        this.mockData.dailyTasks[dateStr].push(newTask);
        return newTask;
      }

      if (this.isOnline()) {
        try {
          return await this._runGasCall('addDailyTask', [dateStr, title, category]);
        } catch (err) {
          console.warn('addDailyTask: network call failed, queueing offline', err);
        }
      }
      const tempId = `offline_task_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
      await idbEnqueueMutation(OUTBOX_MUTATION_TYPES.ADD_DAILY_TASK, { dateStr, title, category, tempId });
      return { id: tempId, title, status: '•', category, dueDate: dateStr, _queuedOffline: true };
    }

    async transferMasterTask(masterTaskId, dateStr, priorityGroup = 'A') {
      const masterTask = (this.mockData.masterTasks || []).find(m => m.id === masterTaskId);
      const cleanTitle = masterTask ? masterTask.title : 'Transferred Task';
      const category = masterTask ? masterTask.category : 'General';
      const formattedTitle = `[${priorityGroup.toUpperCase()}1] ${cleanTitle}`;

      return this.addDailyTask(dateStr, formattedTitle, category);
    }

    async getFutureMatrix(year) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        if (!this.mockData.futureMatrix[year]) {
          this.mockData.futureMatrix[year] = emptyYearMatrix(year);
        }
        return this.mockData.futureMatrix[year];
      }
      return this._runGasCall('getFutureMatrix', [year]);
    }

    async addFutureItem(year, monthKey, title, category = 'General') {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        if (!this.mockData.futureMatrix[year]) {
          this.mockData.futureMatrix[year] = emptyYearMatrix(year);
        }
        const matrix = this.mockData.futureMatrix[year];
        if (!matrix.months[monthKey]) matrix.months[monthKey] = [];
        const newItem = createFutureItem(title, category);
        matrix.months[monthKey].push(newItem);
        return newItem;
      }
      return this._runGasCall('addFutureItem', [year, monthKey, title, category]);
    }

    async updateFutureItemStatus(year, monthKey, itemId, status) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        const items = this.mockData.futureMatrix[year]?.months?.[monthKey] || [];
        const item = items.find(i => i.id === itemId);
        if (!item) return null;
        item.status = status;
        return item;
      }
      return this._runGasCall('updateFutureItemStatus', [year, monthKey, itemId, status]);
    }

    async transferFutureItem(year, monthKey, itemId, dateStr, priorityGroup = 'A') {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        const items = this.mockData.futureMatrix[year]?.months?.[monthKey] || [];
        const idx = items.findIndex(i => i.id === itemId);
        if (idx === -1) return null;
        const [item] = items.splice(idx, 1);

        const formattedTitle = `[${priorityGroup.toUpperCase()}1] ${item.title}`;
        return this.addDailyTask(dateStr, formattedTitle, item.category);
      }
      return this._runGasCall('transferFutureItem', [year, monthKey, itemId, dateStr, priorityGroup]);
    }

    async pushFutureItemToNextMonth(year, monthKey, itemId) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        const items = this.mockData.futureMatrix[year]?.months?.[monthKey] || [];
        const idx = items.findIndex(i => i.id === itemId);
        if (idx === -1) return null;
        const [item] = items.splice(idx, 1);

        const nextKey = nextMonthKey(monthKey);
        const nextYear = nextKey.slice(0, 4);
        if (!this.mockData.futureMatrix[nextYear]) {
          this.mockData.futureMatrix[nextYear] = emptyYearMatrix(nextYear);
        }
        const nextMatrix = this.mockData.futureMatrix[nextYear];
        if (!nextMatrix.months[nextKey]) nextMatrix.months[nextKey] = [];
        nextMatrix.months[nextKey].push(item);
        return item;
      }
      return this._runGasCall('pushFutureItemToNextMonth', [year, monthKey, itemId]);
    }

    async updateDailyTask(dateStr, taskId, updates = {}) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        const tasks = this.mockData.dailyTasks[dateStr] || this.mockData.dailyTasks['2026-08-15'] || [];
        const taskIndex = tasks.findIndex(t => t.id === taskId);
        if (taskIndex === -1) return null;

        tasks[taskIndex] = { ...tasks[taskIndex], ...updates };
        this.mockData.dailyTasks[dateStr] = tasks;
        return tasks[taskIndex];
      }

      if (this.isOnline()) {
        try {
          return await this._runGasCall('updateDailyTask', [dateStr, taskId, updates]);
        } catch (err) {
          console.warn('updateDailyTask: network call failed, queueing offline', err);
        }
      }
      await idbEnqueueMutation(OUTBOX_MUTATION_TYPES.UPDATE_DAILY_TASK, { dateStr, taskId, updates });
      return { id: taskId, ...updates, _queuedOffline: true };
    }

    async forwardDailyTask(dateStr, taskId, sourceTaskSnapshot, targetDateStr) {
      const resolvedTargetDate = targetDateStr || (() => {
        const [y, m, d] = dateStr.split('-').map(Number);
        const next = new Date(y, m - 1, d + 1);
        return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
      })();

      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        const tasks = this.mockData.dailyTasks[dateStr] || [];
        const sourceTask = tasks.find(t => t.id === taskId);
        if (!sourceTask) return null;

        const match = (sourceTask.title || '').match(/^\[([A-C])[1-9]\]\s*(.*)$/i);
        const priorityGroup = match ? match[1].toUpperCase() : 'A';
        const cleanTitle = match ? match[2].trim() : (sourceTask.title || 'Untitled Task').trim();
        const formattedTitle = `[${priorityGroup}1] ${cleanTitle}`;

        sourceTask.status = '→';
        const forwardedTask = await this.addDailyTask(resolvedTargetDate, formattedTitle, sourceTask.category);
        return { originalTask: sourceTask, forwardedTask };
      }

      return this._runGasCall('forwardDailyTask', [dateStr, taskId, sourceTaskSnapshot, resolvedTargetDate]);
    }

    async addCalendarEvent(dateStr, eventData = {}) {
      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        if (!this.mockData.calendarEvents[dateStr]) {
          this.mockData.calendarEvents[dateStr] = [];
        }

        const attendeesList = Array.isArray(eventData.attendees)
          ? eventData.attendees
          : (typeof eventData.attendees === 'string'
              ? eventData.attendees.split(/[,;]+/).map(s => s.trim()).filter(Boolean)
              : []);

        const autoGoogleMeet = eventData.autoGoogleMeet !== undefined ? eventData.autoGoogleMeet : true;
        const guestsCanModify = eventData.guestsCanModify !== undefined ? eventData.guestsCanModify : true;
        const autoAgendaDoc = eventData.autoAgendaDoc !== undefined ? eventData.autoAgendaDoc : true;

        const meetLink = autoGoogleMeet
          ? (eventData.meetLink || `https://meet.google.com/${Math.random().toString(36).slice(2, 5)}-${Math.random().toString(36).slice(2, 6)}-${Math.random().toString(36).slice(2, 5)}`)
          : null;

        const agendaDocUrl = autoAgendaDoc
          ? (eventData.agendaDocUrl || `https://docs.google.com/document/create?title=${encodeURIComponent('Agenda: ' + (eventData.title || 'New Appointment'))}`)
          : null;

        let fullDesc = eventData.description || '';
        if (agendaDocUrl && !fullDesc.includes(agendaDocUrl)) {
          fullDesc += (fullDesc ? '\n\n' : '') + `📄 Meeting Agenda Doc: ${agendaDocUrl}`;
        }

        const newEvt = {
          id: `e_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          title: eventData.title || 'New Appointment',
          startTime: eventData.startTime || `${dateStr}T09:00:00`,
          endTime: eventData.endTime || `${dateStr}T09:30:00`,
          location: eventData.location || (meetLink ? 'Google Meet' : ''),
          description: fullDesc,
          meetLink: meetLink,
          agendaDocUrl: agendaDocUrl,
          attendees: attendeesList,
          guestsCanModify: guestsCanModify,
          syncTaskId: eventData.gasTaskId || eventData.syncTaskId || null,
          isCompleted: eventData.isCompleted || false
        };
        this.mockData.calendarEvents[dateStr].push(newEvt);
        return newEvt;
      }

      if (this.isOnline()) {
        try {
          return await this._runGasCall('addCalendarEvent', [dateStr, eventData]);
        } catch (err) {
          console.warn('addCalendarEvent: network call failed, queueing offline', err);
        }
      }
      const tempId = `offline_evt_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
      const attendeesList = Array.isArray(eventData.attendees)
        ? eventData.attendees
        : (typeof eventData.attendees === 'string'
            ? eventData.attendees.split(/[,;]+/).map(s => s.trim()).filter(Boolean)
            : []);
      await idbEnqueueMutation(OUTBOX_MUTATION_TYPES.ADD_CALENDAR_EVENT, { dateStr, eventData, tempId });
      return {
        id: tempId,
        title: eventData.title || 'New Appointment',
        startTime: eventData.startTime || `${dateStr}T09:00:00`,
        endTime: eventData.endTime || `${dateStr}T09:30:00`,
        location: eventData.location || '',
        description: eventData.description || '',
        meetLink: null,
        agendaDocUrl: null,
        attendees: attendeesList,
        guestsCanModify: eventData.guestsCanModify !== undefined ? eventData.guestsCanModify : true,
        syncTaskId: eventData.gasTaskId || eventData.syncTaskId || null,
        isCompleted: eventData.isCompleted || false,
        _queuedOffline: true
      };
    }

  function getLocalDateStr(d = new Date()) {
    if (typeof d === 'string') {
      if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
      d = new Date(d);
    }
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  // Register Alpine component immediately if Alpine is already running (shell DOM-mount scenario),
  // or via alpine:init event if this script loads before Alpine starts (standalone GAS deployment).
  function _registerPlannerApp() {
    Alpine.data('plannerApp', () => ({
      activeView: 'daily',
      selectedDate: getLocalDateStr(),
      selectedYear: new Date().getFullYear(),
      selectedMonth: new Date().getMonth() + 1,
      
      // Data collections
      dailyTasks: [],
