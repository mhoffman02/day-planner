  function parseTaskTitle(rawTitle = '') {
    if (!rawTitle) return { priorityGroup: null, sequence: null, priorityCode: null, cleanTitle: '' };
    const match = rawTitle.match(/^\[([A-C])([1-9])\]\s*(.*)$/i);
    if (match) {
      return {
        priorityGroup: match[1].toUpperCase(),
        sequence: parseInt(match[2], 10),
        priorityCode: `${match[1].toUpperCase()}${match[2]}`,
        cleanTitle: match[3].trim()
      };
    }
    return { priorityGroup: null, sequence: null, priorityCode: null, cleanTitle: rawTitle.trim() };
  }

  function formatTaskTitle(priorityGroup, sequence, cleanTitle) {
    const trimmed = (cleanTitle || '').trim();
    if (priorityGroup && sequence) return `[${priorityGroup.toUpperCase()}${sequence}] ${trimmed}`;
    return trimmed;
  }

  function updateTaskTitleText(oldTitle, newCleanTitle) {
    const parsed = parseTaskTitle(oldTitle);
    const trimmed = (newCleanTitle || '').trim();
    if (!trimmed) return oldTitle;
    return formatTaskTitle(parsed.priorityGroup, parsed.sequence, trimmed);
  }

  function extractTaskDetails(input) {
    if (!input || typeof input !== 'string') return { rawTitle: '', notes: '' };
    const pipeIndex = input.indexOf('|');
    if (pipeIndex === -1) {
      return { rawTitle: input.trim(), notes: '' };
    }
    return {
      rawTitle: input.slice(0, pipeIndex).trim(),
      notes: input.slice(pipeIndex + 1).trim()
    };
  }

  function extractInlinePriority(input, defaultPriority) {
    const fallback = defaultPriority || 'A';
    if (!input) return { priorityGroup: fallback, cleanTitle: '' };
    const trimmed = input.trim();
    const match = trimmed.match(/^#([abcABC])(?:\s*[:-]\s*|\s+|$)(.*)$/);
    if (match) {
      return {
        priorityGroup: match[1].toUpperCase(),
        cleanTitle: match[2].trim()

    };
  }

  function getNextStatus(curr) {
    const idx = STATUS_LIST.indexOf(curr);
    if (idx === -1 || idx === STATUS_LIST.length - 1) return STATUS_LIST[0];
    return STATUS_LIST[idx + 1];
  }

  function filterTasksByStatus(tasks, activeStatuses) {
    if (!tasks || !Array.isArray(tasks)) return [];
    if (!activeStatuses || !Array.isArray(activeStatuses)) return tasks;
    const activeSet = new Set(
      activeStatuses.flatMap(s => (s === 'D/✓' || s === 'Ⓓ') ? ['D/✓', 'Ⓓ'] : [s])
    );
    return tasks.filter(task => {
      const rawStatus = task.status || '•';
      return activeSet.has(rawStatus);
    });
  }

  function filterTasksByDateHorizon(tasks, horizon = 'all', todayStr = getLocalDateStr()) {
    if (!tasks || !Array.isArray(tasks)) return [];
    if (!horizon || horizon === 'all') return tasks;
    const refDate = todayStr || getLocalDateStr();
    return tasks.filter(task => {
      const due = task.dueDate || task.movedTo || null;
      if (horizon === 'future') {
        return Boolean(due && due > refDate);
      }
      if (horizon === 'overdue-today') {
        return Boolean(due && due <= refDate);
      }
      if (horizon === 'undated') {
        return !due;
      }
      return true;
    });
  }

  function getTaskSortValue(task, column) {
    switch (column) {
      case 'priority': {
        const parsed = parseTaskTitle(task.title);
        return parsed.priorityCode || '\uFFFD';
      }
      case 'status': {
        const idx = STATUS_LIST.indexOf(task.status);
        return idx === -1 ? STATUS_LIST.length : idx;
      }
      case 'title': {
        const parsed = parseTaskTitle(task.title);
        const cleanTitle = parsed.cleanTitle || task.title || '';
        return (task.starred ? '★' : '☆') + cleanTitle;
      }
      case 'category':
        return task.category || '';
      case 'dueDate':
        return task.dueDate || '\uFFFF';
      default:
        return '';
    }
  }

  function sortTasksByColumn(tasks = [], column, direction = 'asc') {
    const dir = direction === 'desc' ? -1 : 1;
    return [...tasks]
      .map((task, index) => ({ task, index }))
      .sort((a, b) => {
        const va = getTaskSortValue(a.task, column);
        const vb = getTaskSortValue(b.task, column);
        let cmp;
        if (typeof va === 'number' && typeof vb === 'number') {
          cmp = va - vb;
        } else {
          cmp = String(va).localeCompare(String(vb));
        }
        if (cmp === 0) return a.index - b.index;
        return cmp * dir;
      })
      .map(({ task }) => task);
  }

  function getLocalDateStr(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  const FUTURE_MONTH_KEYS = Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, '0'));

  function monthKeyFor(year, monthNum) {
    return `${year}-${String(monthNum).padStart(2, '0')}`;
  }

  function createFutureItem(title, category = 'General') {
    return {
      id: `fm_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      title,
      category,
      status: '•',
      createdAt: new Date().toISOString()
    };
  }

  function nextMonthKey(monthKey) {
    const [yearStr, monthStr] = monthKey.split('-');
    let year = parseInt(yearStr, 10);
    let month = parseInt(monthStr, 10) + 1;
    if (month > 12) {
      month = 1;
      year += 1;
    }
    return `${year}-${String(month).padStart(2, '0')}`;
  }

  function emptyYearMatrix(year) {
    const months = {};
    FUTURE_MONTH_KEYS.forEach(mm => {
      months[`${year}-${mm}`] = [];
    });
    return { year: String(year), months };
  }

  function extractLocalDateStr(dateVal) {
    if (!dateVal) return '';
    if (typeof dateVal === 'string') {
      const match = dateVal.match(/^(\d{4}-\d{2}-\d{2})/);
      if (match) return match[1];
      const parsed = new Date(dateVal);
      if (isNaN(parsed.getTime())) return '';
      const y = parsed.getFullYear();
      const m = String(parsed.getMonth() + 1).padStart(2, '0');
      const d = String(parsed.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    if (dateVal instanceof Date && !isNaN(dateVal.getTime())) {
      const y = dateVal.getFullYear();
      const m = String(dateVal.getMonth() + 1).padStart(2, '0');
      const d = String(dateVal.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    return '';
  }

  function normalizeCollection(input) {
    if (!input) return [];
    if (Array.isArray(input)) return input;
    if (typeof input === 'object') return Object.values(input).flat();
    return [];
  }

  function flattenSearchResults(results = {}) {
    if (!results) return [];
    return [
      ...(results.calendar || []),
      ...(results.tasks || []),
      ...(results.notes || []),
      ...(results.index || []),
      ...(results.archive || [])
    ];
  }

  function executeUniversalSearch(query = '', store = {}) {
    const cleanQuery = query.trim().toLowerCase();
    const results = {
      totalMatches: 0,
      calendar: [],
      tasks: [],
      notes: [],
      index: [],
      archive: []
    };

    if (!cleanQuery) return results;

    const {
      calendarEvents,
      dailyTasks,
      masterTasks = [],
      dailyNotes,
      indexEntries = [],
      archiveNotes = []
    } = store;

    // 1. Search Calendar Events
    normalizeCollection(calendarEvents).forEach(evt => {
      const titleMatch = (evt.title || '').toLowerCase().includes(cleanQuery);
      const locMatch = (evt.location || '').toLowerCase().includes(cleanQuery);
      const descMatch = (evt.description || '').toLowerCase().includes(cleanQuery);

      if (titleMatch || locMatch || descMatch) {
        const evtDate = evt.date || extractLocalDateStr(evt.startTime);
        results.calendar.push({
          type: 'calendar',
          title: evt.title || 'Untitled Event',
          snippet: evt.location ? `Location: ${evt.location}` : (evt.description || 'Calendar Event'),
          date: evtDate,
          targetView: 'daily',
          item: evt
        });
        results.totalMatches++;
      }
    });

    // 2. Search Tasks (Daily & Master)
    const allTasks = [...normalizeCollection(dailyTasks), ...normalizeCollection(masterTasks)];
    allTasks.forEach(task => {
      const titleMatch = (task.title || '').toLowerCase().includes(cleanQuery);
      const catMatch = (task.category || '').toLowerCase().includes(cleanQuery);
      const notesMatch = (task.notes || '').toLowerCase().includes(cleanQuery);

      if (titleMatch || catMatch || notesMatch) {
        const isMaster = !task.dueDate || task.master;
        results.tasks.push({
          type: 'task',
          title: task.title || 'Untitled Task',
          snippet: task.category ? `Category: ${task.category}` : (task.notes ? `Notes: ${task.notes}` : `Status: ${task.status || 'Open'}`),
          date: task.dueDate || '',
          targetView: isMaster ? 'master-tasks' : 'daily',
          item: task
        });
        results.totalMatches++;
      }
    });

    // 3. Search Daily Notes
    let normalizedNotes = [];
    if (Array.isArray(dailyNotes)) {
      normalizedNotes = dailyNotes.map(n => ({
        date: n.date || '',
        content: n.content || n.noteContent || ''
      }));
    } else if (dailyNotes && typeof dailyNotes === 'object') {
      normalizedNotes = Object.entries(dailyNotes).map(([date, val]) => ({
        date,
        content: typeof val === 'string' ? val : (val?.content || val?.noteContent || '')
      }));
    }

    normalizedNotes.forEach(note => {
      const text = (note.content || '').replace(/\[\[link:[^\]]+\]\]([\s\S]*?)\[\[\/link\]\]/g, '$1');
      if (text.toLowerCase().includes(cleanQuery)) {
        const idx = text.toLowerCase().indexOf(cleanQuery);
        const start = Math.max(0, idx - 20);
        const end = Math.min(text.length, idx + cleanQuery.length + 40);
        const snippet = '...' + text.substring(start, end).replace(/\n/g, ' ') + '...';

        results.notes.push({
          type: 'note',
          title: `Daily Note (${note.date || 'Undated'})`,
          snippet,
          date: note.date || '',
          targetView: 'daily',
          item: note
        });
        results.totalMatches++;
      }
    });

    // 4. Search Monthly Index Entries
    normalizeCollection(indexEntries).forEach(idx => {
      const topicMatch = (idx.topic || '').toLowerCase().includes(cleanQuery);
      const summaryMatch = (idx.summary || '').toLowerCase().includes(cleanQuery);

      if (topicMatch || summaryMatch) {
        results.index.push({
          type: 'index',
          title: `[${idx.topic || 'General'}] ${idx.summary || ''}`,
          snippet: `Topic: ${idx.topic || 'General'}`,
          date: idx.date || '',
          targetView: 'monthly-index',
          item: idx
        });
        results.totalMatches++;
      }
    });

    // 5. Search Historical Archive Notes (if passed in store)
    normalizeCollection(archiveNotes).forEach(arch => {
      const rawContent = arch.content || arch.snippet || '';
      const text = rawContent.replace(/\[\[link:[^\]]+\]\]([\s\S]*?)\[\[\/link\]\]/g, '$1');
      const title = arch.title || '';
      const heading = arch.heading || '';

      if (text.toLowerCase().includes(cleanQuery) || title.toLowerCase().includes(cleanQuery) || heading.toLowerCase().includes(cleanQuery)) {
        const dateStr = arch.date || parseArchiveNoteHeading(heading || title, arch.docName || '');
        const snippet = arch.snippet || extractSearchSnippet(text, cleanQuery);

        results.archive.push({
          type: 'archive',
          title: arch.title || `Archive: Daily Note (${dateStr || 'Undated'})`,
          snippet,
          date: dateStr || '',
          targetView: 'daily',
          docName: arch.docName || '',
          docUrl: arch.docUrl || '',
          item: arch
        });
        results.totalMatches++;
      }
    });

    return results;
  }

  function parseArchiveNoteHeading(heading = '', docTitle = '') {
    const monthMap = {
      january: '01', february: '02', march: '03', april: '04',
      may: '05', june: '06', july: '07', august: '08',
      september: '09', october: '10', november: '11', december: '12'
    };

    const text = (heading || '').trim();

    // 1. Look for ISO date: YYYY-MM-DD
    const isoMatch = text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
    if (isoMatch) {
      return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
    }

    // 2. Look for Month Day, Year
    const monthDayYearMatch = text.match(/([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})/);
    if (monthDayYearMatch) {
      const mName = monthDayYearMatch[1].toLowerCase();
      if (monthMap[mName]) {
        const y = monthDayYearMatch[3];
        const m = monthMap[mName];
        const d = String(monthDayYearMatch[2]).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
    }

    // 3. Fall back to docTitle if it contains Year and Month
    const titleText = (docTitle || '').trim();
    const titleIsoMatch = titleText.match(/\b(\d{4})-(\d{2})\b/);
    if (titleIsoMatch) {
      return `${titleIsoMatch[1]}-${titleIsoMatch[2]}-01`;
    }
    const titleMonthMatch = titleText.match(/([A-Za-z]+)\s+(\d{4})/);
    if (titleMonthMatch) {
      const tmName = titleMonthMatch[1].toLowerCase();
      if (monthMap[tmName]) {
        return `${titleMonthMatch[2]}-${monthMap[tmName]}-01`;
      }
    }

    return '';
  }

  function extractSearchSnippet(content = '', query = '', maxLength = 80) {
    if (!content) return '';
    const cleanContent = content.replace(/\[\[link:[^\]]+\]\]([\s\S]*?)\[\[\/link\]\]/g, '$1');
    if (!query) {
      return cleanContent.length > maxLength
        ? cleanContent.substring(0, maxLength).replace(/\n/g, ' ') + '...'
        : cleanContent.replace(/\n/g, ' ');
    }

    const lowerContent = cleanContent.toLowerCase();
    const lowerQuery = query.toLowerCase();
    const idx = lowerContent.indexOf(lowerQuery);

    if (idx === -1) {
      return cleanContent.length > maxLength
        ? cleanContent.substring(0, maxLength).replace(/\n/g, ' ') + '...'
        : cleanContent.replace(/\n/g, ' ');
    }

    const start = Math.max(0, idx - 25);
    const end = Math.min(cleanContent.length, idx + query.length + 45);
    const prefix = start > 0 ? '...' : '';
    const suffix = end < cleanContent.length ? '...' : '';
    return (prefix + cleanContent.substring(start, end).replace(/\n/g, ' ') + suffix).trim();
  }

  function mergeArchiveSearchResults(searchResults = {}, archiveItems = []) {
    const merged = {
      calendar: searchResults.calendar || [],
      tasks: searchResults.tasks || [],
      notes: searchResults.notes || [],
      index: searchResults.index || [],
      archive: []
    };

    const localNoteDates = new Set(merged.notes.map(n => n.date).filter(Boolean));
    const seenArchiveKeys = new Set();

    (archiveItems || []).forEach(item => {
      if (!item) return;
      if (item.date && localNoteDates.has(item.date)) {
        return;
      }
      const key = `${item.date || ''}_${item.snippet || ''}`;
      if (!seenArchiveKeys.has(key)) {
        seenArchiveKeys.add(key);
        merged.archive.push({
          type: 'archive',
          title: item.title || `Archive: Daily Note (${item.date || 'Undated'})`,
          snippet: item.snippet || '',
          date: item.date || '',
          targetView: item.targetView || 'daily',
          docName: item.docName || '',
          docUrl: item.docUrl || '',
          item
        });
      }
    });

    merged.totalMatches = merged.calendar.length + merged.tasks.length + merged.notes.length + merged.index.length + merged.archive.length;
    return merged;
  }

  // Fail-closed save helpers, mirrored from src/saveGuard.js. Keep both copies in sync
  // (tests/failClosedSaves.test.js runs every caller against both client copies).
  // A missing bridge method is a failed save; a null update result means nothing was written;
  // a rollback only restores a field that still holds the value the failed write set.
  async function dpCallBridge(bridge, candidates, what) {
    for (const [name, args] of candidates) {
      if (bridge && typeof bridge[name] === 'function') {
        return bridge[name](...args);
      }
    }
    const names = candidates.map(([name]) => name).join(' / ');
    throw new Error('Not saved: ' + what + ' -- server method ' + names + ' is unavailable in this build.');
  }

  function dpRequireSaved(result, what) {
    if (result === null || result === undefined) {
      throw new Error('Not saved: ' + what + ' -- the item no longer exists in Google (deleted elsewhere?). Reload to refresh.');
    }
    return result;
  }

  function dpRestoreIfUnchanged(obj, field, wrote, previous) {
    if (!obj || obj[field] !== wrote) return false;
    obj[field] = previous;
    return true;
  }

  const DP_SHORT_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function dpFormatSyncedAt(syncedAt) {
    if (!syncedAt) return 'unknown';
    const d = new Date(syncedAt);
    if (isNaN(d.getTime())) return 'unknown';
    const h = d.getHours();
    const mm = String(d.getMinutes()).padStart(2, '0');
    return DP_SHORT_MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + (h % 12 || 12) + ':' + mm + ' ' + (h < 12 ? 'AM' : 'PM');
  }

  function dpStaleNoticeText(label, syncedAt, err) {
    const reason = (err && err.message) || String(err);
    return label + ': showing offline copy (last synced ' + dpFormatSyncedAt(syncedAt) + '). Refresh failed: ' + reason;
  }

  // Per-item save serializer, mirrored from src/saveGuard.js createSaveQueue (keep in sync).
  /**
   * Per-item save serializer. Saves submitted under the same key run one at a time, in order;
   * while one is in flight, newer submits only replace the queued value (latest wins, superseded
   * intermediate values are skipped). Tracks the last value the server confirmed per key, so a
   * failure rolls back to it -- never to an earlier unconfirmed value.
   *
   * submit(key, job) where job = { value, baseline, write(value), onSaved(value, result, hasNewer),
   * onFailed(err, lastConfirmed) }:
   *   - baseline: the value currently known to be saved; adopted as lastConfirmed when the key is
   *     idle (after an idle period the UI holds the confirmed or reloaded server value);
   *   - write: performs the save, throws on failure;
   *   - onSaved runs after every confirmed write (hasNewer is true when a newer value is queued, so
   *     the caller must not cache live state as saved yet);
   *   - onFailed runs only when the LATEST value failed (nothing newer queued). A failure that is
   *     superseded by a queued value is logged and the queued value is sent instead.
   * Returns the drain promise for the submit that started it; a coalesced submit resolves at once
   * (the in-flight drain will send its value), so callers never deadlock on their own queue.
   */
  function dpCreateSaveQueue() {
    const items = new Map();
    // Monotonic clock over submits and confirmations, so a server read can tell which local
    // values it may predate.
    let clock = 0;

    async function drain(item) {
      while (item.pending) {
        const job = item.pending;
        item.pending = null;
        let result;
        item.writing = true;
        try {
          result = await job.write(job.value);
        } catch (err) {
          item.writing = false;
          if (item.pending) {
            console.error(`🔥 save ${item.key}: write failed but a newer value is queued; sending that instead of rolling back:`, err.stack);
            continue;
          }
          await job.onFailed(err, item.confirmed);
          continue;
        }
        item.writing = false;
        item.confirmed = job.value;
        item.confirmedAt = ++clock;
        if (job.onSaved) await job.onSaved(job.value, result, Boolean(item.pending));
      }
    }

    return {
      submit(key, job) {
        let item = items.get(key);
        if (!item) {
          item = { key, confirmed: job.baseline, confirmedAt: 0, submittedAt: 0, latest: undefined, pending: null, running: null, writing: false };
          items.set(key, item);
        }
        if (!item.running) {
          item.confirmed = job.baseline;
          item.confirmedAt = clock;
        }
        item.submittedAt = ++clock;
        item.latest = job.value;
        item.pending = job;
        if (item.running) return Promise.resolve();
        item.running = drain(item).finally(() => { item.running = null; });
        return item.running;
      },
      /** @returns {number} A marker to take just before a server read starts (see reconcile). */
      mark() {
        return clock;
      },
      /**
       * Reconciles one item of a reloaded copy with the queue. mark: mark() taken before a SERVER
       * read, or null when the copy is not a fresh server read (the local cache), which is then
       * never adopted as confirmed. keepLocal: the local value must stay on screen (a value is
       * queued or being written, or was submitted or confirmed after the read began). confirmed: the value
       * known to be saved, for the cache; the server value is adopted as the rollback target
       * unless a save confirmed after the read began (the read may predate it).
       */
      reconcile(key, incomingValue, mark) {
        const item = items.get(key);
        if (!item) return { keepLocal: false, confirmed: incomingValue };
        const unsaved = Boolean(item.pending) || item.writing;
        if (mark === null || mark === undefined) return { keepLocal: unsaved, confirmed: item.confirmed };
        if (item.confirmedAt <= mark) item.confirmed = incomingValue;
        return { keepLocal: unsaved || item.submittedAt > mark || item.confirmedAt > mark, confirmed: item.confirmed };
      },
      /** @returns {*} The most recently submitted value for key (undefined if never submitted). */
      latest(key) {
        const item = items.get(key);
        return item ? item.latest : undefined;
      },
      /** @returns {boolean} True while a save for key is in flight. */
      busy(key) {
        const item = items.get(key);
        return Boolean(item && item.running);
      },
      /** @returns {boolean} True while a value for key is queued or being written (not yet confirmed or failed). */
      unsaved(key) {
        const item = items.get(key);
        return Boolean(item && (item.pending || item.writing));
      },
      /** @returns {*} The last value the server confirmed for key (undefined if never submitted). */
      confirmed(key) {
        const item = items.get(key);
        return item ? item.confirmed : undefined;
      },
      /**
       * Drops the queued (not yet sent) value for key, e.g. because the item is being deleted. An
       * in-flight write is not affected (await idle(key) for it). Returns true when one was dropped.
       */
      cancel(key) {
        const item = items.get(key);
        if (!item || !item.pending) return false;
        item.pending = null;
        return true;
      },
      /**
       * Settles once nothing for key is queued or in flight. A failure of that drain belongs to
       * its own submitter; here it is logged and the wait still ends.
       */
      idle(key) {
        const item = items.get(key);
        if (!item || !item.running) return Promise.resolve();
        return item.running.then(() => undefined, (err) => {
          console.error(`🔥 save ${key}: its save handler threw (reported to its own caller); continuing after it settled:`, (err && err.stack) || String(err));
        });
      }
    };
  }

  // Daily data cache, mirrored from src/dailyDataCache.js. Keep both copies in sync. Memory-first
  // Map cache keyed by date, with IndexedDB persistence behind it, probed lazily and falling back
  // to memory-only (with a loud console warning) if IndexedDB is blocked. A single open() call
  // inside this app’s own sandboxed userCodeAppPanel iframe was observed once to never fire
  // either onsuccess or onerror (root cause unconfirmed); not reproduced since, but a bounded
  // timeout is cheap insurance against that failure mode regardless of cause.
  const DP_CACHE_DB_NAME = 'day-planner-cache';
  const DP_CACHE_DB_VERSION = 3;
  const DP_CACHE_STORE_NAME = 'dailyData';
  const DP_CACHE_STORE_MASTER_TASKS = 'masterTasks';
  const DP_CACHE_STORE_FUTURE_MATRIX = 'futureMatrix';
  const DP_CACHE_STORE_NOTE_REVISIONS = 'noteRevisions';
  const DP_CACHE_MASTER_TASKS_KEY = 'all';
  const DP_CACHE_IDB_OPEN_TIMEOUT_MS = 2000;

  let dpCacheMemory = new Map();
  let dpMasterTasksMemory = null;
  let dpFutureMatrixMemory = new Map();
  let dpNoteRevisionsMemory = new Map();
  let dpCacheDbPromise = null;

  function dpCacheCloneForStorage(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function dpCacheOpenDb() {
    if (dpCacheDbPromise) return dpCacheDbPromise;
    dpCacheDbPromise = new Promise((resolve) => {
      if (typeof indexedDB === 'undefined') {
        resolve(null);
        return;
      }

      let settled = false;
      const timeoutId = setTimeout(() => {
        if (settled) return;
        settled = true;
        console.warn('[dailyDataCache] IndexedDB open timed out after ' + DP_CACHE_IDB_OPEN_TIMEOUT_MS + 'ms (likely blocked in this iframe/context); falling back to memory-only cache for this session.');
        resolve(null);
      }, DP_CACHE_IDB_OPEN_TIMEOUT_MS);

      try {
        const req = indexedDB.open(DP_CACHE_DB_NAME, DP_CACHE_DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(DP_CACHE_STORE_NAME)) {
            db.createObjectStore(DP_CACHE_STORE_NAME, { keyPath: 'date' });
          }
          if (!db.objectStoreNames.contains(DP_CACHE_STORE_MASTER_TASKS)) {
            db.createObjectStore(DP_CACHE_STORE_MASTER_TASKS, { keyPath: 'key' });
          }
          if (!db.objectStoreNames.contains(DP_CACHE_STORE_FUTURE_MATRIX)) {
            db.createObjectStore(DP_CACHE_STORE_FUTURE_MATRIX, { keyPath: 'year' });
          }
          if (!db.objectStoreNames.contains(DP_CACHE_STORE_NOTE_REVISIONS)) {
            db.createObjectStore(DP_CACHE_STORE_NOTE_REVISIONS, { keyPath: 'date' });
          }
        };
        req.onsuccess = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          const db = req.result;
          db.onversionchange = () => { db.close(); };
          resolve(db);
        };
        req.onerror = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          console.warn('[dailyDataCache] IndexedDB open failed, falling back to memory-only cache for this session:', req.error);
          dpCacheDbPromise = null;
          resolve(null);
        };
        req.onblocked = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          console.warn('[dailyDataCache] IndexedDB open blocked by another open tab/connection at an older version; falling back to memory-only cache for this session.');
          dpCacheDbPromise = null;
          resolve(null);

        if (!settled) {
          settled = true;
          clearTimeout(timeoutId);
          console.error('[dailyDataCache] IndexedDB open threw, falling back to memory-only cache for this session:', err.stack);
          dpCacheDbPromise = null;

    if (!e) return 'unknown IndexedDB error';
    return (e.name ? e.name + ': ' : '') + (e.message || String(e));

  // Mirrors persistToIdb in src/dailyDataCache.js. Quota/constraint failures arrive as an async
  // transaction error/abort event, never through a sync try, so those handlers are what make a
  // failed persist visible. Resolves true on commit, false when IDB is unavailable, rejects on
  // error/abort; the rejection is always logged here so fire-and-forget callers stay safe.
  function dpCachePersist(storeName, op, context) {
    const result = dpCacheOpenDb().then((db) => {
      if (!db) return false;
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        let settled = false;
        const fail = () => {
          if (settled) return;
          settled = true;
          reject(new Error('IndexedDB ' + context + ' failed (' + dpDescribeIdbError(tx.error) + ')'));
        };
        tx.oncomplete = () => {
          if (settled) return;
          settled = true;
          resolve(true);
        };
        tx.onerror = fail;
        tx.onabort = fail;
        op(tx.objectStore(storeName));
      });
    });
    result.then(null, (err) => {
      console.error('[dailyDataCache] ' + context + ' NOT persisted - memory cache only, lost on reload:', (err && err.stack) || dpDescribeIdbError(err));
    });
    return result;
  }

  // otherwise carried forward, so a local write-through never looks like a fresh sync.
  function dpSetCached(dateStr, data, opts) {
    const prev = dpCacheMemory.get(dateStr);

    const entry = dpCacheCloneForStorage(Object.assign({}, data, { date: dateStr, syncedAt: syncedAt }));
    dpCacheMemory.set(dateStr, entry);
    return dpCachePersist(DP_CACHE_STORE_NAME, (store) => store.put(entry), 'put dailyData ' + dateStr);

  function dpPrimeFromRange(days) {

          req.onsuccess = () => {

          req.onerror = () => {
            console.error('[dailyDataCache] IDB get failed for', dateStr, '- treating as cache miss:', dpDescribeIdbError(req.error));
            resolve(null);

  function dpSaveNoteRevision(dateStr, noteContent) {
    if (!dateStr || noteContent === undefined || noteContent === null) return [];
    const text = String(noteContent);
    if (!text.trim()) return dpNoteRevisionsMemory.get(dateStr) || [];

    const existing = dpNoteRevisionsMemory.get(dateStr) || [];
    if (existing.length > 0 && existing[0].noteContent === text) {
      return existing;
    }

    const topicCount = Math.max(1, (text.match(/^##\s+/gm) || []).length);
    const revision = {
      timestamp: Date.now(),
      noteContent: text,
      cardCount: topicCount,
      charCount: text.length
    };

    const updated = [revision, ...existing];
    if (updated.length > 30) updated.length = 30;
    dpNoteRevisionsMemory.set(dateStr, updated);

    const entry = dpCacheCloneForStorage({ date: dateStr, revisions: updated });
    dpCachePersist(DP_CACHE_STORE_NOTE_REVISIONS, (store) => store.put(entry), 'put noteRevisions ' + dateStr);

    return updated;

  // repo’s timezone-safety rule. Returns YYYY-MM-DD keys from centerDateStr - radiusDays through
  // centerDateStr + radiusDays, inclusive, in ascending order.
  function dpBuildDateWindow(centerDateStr, radiusDays) {
    const parts = centerDateStr.split('-').map(Number);
    const y = parts[0], m = parts[1], d = parts[2];
    const dates = [];
    for (let delta = -radiusDays; delta <= radiusDays; delta++) {
      const dt = new Date(y, m - 1, d + delta);
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      dates.push(dt.getFullYear() + '-' + mm + '-' + dd);
    }
    return dates;
  }

  function formatCutoffCountdown(cutoffIso, nowMs) {
    const now = nowMs === undefined ? Date.now() : nowMs;
    const t = new Date(cutoffIso).getTime();
    if (!cutoffIso || Number.isNaN(t)) return 'No cutoff';
    const diffMin = Math.round((t - now) / 60000);
    if (diffMin === 0) return 'now';
    const abs = Math.abs(diffMin);
    const days = Math.floor(abs / 1440);
    const hours = Math.floor((abs % 1440) / 60);
    const mins = abs % 60;
    let span;
    if (days > 0) span = days + ' d ' + hours + ' h';
    else if (hours > 0) span = hours + ' h ' + mins + ' min';
    else span = mins + ' min';
    return diffMin > 0 ? 'in ' + span : 'passed ' + span + ' ago';
  }

      if (this.useMock || typeof window === 'undefined' || !window.google?.script?.run) {
        if (!url || typeof url !== 'string') return { success: false, error: 'No URL provided.' };
        const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
        if (!idMatch) return { success: false, error: 'Not a recognized Drive URL.' };
        const fileId = idMatch[1];
        let title = 'Document Title';
        if (url.includes('spreadsheets')) title = 'Financial Planning Spreadsheet';
        else if (url.includes('presentation')) title = 'Architecture Slide Deck';
        else if (url.includes('document')) title = 'Executive Briefing Doc';
        else if (url.includes('folders')) title = 'Shared Drive Folder';
        return { success: true, title, fileId };
      }

      return new Promise((resolve, reject) => {
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .resolveDriveFileTitle(url);
      });

            var parsed = JSON.parse(saved);

              this.recentCategories = parsed.filter(function(c) { return typeof c === 'string' && c.trim(); }).slice(0, 20);
              return;
            }
          }
        } catch (e) {
          console.error('initCategories: localStorage read/parse failed, using default categories', e.stack);
        }
        this.recentCategories = defaultCategories;
      },

      initUiZoom() {
        try {
          const saved = parseInt(localStorage.getItem('dayPlannerUiZoom'), 10);
          if (saved >= 80 && saved <= 150) this.uiZoom = saved;
        } catch (e) {
          console.error('initUiZoom: could not load saved UI zoom, keeping default', e.stack);
        }
      },

      // A- / A+ buttons: step through the standard browser zoom stops.
      stepUiZoom(dir) {
        const stops = [80, 90, 100, 110, 125, 150];
        const cur = this.uiZoom;
        const next = dir > 0 ? stops.find(v => v > cur) : [...stops].reverse().find(v => v < cur);
        if (next !== undefined) this.setUiZoom(next);
      },

      setUiZoom(value) {
        const n = Math.round(Number(value));
        this.uiZoom = Math.min(150, Math.max(80, isNaN(n) ? 100 : n));
        try {
          localStorage.setItem('dayPlannerUiZoom', String(this.uiZoom));
        } catch (e) {
          console.error('setUiZoom: could not persist UI zoom, applied for this session only', e.stack);
        }
      },

      initColumnWidths() {
        try {
          const saved = localStorage.getItem('dayPlannerColumnWidths');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length === 3 && parsed.every(n => typeof n === 'number' && n >= 15 && n <= 70)) {
              const sum = parsed.reduce((a, b) => a + b, 0);
              this.colWidths = parsed.map(w => (w / sum) * 100);
            }
          }
        } catch (e) {
          console.error('initColumnWidths: could not load saved column widths, keeping defaults', e.stack);
        }
      },

      resetColumnWidths() {
        this.colWidths = [33.33, 33.33, 33.34];
        try {
          localStorage.removeItem('dayPlannerColumnWidths');
        } catch (e) {
          console.error('resetColumnWidths: could not clear saved widths, old widths may return on reload', e.stack);
        }
      },

      toggleMaximizeColumn(name) {
        this.maximizedColumn = this.maximizedColumn === name ? null : name;
      },

      initResize(resizerIdx, event) {
        if (this.maximizedColumn) return;
        if (event.type === 'mousedown' && event.button !== 0) return;
        event.preventDefault();

        const spreadEl = event.currentTarget.closest('.two-page-spread');
        if (!spreadEl) return;

        const rect = spreadEl.getBoundingClientRect();
        const resizersTotalPx = 32;
        const availableWidth = rect.width - resizersTotalPx;
        if (availableWidth <= 0) return;

        const startX = event.touches ? event.touches[0].clientX : event.clientX;
        const startWidths = [...this.colWidths];
        this.isResizing = true;
        this.activeResizerIndex = resizerIdx;

        const minPercent = 15;

        const onPointerMove = (e) => {
          if (!this.isResizing) return;
          const currentX = e.touches ? e.touches[0].clientX : e.clientX;
          const deltaPx = currentX - startX;
          const deltaPercent = (deltaPx / availableWidth) * 100;

          const newWidths = [...startWidths];

          if (resizerIdx === 1) {
            let w1 = startWidths[0] + deltaPercent;
            let w2 = startWidths[1] - deltaPercent;

            if (w1 < minPercent) {
              w1 = minPercent;
              w2 = startWidths[0] + startWidths[1] - minPercent;
            } else if (w2 < minPercent) {
              w2 = minPercent;
              w1 = startWidths[0] + startWidths[1] - minPercent;
            }
            newWidths[0] = w1;
            newWidths[1] = w2;
          } else if (resizerIdx === 2) {
            let w2 = startWidths[1] + deltaPercent;
            let w3 = startWidths[2] - deltaPercent;

            if (w2 < minPercent) {
              w2 = minPercent;
              w3 = startWidths[1] + startWidths[2] - minPercent;
            } else if (w3 < minPercent) {
              w3 = minPercent;
              w2 = startWidths[1] + startWidths[2] - minPercent;
            }
            newWidths[1] = w2;
            newWidths[2] = w3;
          }

          this.colWidths = newWidths;
        };

        const onPointerUp = () => {
          if (!this.isResizing) return;
          this.isResizing = false;
          this.activeResizerIndex = null;
          window.removeEventListener('mousemove', onPointerMove);
          window.removeEventListener('mouseup', onPointerUp);
          window.removeEventListener('touchmove', onPointerMove);
          window.removeEventListener('touchend', onPointerUp);

          try {
            localStorage.setItem('dayPlannerColumnWidths', JSON.stringify(this.colWidths));
          } catch (e) {
            console.error('initResize: could not persist column widths, applied for this session only', e.stack);
          }
        };

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp);
      },

      initTheme() {
        try {
          const saved = localStorage.getItem('dayPlannerTheme');
          if (saved) {
            this.theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            this.theme = 'dark';
          } else {
            this.theme = 'light';
          }
        } catch (e) {
          console.error('initTheme: theme lookup failed, falling back to light theme', e.stack);
          this.theme = 'light';
        }
        this.applyTheme();
      },

      toggleTheme() {
        this.theme = this.theme === 'dark' ? 'light' : 'dark';
        try {
          localStorage.setItem('dayPlannerTheme', this.theme);
        } catch (e) {
          console.error('toggleTheme: could not persist theme, applied for this session only', e.stack);
        }
        this.applyTheme();
      },

      applyTheme() {
        document.documentElement.setAttribute('data-theme', this.theme);
        document.documentElement.style.colorScheme = this.theme;
      },

      setupKeyboardShortcuts() {
        window.addEventListener('keydown', (e) => {
          const keyLower = e.key ? e.key.toLowerCase() : '';
          const isAlt = e.altKey && !e.ctrlKey && !e.metaKey;
          const isCtrlShift = (e.ctrlKey || e.metaKey) && e.shiftKey;

          if (isAlt || isCtrlShift) {
            if (keyLower === 'a' || keyLower === 'b' || keyLower === 'c') {
              e.preventDefault();
              const group = keyLower.toUpperCase();
              if (this.activeView === 'master-tasks') {
                this.newMasterTaskPriorityGroup = group;
                this.focusMasterTaskInput();
              } else {
                this.newTaskPriorityGroup = group;
                this.focusTaskInput();
              }
            }
          }

          const isInputFocused = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable);

          if ((e.ctrlKey || e.metaKey) && e.altKey && keyLower === 's') {
            e.preventDefault();
            if (e.target && e.target.id === 'evtDescInput') {
              this.toggleDictation(e.target);
            } else if (e.target && e.target.id && e.target.id.indexOf('card-line-') === 0) {
              this.toggleDictation(e.target);
            } else if (this.eventModalOpen) {
              const el = document.getElementById('evtDescInput');
              if (el) this.toggleDictation(el);
            } else {
              this.startDictationOnDefaultLine();
            }
            return;
          }

          if ((e.ctrlKey || e.metaKey) && keyLower === 'k') {
            if (!isInputFocused) {
              e.preventDefault();
              this.toggleSearchModal();
            }
          } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && keyLower === 'f') {
            e.preventDefault();
            this.toggleSearchModal();
          } else if ((e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key === '/')) && !isInputFocused) {
            e.preventDefault();
            this.toggleSearchModal();
          } else if (keyLower === 't' && !e.ctrlKey && !e.metaKey && !e.altKey && !isInputFocused && !this.isMonthlyView && this.activeView !== 'master-tasks') {
            e.preventDefault();
            this.jumpToToday();
          } else if (e.key === 'Escape') {
            if (this.dayPickerOpen) {
              e.preventDefault();
              this.closeDayPicker();
            } else if (this.masterTaskDuePickerOpen) {
              e.preventDefault();
              this.closeMasterTaskDuePicker();
            } else if (this.monthPickerOpen) {
              e.preventDefault();
              this.closeMonthPicker();
            } else if (this.linkModalOpen) {
              e.preventDefault();
              this.closeLinkModal();
            } else if (this.timeMachineOpen) {
              e.preventDefault();
              this.closeTimeMachine();
            } else if (this.searchModalOpen) {
              e.preventDefault();
              this.closeSearchModal();
            } else if (this.eventModalOpen) {
              e.preventDefault();
              this.closeEventModal();
            } else if (this.createEventModalOpen) {
              e.preventDefault();
              this.closeCreateEventModal();
            } else if (this.installModalOpen) {
              e.preventDefault();
              this.closeInstallModal();
            } else if (this.maximizedColumn) {
              e.preventDefault();
              this.maximizedColumn = null;
            }
          }
        });
      },

      focusTaskInput() {
        const input = document.querySelector('.task-input-field');
        if (input) {
          input.focus();
        }
      },

      focusMasterTaskInput() {
        const input = document.querySelector('.master-task-title-input');
        if (input) {
          input.focus();
        }
      },

      // Files (or replaces) the tray entry for key. message is user-facing (err.message only,
      // never a stack). opts.retry: a function re-running the failed operation; opts.kind:
      // error (default) or stale (informational offline-copy notice).
      reportError(key, message, opts = {}) {
        if (!key) throw new Error('reportError: a key is required');
        this.errorTraySeq += 1;
        const rest = (this.errorTray || []).filter(e => e.key !== key);
        this.errorTray = [{ key, message: String(message), kind: opts.kind || 'error', seq: this.errorTraySeq, retry: opts.retry || null }, ...rest];
      },

      resolveError(key) {
        if (!(this.errorTray || []).some(e => e.key === key)) return;
        this.errorTray = this.errorTray.filter(e => e.key !== key);
      },

      resolveErrorsWithPrefix(prefix) {
        if (!(this.errorTray || []).some(e => e.key.startsWith(prefix))) return;
        this.errorTray = this.errorTray.filter(e => !e.key.startsWith(prefix));
      },

      dismissError(key) {
        this.resolveError(key);
        if (this.errorTray.length <= 3) this.errorTrayExpanded = false;
      },

      // Runs the retry stored on the entry. The entry stays until the operation itself succeeds (resolves
      // it) or fails again (replaces it), so a failing retry is never shown as fixed.
      async retryError(key) {
        const entry = (this.errorTray || []).find(e => e.key === key);
        if (!entry || typeof entry.retry !== 'function') return;
        try {
          await entry.retry();
        } catch (err) {
          console.error(`🔥 retry of "${key}" threw; entry kept with the new error:`, err.stack);
          this.reportError(key, `Retry failed: ${err.message || err.toString()}`, { retry: entry.retry });
        }
      },

      // Stale/offline indicator: a load that fell back to cached data files a stale tray entry
      // under the key of the load, with the time the cached copy last matched the server. The next
      // successful load with the same key resolves it.
      showStaleNotice(key, label, cachedEntry, err) {
        this.reportError(key, dpStaleNoticeText(label, cachedEntry && cachedEntry.syncedAt, err), { kind: 'stale' });
      },

      async trigger2WaySync() {
        this.isSyncing = true;
        // A sync success resolves only sync* tray entries: callers run this right after a write,
        // and wiping other entries would hide a failure reported just before (fail-silent).

        try {
          await new Promise(r => setTimeout(r, 400)); // Visual indicator

          // Option A: Tasks remain strictly in Tasks; only update existing linked calendar events
          this.dailyTasks.forEach(task => {
            const isDone = task.status === '✓' || task.status === 'Ⓓ';
            const matchEvt = this.calendarEvents.find(e => e.syncTaskId === task.id);
            if (matchEvt) {
              matchEvt.title = isDone ? `[✓] ${parseTaskTitle(task.title).cleanTitle}` : task.title;
            }
          });

          this.buildScheduleGrid();
          this.resolveErrorsWithPrefix('sync');
        } catch (err) {
          console.error('🔥 trigger2WaySync error:', err.stack);
          this.reportError('sync', `2-Way Sync Warning: ${err.message || err.toString()}`, { retry: () => this.trigger2WaySync() });
        } finally {
          this.isSyncing = false;
        }
      },

      async setView(viewName) {
        this.activeView = viewName;
        if (viewName === 'monthly-calendar') {
          await this.loadMonthlyCalendarData();
        }
        if (viewName === 'future-matrix') {
          await this.loadFutureMatrix();
        }
        if (viewName === 'master-tasks') {
          await this.loadMasterTasks();
        }
        if (viewName === 'triage' && this.showTriageNav) {
          // Board from the background prefetch is fresh for 2 minutes; Refresh always reloads.
          if (this.triageStale || Date.now() - this.triageSavedAt > TRIAGE_FRESH_MS) await this.loadTriageBoard();
        }
        if (viewName === 'meetingPrep' && this.showMeetingPrepNav) {
          await this.loadMeetingPrep();
        }
      },

      // ---- Gmail / Meeting Hub ----
      get showTriageNav() {
        return isHubViewVisible('triage', this.hubFlags);
      },

      get showMeetingPrepNav() {
        return isHubViewVisible('meetingPrep', this.hubFlags);
      },

      get triageQueueList() {
        const queues = (this.triageBoard && this.triageBoard.queues) || {};
        return QUEUE_ORDER.map((key) => ({
          key,
          title: QUEUE_TITLES[key],
          items: (queues[key] || []).filter((t) => this.showReadLater || !this.triageReadLater.includes(t.threadId))
        }));
      },

      get triageStatusText() {
        const age = this.triageSavedAt ? 'Saved ' + this.hubAgeText(this.triageSavedAt) : '';
        if (this.triageLoading) return this.triageStale && age ? age + ' · Refreshing…' : (this.triageItemCount ? 'Refreshing…' : 'Loading…');
        return this.triageStale && age ? age + ' · not updated' : '';
      },

      hubAgeText(ms) {
        const min = Math.max(0, Math.floor((this.hubNowMs - ms) / 60000));
        if (min < 1) return 'just now';
        return min < 60 ? min + ' min ago' : Math.floor(min / 60) + ' h ago';
      },

      get triageItemCount() {
        return this.triageQueueList.reduce((n, q) => n + q.items.length, 0);
      },

      hubBand(score) { return scoreBandLabel(score); },
      hubLedgerLabel(status) { return ledgerStatusLabel(status); },
      hubCanRetry(status) { return canRetryLedger(status); },
      hubCountdown(iso) { return formatCutoffCountdown(iso, this.hubNowMs); },

      get hubTrialBannerVisible() {
        const onHubView = (this.activeView === 'triage' && this.showTriageNav) || (this.activeView === 'meetingPrep' && this.showMeetingPrepNav);
        return this.hubDryRun && onHubView && this.hubTrialHiddenOn !== getLocalDateStr();
      },

      get hubTrialRun() {
        const r = this.hubLastRun;
        if (!r || r.status !== 'DRY_RUN' || !r.counts) return null;
        return { at: String(r.at || '').replace('T', ' ').slice(0, 16), processed: r.counts.processed || 0, skipped: r.counts.skipped || 0 };
      },

      // Sent with every Triage write: the server refuses (MODE_CHANGED) when the Sheet mode differs from the screen.
      hubModeOpts() { return { expectDryRun: this.hubDryRun }; },

      toggleSnippet(threadId) {
        this.hubSnippetOpenId = this.hubSnippetOpenId === threadId ? '' : threadId;
      },

      hideTrialBannerToday() {
        this.hubTrialHiddenOn = getLocalDateStr();
        try {
          localStorage.setItem('dayPlannerTrialBannerHiddenOn', this.hubTrialHiddenOn);
        } catch (err) {
          console.error('hideTrialBannerToday: could not save to localStorage, the banner returns on reload:', err.stack);
        }
      },

      openGoLive(ev) {
        this.goLive = { open: true, busy: false, opener: (ev && ev.currentTarget) || null };
        this.$nextTick(() => { if (this.$refs.goLiveCancel) this.$refs.goLiveCancel.focus(); });
      },

      closeGoLive() {
        if (this.goLive.busy) return;
        const opener = this.goLive.opener;
        this.goLive = { open: false, busy: false, opener: null };
        if (opener && opener.isConnected) opener.focus();
      },

      async setTrialMode(on) {
        const r = await this.bridge.hubSetFeature('DRY_RUN', on);
        if (!r || r.ok !== true) throw new Error((r && r.message) || 'The Hub Config Sheet could not be updated');
        await this.loadHubStatus();
        if (this.hubDryRun !== on) throw new Error('The Hub Config Sheet still shows the old mode. Refresh and try again.');
        if (this.activeView === 'triage' && this.showTriageNav) await this.loadTriageBoard();
      },

      showHubModeSnack(text, undo) {
        clearTimeout(this.hubModeSnackTimer);
        this.hubModeSnack = { text, undo: !!undo };
        this.hubModeSnackTimer = setTimeout(() => { this.hubModeSnack = null; }, 10000);
      },

      async confirmGoLive() {
        this.goLive.busy = true;
        try {
          await this.setTrialMode(false);
          this.resolveError('hub-mode');
          this.showHubModeSnack('Trial mode is off.', true);
          // The banner (the opener) is now hidden, so focus goes to Undo instead.
          this.goLive.opener = null;
          this.$nextTick(() => { if (this.$refs.hubModeUndo) this.$refs.hubModeUndo.focus(); });
        } catch (err) {
          console.error('Go live failed, trial mode stays on:', err.stack);
          this.reportError('hub-mode', 'Could not turn off trial mode: ' + (err.message || err));
        } finally {
          this.goLive.busy = false;
          this.closeGoLive();
        }
      },

      async switchToTrial() {
        clearTimeout(this.hubModeSnackTimer);
        this.hubModeSnack = null;
        try {
          await this.setTrialMode(true);
          this.resolveError('hub-mode');
          this.showHubModeSnack('Trial mode is on. Nothing changes in Gmail, Tasks or Docs.', false);
        } catch (err) {
          console.error('Switch to trial failed, the hub stays live:', err.stack);
          this.reportError('hub-mode', 'Could not turn on trial mode: ' + (err.message || err));
        }
      },

      async refreshTriage() {
        await this.loadHubStatus();
        await this.loadTriageBoard();
      },

      async refreshMeetingPrep() {
        await this.loadHubStatus();
        await this.loadMeetingPrep();
      },

      async loadHubStatus() {
        try {
          const st = await this.bridge.getHubStatus();
          // New Google permissions not yet approved: show the Approve access banner, keep hub views hidden.
          this.authApprovalUrl = (st && st.status === 'AUTH_REQUIRED' && st.authUrl) || null;
          if (this.authApprovalUrl) { this.hubFlags = null; this.clearTriageCache(); return; }
          if (!st || st.ok !== true) throw new Error((st && st.message) || 'Hub status unavailable');
          this.hubFlags = (st && st.flags) || null;
          this.hubDryRun = !!(st && st.dryRun);
          this.hubLastRun = (st && st.lastRun) || null;
          this.hubCounts = (st && st.counts) || {};
          if (this.showTriageNav) this.hydrateTriageCache();
          else this.clearTriageCache();
        } catch (err) {
          this.hubFlags = null;
          this.clearTriageCache();
          console.error('loadHubStatus: hub status unavailable, Triage and Meeting Prep stay hidden', err.stack);
        }
      },

      initHub() {
        try {
          const saved = JSON.parse(localStorage.getItem('dayPlannerHubReadLater') || '[]');
          if (Array.isArray(saved)) this.triageReadLater = saved.filter((x) => typeof x === 'string');
        } catch (err) {
          console.error('initHub: Read Later list unreadable from localStorage, starting empty', err.stack);
          this.triageReadLater = [];
        }
        try {
          this.hubTrialHiddenOn = localStorage.getItem('dayPlannerTrialBannerHiddenOn') || '';
        } catch (err) {
          console.error('initHub: could not read the trial banner hide date from localStorage, showing the banner:', err.stack);
          this.hubTrialHiddenOn = '';
        }
        setInterval(() => { this.hubNowMs = Date.now(); }, 60000);
        return this.loadHubStatus();
      },

      loadTriageBoard() {
        // One request at a time: the background prefetch and opening Triage share it.
        if (this.triageLoadPromise) return this.triageLoadPromise;
        this.triageLoading = true;
        this.triageLoadPromise = (async () => {
          try {
            const board = await this.bridge.getTriageBoard({});
            if (!board || board.ok !== true) throw new Error((board && board.message) || 'Triage board unavailable');
            this.triageBoard = board;
            this.triageStale = false;
            this.triageSavedAt = Date.now();
            this.saveTriageCache(board);
            this.resolveError('load-triage');
          } catch (err) {
            console.error('Triage board failed to load, any saved board stays on screen marked stale:', err.stack);
            this.reportError('load-triage', 'Triage board failed to load: ' + (err.message || err), { retry: () => this.loadTriageBoard() });
          } finally {
            this.triageLoading = false;
            this.triageLoadPromise = null;
          }
        })();
        return this.triageLoadPromise;
      },

      prefetchTriage() {
        if (!this.showTriageNav) return null;
        return this.loadTriageBoard();
      },

      // Last board, this browser tab only (sessionStorage is cleared when the tab closes). Only the
      // fields the rows display are kept, so a new server field never lands in storage by accident.
      saveTriageCache(board) {
        try {
          const queues = {};
          Object.keys(board.queues || {}).forEach((q) => {
            queues[q] = (board.queues[q] || []).map((item) => {
              const kept = {};
              TRIAGE_CACHE_FIELDS.forEach((f) => { if (f in item) kept[f] = item[f]; });
              return kept;
            });
          });
          sessionStorage.setItem(TRIAGE_CACHE_KEY, JSON.stringify({ savedAt: this.triageSavedAt, queues }));
        } catch (err) {
          console.error('saveTriageCache: could not save the Triage board, the next page load waits for the server:', err.stack);
        }
      },

      hydrateTriageCache() {
        if (this.triageSavedAt) return;
        try {
          const raw = sessionStorage.getItem(TRIAGE_CACHE_KEY);
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (!saved || typeof saved.savedAt !== 'number' || !saved.queues || typeof saved.queues !== 'object' || Array.isArray(saved.queues)) {
            console.error('hydrateTriageCache: saved Triage board has the wrong shape, ignoring it');
            return;
          }
          this.triageBoard = { ok: true, queues: saved.queues };
          this.triageSavedAt = saved.savedAt;
          this.triageStale = true;
        } catch (err) {
          console.error('hydrateTriageCache: could not read the saved Triage board, waiting for the server:', err.stack);
        }
      },

      clearTriageCache() {
        try {
          sessionStorage.removeItem(TRIAGE_CACHE_KEY);
        } catch (err) {
          console.error('clearTriageCache: could not remove the saved Triage board:', err.stack);
        }
        this.triageBoard = { queues: {} };
        this.triageStale = false;
        this.triageSavedAt = 0;
      },

      async runTriageAction(label, call) {
        try {
          const r = await call();
          this.triageNotice = { kind: r.ok ? 'ok' : 'error', text: label + ': ' + r.message, url: r.targetUrl || null };
          if (!r.ok) console.error('Triage action failed:', label, r);
          if (r.errorCode === 'MODE_CHANGED') await this.loadHubStatus();
          await this.loadTriageBoard();
          return r;
        } catch (err) {
          console.error('Triage action threw:', label, err.stack);
          this.triageNotice = { kind: 'error', text: label + ' failed: ' + (err.message || err), url: null };
          return null;
        }
      },

      triageTask(item, today) {
        const priority = today ? (item.score >= 8 ? 'A1' : 'B1') : (item.score >= 4 ? 'B1' : 'C1');
        return this.runTriageAction(today ? 'Task Today' : 'Task Later', () => this.bridge.routeThreadToTask(item.threadId, { today, priority, ...this.hubModeOpts() }));
      },

      dismissTriageEntry(item) {
        return this.runTriageAction('Dismiss', () => this.bridge.dismissTriageItem(item.threadId, this.hubModeOpts()));

      archiveTriageEntry(item) {

      applyFutureMatrix(matrix) {
        Object.keys(matrix.months || {}).forEach(monthKey => {
          (matrix.months[monthKey] || []).forEach(item => {
            if (!item._transferDate) item._transferDate = `${monthKey}-01`;
          });

        this.futureMatrix = matrix;

      // Bumps the year’s edit guard and writes the current live futureMatrix through to the
      // cache. Called after any in-place mutation so a subsequent visit (or a background
      // revalidation already in flight) never reads back stale data.
      syncFutureMatrixCacheFromLiveState() {
        const year = this.futureMatrixYear;
        this.futureMatrixEditSeq[year] = (this.futureMatrixEditSeq[year] || 0) + 1;
        dpSetCachedFutureMatrix(year, this.futureMatrix);
      },

      // Stale-while-revalidate + IndexedDB hydration, same pattern as loadDayData/loadMasterTasks.
      async loadFutureMatrix() {
        const year = this.futureMatrixYear;
        const cached = dpGetCachedFutureMatrix(year) || await dpHydrateFutureMatrixFromIdb(year);
        if (cached) this.applyFutureMatrix(cached);
        const seqAtFetchStart = this.futureMatrixEditSeq[year] || 0;
        try {
          const matrix = await this.bridge.getFutureMatrix(year);
          if (year !== this.futureMatrixYear) return; // user navigated to a different year
          if ((this.futureMatrixEditSeq[year] || 0) !== seqAtFetchStart) return; // superseded by a local edit
          dpSetCachedFutureMatrix(year, matrix, { synced: true });
          this.applyFutureMatrix(matrix);
          this.resolveError(`load-future:${year}`);
        } catch (err) {
          console.error('loadFutureMatrix: refresh failed; showing cached matrix (if any) with a stale notice:', err.stack);
          if (year !== this.futureMatrixYear) return;
          if (cached) {
            this.showStaleNotice(`load-future:${year}`, `Future Planning ${year}`, cached, err);
          } else {
            this.reportError(`load-future:${year}`, `Could not load Future Planning Matrix: ${err.message || err.toString()}`, { retry: () => this.loadFutureMatrix() });
          }
        }
      },

      // Optimistic status change that rolls back (UI only; the cache is written on success only)
      // if the Tasks write fails, is unavailable, or reports the item missing (null).
      async saveFutureItemStatus(mm, item, newStatus) {
        const year = this.futureMatrixYear;
        const monthKey = this.futureMonthKey(mm);
        const previous = item.status;
        item.status = newStatus;
        try {
          dpRequireSaved(await dpCallBridge(this.bridge, [['updateFutureItemStatus', [year, monthKey, item.id, newStatus]]], 'Future Planning item status'), 'Future Planning item status');
        } catch (err) {
          console.error('saveFutureItemStatus: save failed; status rolled back to last saved value:', err.stack);
          dpRestoreIfUnchanged(item, 'status', newStatus, previous);
          this.reportError(`future-status:${item.id}`, `Could not save item status: ${err.message || err.toString()}`);
          return;

        this.resolveError(`future-status:${item.id}`);

      async transferFutureItemToDay(mm, item) {
        const monthKey = this.futureMonthKey(mm);
        const targetDate = item._transferDate;
        if (!targetDate) return;
        try {
          const transferred = await this.bridge.transferFutureItem(this.futureMatrixYear, monthKey, item.id, targetDate, 'A');
          if (transferred) {
            const items = this.futureMatrix.months[monthKey] || [];
            const idx = items.findIndex(i => i.id === item.id);
            if (idx !== -1) items.splice(idx, 1);
            this.syncFutureMatrixCacheFromLiveState();
            // The transfer created a new daily task on targetDate without us holding its full
            // live state here -- invalidate rather than guess, same as moveMasterTaskToDate.
            dpInvalidateCached(targetDate);
          }
        } catch (err) {
          console.error('transferFutureItemToDay error:', err.stack);

      dayPickerCells() {
        const y = this.dayPickerYear || new Date().getFullYear();
        const m = this.dayPickerMonth || (new Date().getMonth() + 1);
        const firstDay = new Date(y, m - 1, 1);
        const lastDay = new Date(y, m, 0);
        const totalDays = lastDay.getDate();
        const startDayOfWeek = firstDay.getDay();
        const prevMonthLastDay = new Date(y, m - 1, 0).getDate();
        const todayStr = getLocalDateStr();
        const cells = [];

        for (let i = startDayOfWeek - 1; i >= 0; i--) {
          const day = prevMonthLastDay - i;
          const prevM = m === 1 ? 12 : m - 1;
          const prevY = m === 1 ? y - 1 : y;
          const dateStr = prevY + '-' + String(prevM).padStart(2, '0') + '-' + String(day).padStart(2, '0');
          cells.push({
            dayNum: day,
            dateStr: dateStr,
            isCurrentMonth: false,
            isToday: dateStr === todayStr,
            isSelected: dateStr === this.selectedDate
          });
        }

        for (let day = 1; day <= totalDays; day++) {
          const dateStr = y + '-' + String(m).padStart(2, '0') + '-' + String(day).padStart(2, '0');
          cells.push({
            dayNum: day,
            dateStr: dateStr,
            isCurrentMonth: true,
            isToday: dateStr === todayStr,
            isSelected: dateStr === this.selectedDate
          });
        }

        let nextDay = 1;
        const nextM = m === 12 ? 1 : m + 1;
        const nextY = m === 12 ? y + 1 : y;
        while (cells.length % 7 !== 0 || cells.length < 35) {
          const dateStr = nextY + '-' + String(nextM).padStart(2, '0') + '-' + String(nextDay).padStart(2, '0');
          cells.push({
            dayNum: nextDay,
            dateStr: dateStr,
            isCurrentMonth: false,

      // mark: saveQueue.mark() taken before the server read that produced data, or null when
      // data is the local cache. Tasks with an unsaved status keep their on-screen value.
      applyDailyData(data, mark = null) {
        this.dailyTasks = this.reconcileReloadedTasks(data.tasks || [], this.dailyTasks, mark).live;
        this.calendarEvents = data.calendarEvents || [];
        this.dailyNote = data.noteContent || '';
        this.dailyDocUrl = data.docUrl || '';
        this.noteCards = this.parseDailyNoteToCards(this.dailyNote);
        this.buildScheduleGrid();
        this.buildIndexRecords();
        if (this.dailyNote && this.dailyNote.trim()) {

        }
      },

      // Merges a reloaded task list (a server read since mark, or the cache when mark is null)
      // with the per-task save queue instead of replacing the screen wholesale. For each save
      // kind (status, title, star) whose save is queued, in flight, or submitted/confirmed after
      // the read began, the task keeps its on-screen object and those fields (other fields take
      // the reloaded copy), so the in-flight save still rolls back the object on screen. A task
      // with a delete pending (or confirmed after the read began) is left out entirely, so a
      // reload never resurrects it. Returns { live, confirmed }: live for the screen, confirmed
      // (values known saved) for the cache. Tasks missing from the reloaded list are dropped
      // (the server owns membership).
      reconcileReloadedTasks(incoming, liveList, mark) {
        const liveById = new Map((liveList || []).map(t => [t.id, t]));
        const live = [];
        const confirmed = [];
        (incoming || []).forEach(s => {
          if (this.taskDeleteHidesRead(s.id, mark)) return;
          let saved = s;
          const kept = [];
          TASK_SAVE_KINDS.forEach(kind => {
            const r = this.saveQueue.reconcile(`${kind.prefix}:${s.id}`, kind.value(s), mark);
            if (r.confirmed !== undefined && !kind.same(r.confirmed, kind.value(s))) saved = { ...saved, ...kind.fields(r.confirmed) };
            if (r.keepLocal) kept.push(kind);
          });
          confirmed.push(saved);
          if (kept.length === 0) {
            live.push(s);
            return;
          }
          const keptFields = new Set();
          kept.forEach(kind => Object.keys(kind.fields(kind.value(s))).forEach(f => keptFields.add(f)));
          const local = liveById.get(s.id);
          if (local) {
            Object.keys(s).forEach(f => { if (!keptFields.has(f)) local[f] = s[f]; });
            live.push(local);
            return;
          }
          // No object on screen (e.g. navigated away and back): show the confirmed copy with the
          // latest value of every save still queued or in flight.
          const shown = { ...saved };
          kept.forEach(kind => {
            const key = `${kind.prefix}:${s.id}`;
            if (this.saveQueue.unsaved(key)) Object.assign(shown, kind.fields(this.saveQueue.latest(key)));
          });
          live.push(shown);
        });
        return { live, confirmed };
      },

      // True while a delete of this task is queued or in flight, or when it was confirmed after
      // the read behind mark began (that read may predate it): the reloaded copy must not bring
      // the task back. mark null (a cache copy): hidden once any delete of it was confirmed.
      taskDeleteHidesRead(taskId, mark) {
        const key = `task-delete:${taskId}`;
        if (this.saveQueue.unsaved(key)) return true;
        return this.saveQueue.reconcile(key, false, mark).confirmed === true;
      },

      // The cache copy of a live task: a field whose save is still queued or in flight holds its
      // last confirmed value, so writing one task through to the cache never records another
      // task (or another field) as saved before Google confirmed it.
      confirmedTaskCopy(t) {
        let out = t;
        TASK_SAVE_KINDS.forEach(kind => {
          const key = `${kind.prefix}:${t.id}`;
          if (!this.saveQueue.unsaved(key)) return;
          const confirmed = this.saveQueue.confirmed(key);
          if (confirmed !== undefined) out = { ...out, ...kind.fields(confirmed) };
        });
        return out;
      },

      confirmedTaskList(list) {
        return (list || []).map(t => this.confirmedTaskCopy(t));
      },

      noteSaveDebouncing(dateStr) {
        return Object.prototype.hasOwnProperty.call(this.noteSaveTimers, dateStr);
      },

      // Note counterpart of reconcileReloadedTasks for a server read of dateStr since mark. While
      // a save of that note is debouncing, queued, in flight, or submitted/confirmed after the
      // read began, the local text (the cache write-through) stays. Returns { text, saved,
      // unsaved }: text for the screen and cache, saved for savedNoteByDate (the rollback
      // target), unsaved true when text differs from saved (the cache must not be stamped synced).
      reconcileReloadedNote(dateStr, serverNote, mark) {
        const key = `save-note:${dateStr}`;
        const r = this.saveQueue.reconcile(key, serverNote || '', mark);
        const saved = typeof r.confirmed === 'string' ? r.confirmed : (serverNote || '');
        if (!r.keepLocal && !this.noteSaveDebouncing(dateStr)) return { text: serverNote, saved, unsaved: false };
        const cachedEntry = dpGetCached(dateStr);
        const latest = this.saveQueue.latest(key);
        let text = serverNote;
        if (cachedEntry && typeof cachedEntry.noteContent === 'string') text = cachedEntry.noteContent;
        else if (typeof latest === 'string') text = latest;
        return { text, saved, unsaved: (text || '') !== saved };
      },

      // Offline-copy (stale) notices are about the day on screen: leaving a day resolves its
      // notice (the next visit re-checks and re-files it if still offline). Failures stay.
      resolveStaleDayNotices(keepDate) {
        const keep = `load-day:${keepDate}`;
        const drop = e => e.kind === 'stale' && e.key.startsWith('load-day:') && e.key !== keep;
        if (!(this.errorTray || []).some(drop)) return;
        this.errorTray = this.errorTray.filter(e => !drop(e));
      },

      bumpDailyEditSeq(dateStr) {
        this.dailyEditSeq[dateStr] = (this.dailyEditSeq[dateStr] || 0) + 1;
      },

      // Snapshots the currently-open day’s live task/event state into the cache. Called after any
      // in-place mutation of this.dailyTasks/this.calendarEvents so a subsequent revisit of this
      // date (or a background prefetch elsewhere) does not read back stale pre-edit data. Tasks
      // are written with confirmed values only (confirmedTaskList).
      syncDailyCacheFromLiveState(dateStr) {
        const targetDate = dateStr || this.selectedDate;
        if (targetDate !== this.selectedDate) return;
        this.bumpDailyEditSeq(targetDate);
        const existing = dpGetCached(targetDate) || { noteContent: this.dailyNote, docUrl: this.dailyDocUrl };
        dpSetCached(targetDate, Object.assign({}, existing, {
          tasks: this.confirmedTaskList(this.dailyTasks),
          calendarEvents: this.calendarEvents,
          docUrl: this.dailyDocUrl
        }));
      },

      // Stale-while-revalidate: render instantly from cache (memory, then IndexedDB) if present,
      // then always fetch fresh data in the background to both update the view (if still on this
      // date) and refill the cache. Guards every apply against the user having navigated to a
      // different date while this fetch was in flight (google.script.run responses can arrive out
      // of order), AND against a local edit (note typing, task mutation) landing while the fetch
      // was in flight -- otherwise a slow revalidation response overwrites newer local state with
      // stale server data, and the user’s in-progress edit is silently reverted mid-keystroke.
      async loadDayData() {
        const dateStr = this.selectedDate;
        this.resolveStaleDayNotices(dateStr);
        let cached = dpGetCached(dateStr);
        if (!cached) {
          cached = await dpHydrateFromIdb(dateStr);
        }
        if (cached) {
          this.applyDailyData(cached);
        }
        this.dailyLoading = !cached;
        const seqAtFetchStart = this.dailyEditSeq[dateStr] || 0;
        const mark = this.saveQueue.mark();
        try {
          const data = await this.bridge.getDailyData(dateStr);
          const editedWhileFetching = (this.dailyEditSeq[dateStr] || 0) !== seqAtFetchStart;
          if (editedWhileFetching) {
            // A local edit already wrote a newer version into the cache; this response is now
            // stale relative to it -- drop it instead of caching/applying over the newer edit.
            // The next navigation away and back will revalidate again.
            return;
          }
          // Saves still pending (or confirmed after this read began) are merged, not replaced:
          // the cache gets only confirmed task values, the note keeps its unsaved text.
          const onScreen = dateStr === this.selectedDate;
          const tasks = this.reconcileReloadedTasks(data.tasks || [], onScreen ? this.dailyTasks : [], mark);
          const note = this.reconcileReloadedNote(dateStr, data.noteContent, mark);
          // An unsaved note kept in the entry means it does not match Google: no synced stamp.
          dpSetCached(dateStr, { ...data, tasks: tasks.confirmed, noteContent: note.text }, { synced: !note.unsaved });
          // Last note text known to be saved in Google Docs for this date: the rollback target if
          // a later note save fails (see scheduleDailyNoteSave).
          this.savedNoteByDate[dateStr] = note.saved;
          this.resolveError(`load-day:${dateStr}`);
          if (dateStr !== this.selectedDate) return; // user navigated away; cached for next visit
          const problems = [data.error, ...(data.warnings || [])].filter(Boolean);
          if (problems.length > 0) this.reportError(`load-day:${dateStr}`, problems.join(' | '));
          this.applyDailyData({ ...data, noteContent: note.text }, mark);
        } catch (err) {
          console.error('🔥 loadDayData: refresh failed; showing cached day (if any) with a stale notice:', err.stack);
          if (dateStr === this.selectedDate) {
            if (cached) {
              this.showStaleNotice(`load-day:${dateStr}`, `Daily page ${dateStr}`, cached, err);
            } else {
              this.reportError(`load-day:${dateStr}`, `Error loading daily workspace: ${err.message || err.toString()}`);
            }
          }
        } finally {
          if (dateStr === this.selectedDate) this.dailyLoading = false;
        }
        this.scheduleDailyRangePrefetch();
      },

      // Debounced background prefetch of the +/-14-day window around the current day, so
      // repeated day-by-day navigation hits the cache instead of a fresh round trip each time.
      // Debounced so rapid arrow-key/click navigation does not fire one range call per day.
      scheduleDailyRangePrefetch() {
        if (this.rangePrefetchTimer) clearTimeout(this.rangePrefetchTimer);
        const centerDate = this.selectedDate;
        this.rangePrefetchTimer = setTimeout(() => {
          this.runDailyRangePrefetch(centerDate);
        }, 500);
      },

      async runDailyRangePrefetch(centerDateStr) {
        if (!this.bridge || typeof this.bridge.getDailyDataRange !== 'function') return;
        const windowDates = dpBuildDateWindow(centerDateStr, 14);
        const missing = windowDates.filter(d => !dpGetCached(d));
        if (missing.length === 0) return;
        const first = windowDates[0];
        const last = windowDates[windowDates.length - 1];
        try {
          const result = await this.bridge.getDailyDataRange(first, last);
          this.primeRangeResult(result, 'prefetch-range',
            `Background load of ${first} to ${last} was incomplete, so those days were not cached and each loads on its own when opened`,
            () => this.runDailyRangePrefetch(centerDateStr));
        } catch (err) {
          console.error('🔥 background range prefetch failed, days load on demand instead:', err.stack);
        }
      },

      // Primes the cache from a getDailyDataRange result only when the server read was clean.
      // Its warnings are range-wide (a failed Calendar/Tasks/Docs read can leave any day in the
      // range empty), so a result with warnings caches nothing -- an empty calendar must never
      // be stored as a synced day -- and files a tray entry under key (message: what happened,
      // followed by the warnings). A clean result resolves that entry. Throws on a malformed
      // result. Returns true when the days were primed.
      primeRangeResult(result, key, message, retry) {
        if (!result || typeof result.days !== 'object' || result.days === null) {
          throw new Error('getDailyDataRange returned no days');
        }
        const warnings = (Array.isArray(result.warnings) ? result.warnings : []).filter(Boolean);
        if (warnings.length > 0) {
          console.error(`🔥 ${key}: range read returned warnings; nothing cached:`, warnings.join(' | '));
          this.reportError(key, `${message}: ${warnings.join(' | ')}`, { retry });
          return false;
        }
        dpPrimeFromRange(result.days);
        this.resolveError(key);
        return true;
      },

      initHeaderResize(e) {
        e.preventDefault();
        this.isHeaderResizing = true;
        const startX = e.clientX || (e.touches && e.touches[0].clientX);
        const startWidth = this.topicColWidth;
        const onMouseMove = (moveEvt) => {
          if (!this.isHeaderResizing) return;
          const currentX = moveEvt.clientX || (moveEvt.touches && moveEvt.touches[0].clientX);
          const diff = currentX - startX;
          this.topicColWidth = Math.max(60, Math.min(220, startWidth + diff));
        };
        const onMouseUp = () => {
          this.isHeaderResizing = false;
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          window.removeEventListener('touchmove', onMouseMove);
          window.removeEventListener('touchend', onMouseUp);
        };
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('touchmove', onMouseMove);
