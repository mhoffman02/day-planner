          sourceDateStr,
          targetDate: defaultTargetDate,
          anchor: this._computeForwardAnchor(evt)
        };
        pending.timer = setTimeout(() => this.commitPendingForward(pending), 10000);
        this.toasts.push(pending);
      },

      // Positions the pending-forward popover just below (or, if there’s no room, above) the
      // clicked status button, clamped to stay on-screen. Assumes a ~280x160px popover since
      // it hasn’t rendered yet to measure. Falls back to a fixed top-right spot (null) when
      // there’s no click event to anchor to (e.g. a future non-UI caller).
      _computeForwardAnchor(evt) {
        const target = evt && (evt.currentTarget || evt.target);
        if (!target || typeof target.getBoundingClientRect !== 'function') return null;
        const rect = target.getBoundingClientRect();
        const POPOVER_W = 280;
        const POPOVER_H = 160;
        const GAP = 8;
        const left = Math.min(Math.max(8, rect.left), window.innerWidth - POPOVER_W - 8);
        const fitsBelow = rect.bottom + GAP + POPOVER_H <= window.innerHeight;
        const top = fitsBelow ? rect.bottom + GAP : Math.max(8, rect.top - POPOVER_H - GAP);
        return { top, left };
      },

      // Commits a pending forward (see startPendingForward) to whichever target date is
      // currently set on it -- the untouched tomorrow default, or a date the user picked --
      // and removes its toast. No-ops if already settled (committed or cancelled).
      async commitPendingForward(pending) {
        if (pending.settled) return;
        pending.settled = true;
        clearTimeout(pending.timer);
        this.toasts = this.toasts.filter(t => t.id !== pending.id);

        const { task, sourceDateStr, targetDate, previousStatus } = pending;
        try {
          const result = await this.bridge.forwardDailyTask(sourceDateStr, task.id, { title: task.title, category: task.category }, targetDate);
          if (!result) {
            task.status = previousStatus;
            this.errorMessage = `Task "${task.title}" no longer exists in Google Tasks — could not forward it.`;
            return;
          }
          // Don’t trust the server’s echoed-back status here: the Google Tasks API only
          // natively represents completed/needsAction, so updateDailyTask’s response always
          // downgrades app-only statuses to ’•’ on the round trip (see its JSDoc in Code.gs).
          // The optimistic ’→’ set in startPendingForward is the correct value; keep it.
          task.status = '→';
          task.forwardedToDate = targetDate;
          if (result.forwardedTask._queuedOffline) await this.refreshOutboxCount();
          this.showToast(`Forwarded "${task.title}" to ${targetDate}.`, 'success', 6000, 'Task Forwarded');
        } catch (err) {
          task.status = previousStatus;
          console.error('🔥 commitPendingForward error:', err);
          this.errorMessage = `Could not forward task: ${err.message || err.toString()}`;
        }
        await this.trigger2WaySync();
      },

      // Applies a user-picked alternate target date to a still-pending forward and commits
      // it right away -- no reason to keep counting down once the user has made an explicit
      // choice.
      async pickForwardDate(pending, newDateStr) {
        if (pending.settled || !newDateStr) return;
        pending.targetDate = newDateStr;
        await this.commitPendingForward(pending);
      },

      // Cancels a still-pending forward: reverts the task to its pre-forward status and
      // dismisses its toast without ever calling the backend.
      cancelPendingForward(pending) {
        if (pending.settled) return;
        pending.settled = true;
        clearTimeout(pending.timer);
        pending.task.status = pending.previousStatus;
        this.toasts = this.toasts.filter(t => t.id !== pending.id);
      },

      async moveMasterTaskToDate(mTask) {
        // Busy-guard: without this, a double-click/double-tap re-entered this whole async
        // flow before the first run’s toast even appeared, creating two duplicate daily
        // tasks and two duplicate "Task Transferred" toasts for one click.
        if (mTask._moving) return;
        // Guard against re-moving an already-moved master task: the row date
        // input/button are hidden once movedTo is set, but this closes the gap for
        // any stale-DOM click (e.g. a queued click firing after markMasterTaskMoved
        // set movedTo) -- each move creates a brand new independent daily task, so a
        // repeat call here duplicates it instead of no-opping.
        if (mTask.movedTo) return;
        mTask._moving = true;
        const targetDate = mTask._moveDate || getLocalDateStr();
        try {
          const transferred = await this.bridge.transferMasterTask(mTask, targetDate, 'A');
          if (transferred) {
            // Only splice into the currently-viewed day’s list when that’s actually the
            // target -- pushing a task transferred to some other date would make it show
            // up on the wrong day until the next reload.
            if (targetDate === this.selectedDate) this.dailyTasks.push(transferred);
            const updatedMaster = await this.bridge.markMasterTaskMoved(mTask.id, targetDate, transferred.id);
            if (updatedMaster) {
              mTask.movedTo = updatedMaster.movedTo;
              mTask.movedTaskId = updatedMaster.movedTaskId;
            }
            await this.trigger2WaySync();
            // No confirmation toast here on purpose -- the row itself now shows a "Moved to
            // <date>" note and the button returns to its normal state, which is confirmation
            // enough for a single-row action; a corner popup for this was more ceremony than
            // the action warranted.
          }
        } catch (err) {
          console.error('🔥 moveMasterTaskToDate error:', err);
          const errText = `Error moving master task: ${err.message || err.toString()}`;
          this.errorMessage = errText;
          this.showToast(errText, 'error', 10000, 'Task Transfer Error');
        } finally {
          mTask._moving = false;
        }
      },

      openEventModal(evt) {
        /* Mirrors src/calendarEngine.js#formatEventModalPayload gCalLink fallback:
           prefer the server-supplied direct event link (htmlLink), fall back to a
           pre-filled "create event" URL only if that is unavailable. */
        this.selectedEvent = {
          ...evt,
          gCalLink: evt.htmlLink || (('https:' + '/' + '/calendar.google.com/calendar/r/eventedit?text=') + encodeURIComponent(evt.title || ''))
        };
        this.eventModalOpen = true;
      },

      closeEventModal() {
        this.eventModalOpen = false;
        this.selectedEvent = null;
      },

      calculateEndTime(startStr = '09:00', durationMin = 25) {
        const [hStr, mStr] = startStr.split(':');
        const h = parseInt(hStr, 10) || 9;
        const m = parseInt(mStr, 10) || 0;
        const totalMinutes = h * 60 + m + parseInt(durationMin, 10);
        const endH = Math.min(23, Math.floor(totalMinutes / 60));
        const endM = totalMinutes % 60;
        return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
      },

      setEventDuration(durationMin) {
        this.newEventData.duration = durationMin;
        this.newEventData.endTime = this.calculateEndTime(this.newEventData.startTime, durationMin);
      },

      onStartTimeChange() {
        this.newEventData.endTime = this.calculateEndTime(
          this.newEventData.startTime,
          this.newEventData.duration || 25
        );
      },

      openCreateEventModal(timeKey, durationMin = 25) {
        const defaultStart = timeKey || '09:00';
        const defaultEnd = this.calculateEndTime(defaultStart, durationMin);

        this.newEventData = {
          title: '',
          startTime: defaultStart,
          endTime: defaultEnd,
          duration: durationMin,
          attendeesText: '',
          autoGoogleMeet: true,
          guestsCanModify: true,
          autoAgendaDoc: true,
          location: '',
          description: ''
        };
        this.createEventModalOpen = true;
        this.$nextTick(() => {
          const input = document.getElementById('evtTitleInput');
          if (input) input.focus();
        });
      },

      closeCreateEventModal() {
        this.createEventModalOpen = false;
      },

      launchNativeGCalCreate() {
        const title = encodeURIComponent(this.newEventData.title || 'New Appointment');
        const location = encodeURIComponent(this.newEventData.location || (this.newEventData.autoGoogleMeet ? 'Google Meet' : ''));
        
        let detailsText = this.newEventData.description || '';
        if (this.newEventData.autoAgendaDoc) {
          detailsText += (detailsText ? '\n\n' : '') + '📄 Meeting Agenda: Auto-created structured meeting notes';
        }
        const details = encodeURIComponent(detailsText);
        const addGuests = encodeURIComponent(this.newEventData.attendeesText || '');

        const dateFormatted = (this.selectedDate || getLocalDateStr()).replace(/-/g, '');
        const startH = (this.newEventData.startTime || '09:00').replace(':', '') + '00';
        const endH = (this.newEventData.endTime || '09:25').replace(':', '') + '00';
        const dates = `${dateFormatted}T${startH}/${dateFormatted}T${endH}`;

        let gCalUrl = ('https:' + '/' + '/calendar.google.com/calendar/render?action=TEMPLATE&text=') + title + '&dates=' + dates + '&location=' + location + '&details=' + details;
        if (addGuests) {
          gCalUrl += `&add=${addGuests}`;
        }
        window.open(gCalUrl, 'gCalNativeNewAppt', 'width=780,height=720,resizable=yes,scrollbars=yes');
        this.closeCreateEventModal();
      },

      async saveNewEvent() {
        if (!this.newEventData.title.trim()) return;
        let newEvt = null;
        try {
          const startIso = `${this.selectedDate}T${this.newEventData.startTime || '09:00'}:00`;
          const endIso = `${this.selectedDate}T${this.newEventData.endTime || '09:25'}:00`;

          const attendeesList = (this.newEventData.attendeesText || '')
            .split(/[,;]+/)
            .map(s => s.trim())
            .filter(Boolean);

          const autoGoogleMeet = this.newEventData.autoGoogleMeet;
          const guestsCanModify = this.newEventData.guestsCanModify;
          const autoAgendaDoc = this.newEventData.autoAgendaDoc;

          newEvt = {
            id: `evt_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            title: this.newEventData.title.trim(),
            startTime: startIso,
            endTime: endIso,
            location: this.newEventData.location ? this.newEventData.location.trim() : '',
            description: this.newEventData.description ? this.newEventData.description.trim() : '',
            meetLink: null,
            agendaDocUrl: null,
            attendees: attendeesList,
            guestsCanModify: false,
            gCalLink: ('https:' + '/' + '/calendar.google.com/calendar/r/day/') + this.selectedDate.replace(/-/g, '/')
          };

          this.calendarEvents.push(newEvt);
          this.buildScheduleGrid();
          this.closeCreateEventModal();

          // meetLink/agendaDocUrl are server-provisioned (real Google Meet conference +
          // Doc) via the Advanced Calendar Service; the optimistic entry above is
          // updated in place once the authoritative event comes back.
          if (this.bridge && typeof this.bridge.addCalendarEvent === 'function') {
            const saved = await this.bridge.addCalendarEvent(this.selectedDate, {
              ...newEvt,
              autoGoogleMeet,
              guestsCanModify,
              autoAgendaDoc
            });
            if (saved) {
              Object.assign(newEvt, saved);
              this.buildScheduleGrid();
              if (saved._queuedOffline) await this.refreshOutboxCount();
            }
          }
          await this.trigger2WaySync();
          this.showToast(`Saved appointment "${newEvt.title}"`, 'success', 5000, 'Appointment Created');
        } catch (err) {
          // Roll back the optimistic insert (this.calendarEvents.push(newEvt) above) if the
          // save never actually succeeded, so a failed create does not leave a phantom
          // appointment visible on the schedule grid — see commitPendingForward for the same
          // optimistic-update/rollback pattern applied to task forwarding.
          if (newEvt) {
            const idx = this.calendarEvents.indexOf(newEvt);
            if (idx !== -1) this.calendarEvents.splice(idx, 1);
            this.buildScheduleGrid();
          }
          console.error('🔥 saveNewEvent error:', err);
          const errText = `Error saving appointment: ${err.message || err.toString()}`;
          this.errorMessage = errText;
          this.showToast(errText, 'error', 10000, 'Calendar Error');
        }
      },

      toggleSearchModal() {
        this.searchModalOpen = !this.searchModalOpen;
        if (this.searchModalOpen) {
          this.runSearch();
          this.$nextTick(() => {
            document.querySelector('.search-input-field')?.focus();
          });
        }
      },

      closeSearchModal() {
        this.searchModalOpen = false;
      },

      runSearch() {
        const q = this.searchQuery.trim().toLowerCase();
        if (!q) {
          this.searchResults = { totalMatches: 0, calendar: [], tasks: [], notes: [], index: [] };
          return;
        }

        const res = { totalMatches: 0, calendar: [], tasks: [], notes: [], index: [] };

        this.calendarEvents.forEach(e => {
          if ((e.title || '').toLowerCase().includes(q) || (e.description || '').toLowerCase().includes(q)) {
            res.calendar.push(e);
            res.totalMatches++;
          }
        });

        [...this.dailyTasks, ...this.masterTasks].forEach(t => {
          if ((t.title || '').toLowerCase().includes(q)) {
            res.tasks.push(t);
            res.totalMatches++;
          }
        });

        if (this.dailyNote.toLowerCase().includes(q)) {
          res.notes.push({ date: this.selectedDate, content: this.dailyNote });
          res.totalMatches++;
        }

        this.indexRecords.forEach(i => {
          if ((i.summary || '').toLowerCase().includes(q) || (i.topic || '').toLowerCase().includes(q)) {
            res.index.push(i);
            res.totalMatches++;
          }
        });

        this.searchResults = res;
      },

      parseTask(title) {
        return parseTaskTitle(title);
      }
    }));
  }

  // Dual-registration: call directly if Alpine already started, otherwise wait for alpine:init.
  // In the shell DOM-mount scenario, Alpine starts from vendor/alpine.min.js (defer) before
  // bundle.script runs, so alpine:init has already fired — call directly.
  // In a standalone GAS deployment, alpine:init fires after this script, so the listener handles it.
  if (window.Alpine && typeof Alpine.data === 'function') {
    _registerPlannerApp();
  } else {
    document.addEventListener('alpine:init', _registerPlannerApp);
  }
</script>
